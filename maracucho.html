{
 id:"boda", n:21, unitName:U5,
 title:"La boda venezolana",
 sub:"Who's who, what happens, and the vocabulary for each part",
 intro:"November is the deadline that started all of this. A Venezuelan wedding has a shape: ceremony, cocktail, dinner, toasts, dancing, and the hora loca, a late-night costume-and-confetti party you should know about in advance. This lesson walks through the day in order with the words you'll need at each stage, the people you'll meet, and the phrases to introduce yourself as Maria's boyfriend to relatives you've never seen.",
 outro:"You know the day. The last lesson gives you the words for the toast, the congratulations, and the moment someone asks when you two are next.",
 homework:"Ask Maria to walk you through the guest list for the wedding: who's who, and who you should use usted with.",
 steps:[
 {title:"La gente y el día", body:`
  <h3>Who's who</h3>
  <table class="grammar-table">
   <tr><th>Palabra</th><th>Significado</th></tr>
   <tr><td>los novios</td><td>the couple (novio = groom, novia = bride; also boyfriend/girlfriend)</td></tr>
   <tr><td>el padrino / la madrina</td><td>best man / maid of honor, godparents of the wedding</td></tr>
   <tr><td>los padrinos</td><td>the wedding party (sponsors)</td></tr>
   <tr><td>los suegros</td><td>the in-laws</td></tr>
   <tr><td>los invitados</td><td>the guests</td></tr>
   <tr><td>el cura / el padre</td><td>the priest</td></tr>
   <tr><td>el juez</td><td>the judge (civil ceremony)</td></tr>
   <tr><td>la familia política</td><td>the in-law side of the family</td></tr>
   <tr><td>el consuegro / la consuegra</td><td>your child's spouse's parent (no English word)</td></tr>
  </table>
  <h3>The day, in order</h3>
  <table class="grammar-table">
   <tr><th>Momento</th><th>Vocabulario</th></tr>
   <tr><td>la ceremonia (civil o religiosa)</td><td>la iglesia, los votos (vows), los anillos (rings), "sí, acepto" (I do)</td></tr>
   <tr><td>el cóctel</td><td>los pasapalos (appetizers, Venezuelan word), los tequeños, el whisky (Venezuelan weddings run on whisky)</td></tr>
   <tr><td>la recepción / la fiesta</td><td>la mesa (table), el menú, la torta (cake, Venezuelan word)</td></tr>
   <tr><td>el brindis</td><td>the toast; "¡Salud!"; "¡Que vivan los novios!"</td></tr>
   <tr><td>el baile</td><td>la pista (dance floor), el primer baile, el vals (the waltz), la orquesta</td></tr>
   <tr><td>la hora loca</td><td>"crazy hour": around midnight, costumes, confetti, LED props, a burst of party music. Not optional.</td></tr>
   <tr><td>la despedida</td><td>saying goodbye, the luna de miel (honeymoon)</td></tr>
  </table>
  <div class="callout"><b>Music you'll hear:</b> salsa, merengue, reggaetón, gaita (Zulian Christmas music, and it's November so absolutely), and a Guaco block. You don't have to dance well. You have to dance. "¿Bailamos?" is your line.</div>
 `},
 {title:"Presentarte y ubicarte", body:`
  <p>You'll meet forty relatives in an hour. One formula, delivered with a handshake or a cheek kiss (one, on the right, for women; handshake or hug for men):</p>
  <div class="callout teal"><b>"Mucho gusto, soy Noah, el novio de Maria."</b> Nice to meet you, I'm Noah, Maria's boyfriend.</div>
  <p>Then, depending on who it is:</p>
  <ul>
   <li>To an elder: <i>Un placer conocerlo / conocerla.</i> (lo for men, la for women)</li>
   <li>To a peer: <i>¿Qué más? ¿Cómo estás?</i></li>
   <li>To a group: <i>Un placer conocerlos.</i></li>
   <li>When they say "ah, el famoso Noah": <i>Jaja, espero que hayan dicho cosas buenas.</i> (I hope they said good things.)</li>
  </ul>
  <h3>Finding your way</h3>
  <table class="grammar-table">
   <tr><th>Necesitas</th><th>Di</th></tr>
   <tr><td>your table</td><td>¿Dónde queda la mesa cinco? / ¿En qué mesa estamos?</td></tr>
   <tr><td>the bathroom</td><td>¿Dónde queda el baño?</td></tr>
   <tr><td>a drink</td><td>¿Me das un whisky con hielo? / una cerveza / un vino tinto</td></tr>
   <tr><td>to excuse yourself</td><td>Con permiso, ya vengo. (excuse me, be right back)</td></tr>
   <tr><td>to compliment the bride</td><td>Se ve hermosa. / ¡Qué linda está la novia!</td></tr>
   <tr><td>to compliment a peer</td><td>Estás muy elegante. (tú) / Está muy elegante. (usted)</td></tr>
   <tr><td>a photo</td><td>¿Nos tomamos una foto? / ¿Me tomas una foto con Maria?</td></tr>
  </table>
  <div class="callout"><b>The inevitable question:</b> "¿Y ustedes para cuándo?" (And when's your turn?). Have an answer ready. Light options: <i>"Estamos viendo."</i> (we're looking into it) · <i>"Pregúntale a Maria."</i> (ask Maria) · <i>"Primero tengo que aprender español."</i> (first I have to learn Spanish; always gets a laugh).</div>
 `},
 {title:"En contexto", body:`
  <div class="example-row"><div class="example-es">Mucho gusto, soy Noah, <span class="verb">el novio de Maria</span>.</div><div class="example-en">Nice to meet you, I'm Noah, Maria's boyfriend.</div><div class="example-note">Your line, forty times.</div></div>
  <div class="example-row"><div class="example-es">Los <span class="verb">pasapalos</span> están buenísimos, ¿de dónde son los tequeños?</div><div class="example-en">The appetizers are great, where are the tequeños from?</div><div class="example-note">pasapalos = Venezuelan for appetizers.</div></div>
  <div class="example-row"><div class="example-es">¿A qué hora es la <span class="verb">hora loca</span>?</div><div class="example-en">What time is the hora loca?</div><div class="example-note">Asking this marks you as someone who knows.</div></div>
  <div class="example-row"><div class="example-es">Maria, ¿<span class="verb">bailamos</span>? Suena Guaco.</div><div class="example-en">Maria, shall we dance? Guaco's on.</div><div class="example-note">bailar · nosotros as invitation.</div></div>
  <div class="example-row"><div class="example-es">Señora, <span class="verb">se ve hermosa</span>. Felicidades por su hija.</div><div class="example-en">Ma'am, you look beautiful. Congratulations on your daughter.</div><div class="example-note">To the mother of the bride.</div></div>
  <div class="example-row"><div class="example-es">¿Y ustedes para cuándo? <span class="verb">Estamos viendo</span>, jaja.</div><div class="example-en">And when's your turn? We're looking into it, haha.</div><div class="example-note">The dodge.</div></div>
 `},

/* ---------------------------------------------------------------- 22 */
{
 id:"brindis", n:22, unitName:U5,
 title:"Brindis y felicitaciones",
 sub:"A short toast, congratulations, and gracious goodbyes",
 intro:"You may not be asked to give a toast, but you will be at a table when someone raises a glass, and you will congratulate the couple, the parents, and probably the grandparents. This lesson gives you the fixed phrases (there's a script, and following it is the point), a 30-second toast you can memorize, the goodbyes that close a Venezuelan party, and the thank-yous for the family that hosted you. It ties every earlier lesson into one evening.",
 outro:"Twenty-two lessons complete. You're ready for November. Go back and retake anything under 9/10, then keep the daily session going.",
 homework:"Record yourself saying the toast from this lesson. Send it to Maria. Ask her to fix your accent, not your grammar.",
 steps:[
 {title:"Felicitar", body:`
  <table class="grammar-table">
   <tr><th>A quién</th><th>Qué decir</th></tr>

/* =====================================================================
   VERB ENGINE — present, preterite, imperfect, near future
   Primary drilling is tú + usted (what the family actually uses).
   The optional "vosotros" toggle drills Spain's second-person plural
   (sois, tenéis, coméis) in the present and near future, for Madrid.
===================================================================== */
const VERBS = [
 {inf:"hablar", en:"to speak"}, {inf:"cocinar", en:"to cook"},
 {inf:"comer", en:"to eat"}, {inf:"vivir", en:"to live"},
 {inf:"tener", en:"to have"}, {inf:"ser", en:"to be (identity)"},
 {inf:"estar", en:"to be (state/place)"}, {inf:"ir", en:"to go"},
 {inf:"hacer", en:"to do / make"}, {inf:"poder", en:"to be able to"},
 {inf:"decir", en:"to say"}, {inf:"querer", en:"to want"},
 {inf:"venir", en:"to come"}, {inf:"saber", en:"to know"},
 {inf:"conseguir", en:"to find / get (Venezuelan: to find)"},
 {inf:"llegar", en:"to arrive"}, {inf:"trabajar", en:"to work"},
 {inf:"salir", en:"to go out / leave"}, {inf:"ver", en:"to see"},
 {inf:"dar", en:"to give"}
];

// Persons index order: 0 yo, 1 tú, 2 vosotros, 3 usted, 4 nosotros, 5 ellos
const IRR = {
 ser:{ pres:["soy","eres","sois","es","somos","son"],
       pret:["fui","fuiste","fuiste","fue","fuimos","fueron"],
       impf:["era","eras","eras","era","éramos","eran"] },
 ir:{  pres:["voy","vas","vais","va","vamos","van"],
       pret:["fui","fuiste","fuiste","fue","fuimos","fueron"],
       impf:["iba","ibas","ibas","iba","íbamos","iban"] },
 ver:{ pres:["veo","ves","veis","ve","vemos","ven"],
       pret:["vi","viste","viste","vio","vimos","vieron"],
       impf:["veía","veías","veías","veía","veíamos","veían"] },
 dar:{ pres:["doy","das","dais","da","damos","dan"],
       pret:["di","diste","diste","dio","dimos","dieron"] },
 estar:{ pres:["estoy","estás","estáis","está","estamos","están"],
         pret:["estuve","estuviste","estuviste","estuvo","estuvimos","estuvieron"] },
 tener:{ pres:["tengo","tienes","tenéis","tiene","tenemos","tienen"],
         pret:["tuve","tuviste","tuviste","tuvo","tuvimos","tuvieron"] },
 hacer:{ pres:["hago","haces","hacéis","hace","hacemos","hacen"],
         pret:["hice","hiciste","hiciste","hizo","hicimos","hicieron"] },
 poder:{ pres:["puedo","puedes","podéis","puede","podemos","pueden"],
         pret:["pude","pudiste","pudiste","pudo","pudimos","pudieron"] },
 decir:{ pres:["digo","dices","decís","dice","decimos","dicen"],
         pret:["dije","dijiste","dijiste","dijo","dijimos","dijeron"] },
 querer:{ pres:["quiero","quieres","queréis","quiere","queremos","quieren"],
          pret:["quise","quisiste","quisiste","quiso","quisimos","quisieron"] },
 venir:{ pres:["vengo","vienes","venís","viene","venimos","vienen"],
         pret:["vine","viniste","viniste","vino","vinimos","vinieron"] },
 saber:{ pres:["sé","sabes","sabéis","sabe","sabemos","saben"],
         pret:["supe","supiste","supiste","supo","supimos","supieron"] },
 salir:{ pres:["salgo","sales","salís","sale","salimos","salen"] },
 llegar:{ pret:["llegué","llegaste","llegaste","llegó","llegamos","llegaron"] },
 conseguir:{ pres:["consigo","consigues","conseguís","consigue","conseguimos","consiguen"],
             pret:["conseguí","conseguiste","conseguiste","consiguió","conseguimos","consiguieron"] }
};

function conjugate(inf, tense, pIdx){
  // tense: pres | pret | impf | futr (near future: ir a + inf)
  if(tense === "futr"){
    const ir = IRR.ir.pres;
    return ir[pIdx] + " a " + inf;
  }
  const irr = IRR[inf];
  if(irr && irr[tense]) return irr[tense][pIdx];
  const stem = inf.slice(0,-2), end = inf.slice(-2);
  const E = {
    pres:{ ar:["o","as","áis","a","amos","an"], er:["o","es","éis","e","emos","en"], ir:["o","es","ís","e","imos","en"] },
    pret:{ ar:["é","aste","aste","ó","amos","aron"], er:["í","iste","iste","ió","imos","ieron"], ir:["í","iste","iste","ió","imos","ieron"] },
    impf:{ ar:["aba","abas","abas","aba","ábamos","aban"], er:["ía","ías","ías","ía","íamos","ían"], ir:["ía","ías","ías","ía","íamos","ían"] }
  };
  return stem + E[tense][end][pIdx];
}

const TENSE_NAMES = {pres:"Presente", pret:"Pretérito", impf:"Imperfecto", futr:"Futuro cercano (ir a...)"};
const PERSON_LABELS = ["yo","tú","vosotros","usted","nosotros","ellos"];

/* =====================================================================
   STATE, STORAGE, SPACED REPETITION  (schema v2)
   Boxes 0..7 with expanding intervals (days). A miss demotes two boxes.
   Cards never retire. Daily sessions pull "retention checks" from cards
   you answered correctly a while ago and haven't been re-tested lately.
   "Retained long term" is earned by answering correctly after a gap of
   30+ days, and revoked by any miss.
   v2 adds: lec (lesson progress), escTipo (type-first listening),
   lastRet per card (when it was last used as a retention check).
===================================================================== */
const INTERVALS = [0, 1, 3, 7, 16, 35, 75, 150];
const MASTER_BOX = 5;
const LS_KEY = "maracucho_trainer_v1";   // same key: v1 saves migrate in place
const DAY = 86400000;
const SCHEMA = 2;

function freshState(){
  return { v:SCHEMA, xp:0, vos:false, boda:false, escTipo:true, cards:{}, lec:{}, hist:{}, created:Date.now(), ts:0 };
}
/* v1 -> v2. Card format changed from "read the English hint" to "produce
   it from context", so old boxes overstate what you can actually do. Cap
   every box at 3 (a week out, max) so everything comes back around in the
   new format within days. XP, history and lifetime counts are untouched. */
function migrate(o){
  if(!o || typeof o !== "object") return freshState();
  if(o.v === SCHEMA) return o;
  if(o.v === 1){
    const m = Object.assign(freshState(), o, {v:SCHEMA, lec:{}, escTipo:true, migratedFrom:1, migratedAt:Date.now()});
    for(const id in m.cards){
      const c = m.cards[id];
      if(c.b > 3){ c.b = 3; c.due = Math.min(c.due || 0, Date.now() + 3*DAY); }
    }
    return m;
  }
  return freshState();
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const o = JSON.parse(raw); if(o && (o.v === 1 || o.v === SCHEMA)) return migrate(o); }
  }catch(e){}
  return freshState();
}
let S = loadState();
if(S.migratedFrom === 1 && !S.migrationSaved){ S.migrationSaved = true; try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

function save(){
  S.ts = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ console.warn("No se pudo guardar", e); }
  if(typeof syncPushSoon === "function") syncPushSoon();
}
function today(){ const d = new Date(); return d.toISOString().slice(0,10); }
function card(id){
  if(!S.cards[id]) S.cards[id] = {b:-1, due:0, last:0, lastOk:0, lastRet:0, ok:0, no:0, proven:false};
  return S.cards[id];
}
function logAnswer(correct, xp){
  const t = today();
  if(!S.hist[t]) S.hist[t] = {c:0, t:0, xp:0};
  S.hist[t].t++; if(correct) S.hist[t].c++;
  S.hist[t].xp += xp; S.xp += xp;
  save(); renderXP();
}
function gradeCard(id, result, isRet){ // result: "no" | "close" | "yes"
  const c = card(id); const now = Date.now();
  if(isRet) c.lastRet = now;
  if(result === "yes"){
    c.ok++;
    if(c.b >= MASTER_BOX && c.lastOk && (now - c.lastOk) >= 30*DAY) c.proven = true;
    c.b = Math.min(INTERVALS.length-1, (c.b < 0 ? 0 : c.b) + 1);
    c.lastOk = now;
    const iv = INTERVALS[c.b] * (0.9 + Math.random()*0.25); // jitter
    c.due = now + iv*DAY;
    logAnswer(true, isRet ? 14 : 10);
  } else if(result === "close"){
    if(c.b < 0) c.b = 0;
    c.due = now + 1*DAY;
    logAnswer(true, 4);
  } else {
    c.no++; c.proven = false;
    c.b = Math.max(0, c.b - 2);
    c.due = now; // back into active rotation immediately
    logAnswer(false, 1);
  }
  c.last = now; save();
}
/* Lesson gating: a card with an "l" field isn't introduced until that
   lesson has been passed. Vocabulary without "l" is always available. */
function unlocked(v){
  if(v.t === "boda" && !S.boda) return false;
  if(v.l && !(S.lec[v.l] && S.lec[v.l].done)) return false;
  return true;
}
function dueCards(){
  const now = Date.now();
  return VOCAB.filter(v => { const c = S.cards[v.id]; return c && c.b >= 0 && c.due <= now; });
}
function newCards(n){
  return VOCAB.filter(v => (!S.cards[v.id] || S.cards[v.id].b < 0) && unlocked(v)).slice(0, n);
}
/* THE FIX for "it only ever asks me about mandoca":
   The old pool was "box >= 5", which only 4 cards had ever reached, so the
   same 3-of-4 came up every session. Now the pool is anything you got
   right at least two weeks ago and haven't been retention-checked in the
   last week, ranked by least-recently-checked, and drawn from the top 20.
   If that pool is thin (early days after the migration), it widens to a
   one-week gap. */
function retentionChecks(n){
  const now = Date.now();
  const build = (minBox, gapDays) => VOCAB.filter(v => {
    const c = S.cards[v.id];
    return c && c.b >= minBox && c.lastOk && (now - c.lastOk) >= gapDays*DAY && (now - (c.lastRet||0)) >= 7*DAY;
  }).sort((a,b) => ((S.cards[a.id].lastRet||0) - (S.cards[b.id].lastRet||0)) || ((S.cards[a.id].lastOk||0) - (S.cards[b.id].lastOk||0)));
  let pool = build(3, 14);
  if(pool.length < n) pool = build(2, 7);
  pool = pool.slice(0, 20);
  const out = [];
  while(pool.length && out.length < n){
    out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  }
  return out;
}
/* Merge two saves instead of letting one clobber the other.
   Per card: whichever device touched it more recently wins. Lifetime
   counts are additive. "Proven" survives if either side proved it, but a
   later miss clears it. Per day of history: the device with more activity
   wins. XP is recomputed from merged history. Lesson progress: done if
   either side passed; best score is the max. */
function mergeStates(a, b){
  a = migrate(a); b = migrate(b);
  const newer = (b.ts||0) >= (a.ts||0) ? b : a;
  const out = {
    v:SCHEMA, vos:newer.vos, boda:newer.boda, escTipo: newer.escTipo !== false,
    cards:{}, lec:{}, hist:{}, xp:0,
    created: Math.min(a.created||Date.now(), b.created||Date.now()),
    ts: Date.now()
  };
  const ids = new Set([...Object.keys(a.cards||{}), ...Object.keys(b.cards||{})]);
  for(const id of ids){
    const ca = (a.cards||{})[id], cb = (b.cards||{})[id];
    if(!ca){ out.cards[id] = cb; continue; }
    if(!cb){ out.cards[id] = ca; continue; }
    const winner = (cb.last||0) >= (ca.last||0) ? cb : ca;
    const loser  = winner === cb ? ca : cb;
    out.cards[id] = Object.assign({}, winner, {
      ok: (ca.ok||0) + (cb.ok||0),
      no: (ca.no||0) + (cb.no||0),
      lastOk: Math.max(ca.lastOk||0, cb.lastOk||0),
      lastRet: Math.max(ca.lastRet||0, cb.lastRet||0),
      proven: winner.proven === false ? false : (winner.proven || loser.proven || false)
    });
  }
  const lids = new Set([...Object.keys(a.lec||{}), ...Object.keys(b.lec||{})]);
  for(const id of lids){
    const la = (a.lec||{})[id] || {}, lb = (b.lec||{})[id] || {};
    out.lec[id] = {
      done: !!(la.done || lb.done),
      best: Math.max(la.best||0, lb.best||0),
      tries: Math.max(la.tries||0, lb.tries||0),
      last: Math.max(la.last||0, lb.last||0)
    };
  }
  const days = new Set([...Object.keys(a.hist||{}), ...Object.keys(b.hist||{})]);
  for(const d of days){
    const ha = (a.hist||{})[d], hb = (b.hist||{})[d];
    const pick = !ha ? hb : !hb ? ha : ((hb.t||0) >= (ha.t||0) ? hb : ha);
    out.hist[d] = pick;
    out.xp += pick.xp || 0;
  }
  return out;
}
function counts(){
  let mastered=0, retained=0, recent=0, seen=0, avail=0;
  for(const v of VOCAB){
    if(unlocked(v)) avail++;
    const c = S.cards[v.id]; if(!c || c.b < 0) continue;
    seen++;
    if(c.b >= MASTER_BOX){ mastered++; if(c.proven) retained++; }
    else if(c.b >= 1) recent++;
  }
  return {mastered, retained, recent, seen, total:VOCAB.length, avail};
}
function level(){
  let l = 1; while(S.xp >= 60*l*(l+1)) l++;
  const base = 60*(l-1)*l, next = 60*l*(l+1);
  return {l, pct: Math.min(1,(S.xp-base)/(next-base)), toNext: next - S.xp};
}
function lessonsDone(){ return LECCIONES.filter(L => S.lec[L.id] && S.lec[L.id].done).length; }
function nextLesson(){ return LECCIONES.find(L => !(S.lec[L.id] && S.lec[L.id].done)) || null; }
function weakestLesson(){
  const done = LECCIONES.filter(L => S.lec[L.id] && S.lec[L.id].done);
  if(!done.length) return null;
  return done.sort((a,b) => (S.lec[a.id].best||0) - (S.lec[b.id].best||0))[0];
}
// The tense to bias verb drills toward: the most recently passed tense lesson.
function focusTense(){
  let best = null, t = 0;
  LECCIONES.forEach(L => { const p = S.lec[L.id]; if(L.tense && p && p.done && (p.last||0) > t){ t = p.last; best = L.tense; } });
  return best;
}

/* ============================ UI SHELL ============================ */
const TABS = [
  ["inicio","Inicio"], ["lecciones","Lecciones"], ["sesion","Sesión"], ["tarjetas","Tarjetas"],
  ["verbos","Verbos"], ["hablar","Hablar"], ["escuchar","Escuchar"],
  ["charla","Charla"], ["ajustes","Ajustes"]
];
const $ = sel => document.querySelector(sel);
function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function el(html){ const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
// Answer matching: case-, accent- and punctuation-insensitive, collapsed spaces.
function norm(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()
    .replace(/[¿?¡!.,;:"'()]/g,"").replace(/\s+/g," ").trim();
}
function matches(input, answer, accepted){
  const n = norm(input); if(!n) return {ok:false};
  const list = [answer, ...(accepted||[])];
  for(const a of list){
    if(n === norm(a)) return {ok:true, exactAccents: input.trim().toLowerCase().replace(/[¿?¡!.,;:"']/g,"") === String(a).toLowerCase().replace(/[¿?¡!.,;:"']/g,"")};
  }
  return {ok:false};
}
// "___" in a stem becomes the blank.
function blankify(stem){ return esc(stem).replace(/___/g, '<span class="blank">?</span>'); }

function planSteps(){
  const steps = [];
  const nl = nextLesson();
  const due = dueCards().length;
  if(nl){
    steps.push({k:"lesson", id:nl.id, title:`Lección ${nl.n}: ${nl.title}`, sub:`${nl.unitName} · unos 15 min`, go:() => openLesson(nl.id)});
  } else {
    const w = weakestLesson();
    if(w) steps.push({k:"lesson", id:w.id, title:`Repasa: ${w.title}`, sub:`Tu nota más baja (${S.lec[w.id].best}/10). Vuelve a hacer el examen.`, go:() => openLesson(w.id)});
  }
  const ret = retentionChecks(3).length;
  steps.push({k:"sesion", title:"Sesión diaria", sub:`${due} para repasar · ${ret} chequeo${ret===1?"":"s"} de retención · verbos, hablar y escuchar`, go:() => showTab("sesion")});
  const ft = focusTense();
  if(ft) steps.push({k:"verbos", opt:true, title:`Verbos: ${TENSE_NAMES[ft]}`, sub:"Refuerza el tiempo verbal de tu última lección. 5 minutos.", go:() => { verbTense = ft; showTab("verbos"); }});
  else steps.push({k:"verbos", opt:true, title:"Verbos: mezcla", sub:"Cuando pases una lección de tiempos verbales, esto se enfoca en ese tiempo.", go:() => showTab("verbos")});
  return steps;
}

// Draw 10 from the pool, keeping the production/recognition mix roughly balanced.
function drawTest(pool){
  const prod = shuffle(pool.filter(q => q.k !== "mc"));
  const mc = shuffle(pool.filter(q => q.k === "mc"));
  const nMc = Math.min(mc.length, 4), nProd = Math.min(prod.length, 10 - nMc);
  const out = [...prod.slice(0, nProd), ...mc.slice(0, nMc)];
  while(out.length < 10 && (prod.length > nProd || mc.length > nMc)){
    if(prod.length > out.filter(q=>q.k!=="mc").length) out.push(prod[out.filter(q=>q.k!=="mc").length]);
    else if(mc.length > out.filter(q=>q.k==="mc").length) out.push(mc[out.filter(q=>q.k==="mc").length]);
    else break;
  }
  return shuffle(out);
}
function renderTest(L, pool){
  if(!LES.test) LES.test = {q: drawTest(pool), picked:{}};
  const qs = LES.test.q;
  const area = $("#lesArea");
  area.innerHTML = `<p class="sub" style="margin-bottom:4px">Diez preguntas. Necesitas 8 para aprobar. Si repites, cambian.</p>` + qs.map((q,i) => {
    if(q.k === "mc"){
      const opts = q.opts.map((o,oi) => `<button class="opt" data-q="${i}" data-o="${oi}">${esc(o)}</button>`).join("");
      return `<div class="qbox"><div class="hint-inline"><b>${i+1} de ${qs.length}</b></div>
        <div class="stem">${esc(q.stem)}</div>
        ${q.es ? `<div style="font-weight:700; margin:6px 0 8px; font-size:1.02rem;">${esc(q.es)}</div>` : ""}
        ${opts}</div>`;
    }
    return `<div class="qbox"><div class="hint-inline"><b>${i+1} de ${qs.length}</b></div>
      <div class="stem">${blankify(q.stem)}</div>
      ${q.hint ? `<div class="hint-inline">${esc(q.hint)}</div>` : ""}
      <input type="text" data-q="${i}" placeholder="Escribe la respuesta" autocapitalize="off" autocomplete="off"></div>`;
  }).join("") + `
    <div class="btn-row" style="justify-content:center"><button class="btn coral" id="lSubmit">Corregir examen</button></div>
    <div id="lResult"></div>`;
  area.querySelectorAll(".opt").forEach(b => {
    b.onclick = () => {
      const qi = +b.dataset.q;
      area.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(x => x.classList.remove("picked"));
      b.classList.add("picked");
      LES.test.picked[qi] = +b.dataset.o;
    };
  });
  $("#lSubmit").onclick = () => scoreTest(L, qs);
}
function scoreTest(L, qs){
  const area = $("#lesArea");
  let correct = 0;
  const rows = qs.map((q,i) => {
    let ok;
    if(q.k === "mc"){
      ok = LES.test.picked[i] === q.ans;
      if(ok) correct++;
      return `<div class="feedback ${ok?"ok":"no"}"><b>${i+1}.</b> ${ok ? "Correcto." : "Era: <b>" + esc(q.opts[q.ans]) + "</b>."}<small>${esc(q.note||"")}</small></div>`;
    }
    const val = area.querySelector(`input[data-q="${i}"]`).value;
    const m = matches(val, q.ans, q.acc);
    ok = m.ok; if(ok) correct++;
    return `<div class="feedback ${ok?"ok":"no"}"><b>${i+1}.</b> ${ok ? (m.exactAccents ? "Correcto." : "Correcto (ojo con la tilde: <b>" + esc(q.ans) + "</b>).") : "Era <b>" + esc(q.ans) + "</b>."}<small>${esc(q.tr||"")}</small></div>`;
  }).join("");
  const passed = correct >= 8;
  const p = S.lec[L.id] || {done:false, best:0, tries:0, last:0};
  p.tries++; p.best = Math.max(p.best, correct); p.last = Date.now();
  if(passed) p.done = true;
  S.lec[L.id] = p;
  const xp = passed ? (p.tries === 1 ? 80 : 50) : 20;
  logAnswer(passed, xp);
  area.querySelectorAll("input, .opt, #lSubmit").forEach(x => x.disabled = true);
  $("#lResult").innerHTML = `
    <div class="score-box">
      <div class="score-num">${correct} / ${qs.length}</div>
      <div class="score-lbl">${passed ? "¡Aprobado! +" + xp + " XP" : "Necesitas 8. +" + xp + " XP por intentarlo."}</div>
    </div>
    ${rows}
    <div class="btn-row" style="justify-content:center; margin-top:14px">
      ${passed ? `<button class="btn" id="lFinish">Terminar</button>` : `<button class="btn ghost" id="lReview">Revisar lección</button><button class="btn coral" id="lRetry">Repetir examen</button>`}
    </div>`;
  if($("#lFinish")) $("#lFinish").onclick = () => { LES.step++; renderLessonStep($("#tab-lecciones")); window.scrollTo(0,0); };
  if($("#lReview")) $("#lReview").onclick = () => { LES.step = 0; LES.test = null; renderLessonStep($("#tab-lecciones")); window.scrollTo(0,0); };
  if($("#lRetry")) $("#lRetry").onclick = () => { LES.test = null; renderLessonStep($("#tab-lecciones")); window.scrollTo(0,0); };
}

/* ============================ DAILY SESSION (lesson-aware) ============================ */
let SES = null;
function buildSession(){
  const due = shuffle(dueCards()).slice(0, 12);
  const fresh = newCards(Math.max(2, 6 - Math.floor(due.length/3)));
  const ret = retentionChecks(3).filter(v => !due.includes(v));
  const q = [];
  fresh.forEach(v => q.push({k:"intro", v}));
  due.forEach(v => q.push({k:"card", v}));
  ret.forEach(v => q.push({k:"card", v, ret:true}));
  const ft = focusTense();
  for(let i=0;i<6;i++) q.push({k:"verb", tense: (ft && i < 4) ? ft : null});
  shuffle(q);
  const sp = shuffle(SPEAKING.slice()).slice(0,2).map(x => ({k:"speak", v:x}));
  const li = shuffle(LISTENING.slice()).slice(0,2).map(x => ({k:"listen", v:x}));
  if(q.length > 3){ q.splice(Math.floor(q.length/3), 0, sp[0], li[0]); q.splice(Math.floor(q.length*2/3), 0, sp[1], li[1]); }
  else q.push(sp[0], li[0], sp[1], li[1]);
  return {q, i:0, ok:0, t:0, xp0:S.xp};
}
function renderSession(){
  const root = $("#tab-sesion");
  if(!SES || SES.i >= SES.q.length){
    const nl = nextLesson();
    root.innerHTML = `
      <div class="card done-box">
        <h2>Sesión diaria</h2>
        <p class="sub" style="margin:8px 0 16px">Unos 15 minutos: tarjetas nuevas, repaso pendiente, chequeos de retención de material viejo, verbos, una ronda de hablar y otra de escuchar.${nl ? " Las tarjetas de gramática entran cuando apruebas su lección." : ""}</p>
        <button class="btn coral" id="startSes">Empezar</button>
      </div>`;
    $("#startSes").onclick = () => { SES = buildSession(); renderSession(); };
    return;
  }
  stepUI(root);
}
function stepUI(root){
  const step = SES.q[SES.i];
  const pct = Math.round(100*SES.i/SES.q.length);
  const next = () => { SES.i++; if(SES.i >= SES.q.length) sessionDone(root); else stepUI(root); window.scrollTo(0,0); };
  if(step.k === "intro"){ introUI(root, step.v, next, pct); return; }
  if(step.k === "card"){ flashcardUI(root, step.v, step.ret, next, pct); return; }
  if(step.k === "verb"){ verbQuestionUI(root, next, pct, step.tense); return; }
  if(step.k === "speak"){ speakUI(root, step.v, next, pct); return; }
  if(step.k === "listen"){ listenUI(root, step.v, next, pct); return; }
}
function sessionDone(root){
  const gained = S.xp - SES.xp0;
  const acc = SES.t ? Math.round(100*SES.ok/SES.t) : 0;
  root.innerHTML = `
    <div class="card done-box">
      <div class="celebrate">¡Qué molleja! Sesión completa.</div>
      <div class="big">+${gained} XP</div>
      <p class="sub" style="margin:10px 0 16px">Precisión de hoy: ${acc}%. El repaso de mañana ya está programado con intervalos más largos.</p>
      <div class="btn-row" style="justify-content:center">
        <button class="btn" onclick="showTab('inicio')">Ver mi plan</button>
        <button class="btn ghost" id="again">Otra ronda</button>
      </div>
    </div>`;
  $("#again").onclick = () => { SES = buildSession(); renderSession(); };
  SES = null;
}

/* ============================ CARD UI (5 kinds) ============================
   cloze: fill the blank in a Spanish sentence, given a situation.
   scen:  produce a whole phrase from a real-life situation.
   reply: someone says something; you answer with the target phrase.
   verb:  conjugate inside a real sentence (verb · person · tense hint).
   phon:  read the street spelling, pick the meaning (multiple choice).
   Typed kinds auto-grade. A miss shows the answer and asks "Casi / No",
   because "close" (right idea, wrong ending) deserves partial credit.
============================================================================ */
const KIND_NAMES = {cloze:"Completa", scen:"Dilo tú", reply:"Responde", verb:"Conjuga en contexto", phon:"Así suena"};
function introUI(root, v, next, pct){
  const front = cardFrontHtml(v, true);
  root.innerHTML = `
    <div class="progress-line"><div style="width:${pct}%"></div></div>

function runDeck(pool){
  const area = $("#deckArea");
  let i = 0;
  const step = () => {
    if(i >= pool.length){
      area.innerHTML = `<div class="card done-box"><div class="celebrate">¡Listo el mazo!</div>

      return;

    const pct = Math.round(100*i/pool.length);
    const c = S.cards[pool[i].id];
    if(!c || c.b < 0) introUI(area, pool[i], () => { i++; step(); }, pct);
    else flashcardUI(area, pool[i], false, () => { i++; step(); }, pct);
  };
  step();
}

let verbTense = "mix";
function pickVerbQ(forceTense){
  const tenses = forceTense ? [forceTense] : (verbTense === "mix" ? ["pres","pret","impf","futr"] : [verbTense]);
  const tense = tenses[Math.floor(Math.random()*tenses.length)];
  const v = VERBS[Math.floor(Math.random()*VERBS.length)];
  const base = S.vos ? [0,1,2,3,4,5,0,2] : [0,1,1,3,4,5,0,1];
  let pIdx = base[Math.floor(Math.random()*base.length)];
  if(pIdx === 2 && (tense === "pret" || tense === "impf")) pIdx = 1;
  return {v, tense, pIdx, answer: conjugate(v.inf, tense, pIdx)};
}

/* ============================ LISTENING (type-first) ============================
   Default: you hear it, type the English meaning, and it's scored by word
   overlap against the three options (best match must be the right one and
   cover at least half of its words). Miss: you see the answer and self-rate.
   "Ver opciones" drops to multiple choice for less XP. Toggle in Ajustes.
================================================================================ */
let voiceES = null;
function pickVoice(){
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  voiceES = vs.find(v => /es[-_]/i.test(v.lang) && /US|MX|41|VE|CO/i.test(v.lang))
         || vs.find(v => v.lang && v.lang.toLowerCase().startsWith("es")) || null;
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if(!window.speechSynthesis){ alert("Este navegador no tiene voz. El texto: " + text); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if(voiceES) u.voice = voiceES;
  u.lang = voiceES ? voiceES.lang : "es-US";
  u.rate = 0.95;
  speechSynthesis.speak(u);
}
const STOP = new Set(["the","a","an","to","of","is","are","am","i","you","we","it","at","in","on","and","for","your","my","our","me","us","do","did","be","let's","lets","s","re","there"]);
function wordsOf(s){ return norm(s).split(" ").filter(w => w && !STOP.has(w)); }
function bestOption(input, opts){
  const iw = new Set(wordsOf(input));
  if(!iw.size) return {idx:-1, score:0};
  let best = -1, bs = 0;
  opts.forEach((o,i) => {
    const ow = wordsOf(o); if(!ow.length) return;
    const hit = ow.filter(w => iw.has(w)).length;
    const score = hit / Math.max(ow.length, iw.size);
    if(score > bs){ bs = score; best = i; }
  });
  return {idx:best, score:bs};
}

      $("#liFb").innerHTML = `

    <div class="card">
      <h2>Versión de bolsillo</h2>
      <p class="sub">Esta copia funciona sin internet en cualquier parte y guarda el progreso en este teléfono. No se sincroniza sola con la Mac: para pasar progreso de un lado al otro, usa Exportar aquí e Importar en el otro dispositivo.</p>
    </div>` : `
    <div class="card">
      <h2>Sincronización por wifi</h2>
      <p class="sub" style="margin-bottom:8px">El progreso se guarda en tu Mac cuando está en la misma wifi. Fuera de casa la app funciona igual y se sincroniza sola al volver. El más reciente gana.</p>
      <div id="syncStatus" class="sub" style="font-weight:600; margin-bottom:8px">Comprobando...</div>
      <label class="sub" style="font-weight:600">Dirección de la Mac</label>
      <input type="text" id="macHostIn" value="${esc(macHost())}" placeholder="http://192.168.1.233:8765" style="margin-top:4px">
      <div class="btn-row">
        <button class="btn sm" id="saveHost">Guardar dirección</button>
        <button class="btn sm ghost" id="syncNow">Reintentar / Sincronizar</button>
      </div>
    </div>`}
    <div class="card">
      <h2>Respaldo del progreso</h2>
      <p class="sub" style="margin-bottom:10px">Exporta un archivo para respaldar tu progreso o moverlo a otro dispositivo. Importa para combinarlo (nunca reemplaza).</p>
      <div class="btn-row">
        <button class="btn" id="expBtn">Exportar progreso</button>
        <button class="btn ghost" id="impBtn">Importar progreso</button>
        <input type="file" id="impFile" accept=".json,application/json" style="display:none">
      </div>
      <div id="ioMsg"></div>
    </div>
    <div class="card">
      <h2>Zona de peligro</h2>
      <div class="btn-row" style="margin-top:0">
        <button class="btn gray" id="resetLec">Reiniciar solo lecciones</button>
        <button class="btn gray" id="resetBtn">Borrar todo el progreso</button>
      </div>
    </div>
    <div class="card">
      <h2>Versión</h2>
      <p class="sub">Actualización 2: lecciones, tarjetas por contexto, plan diario guiado, escuchar escribiendo primero, chequeos de retención arreglados.${S.migratedFrom ? " Tu progreso anterior se conservó; las cajas altas bajaron a 3 para re-probar cada tarjeta en el formato nuevo." : ""}</p>
    </div>`;
  $("#vosT2").onchange = e => { S.vos = e.target.checked; save(); };
  $("#bodaT").onchange = e => { S.boda = e.target.checked; save(); };
  $("#escT2").onchange = e => { S.escTipo = e.target.checked; save(); };
  if(!HOSTED){
    updateSyncStatus();
    $("#saveHost").onclick = () => {
      let h = $("#macHostIn").value.trim().replace(/\/+$/,"");
      if(h && !/^https?:\/\//.test(h)) h = "http://" + h;
      try{ localStorage.setItem("maracucho_mac_host", h); }catch(e){}
      SYNC.dead = false;
      $("#syncStatus").textContent = "Dirección guardada. Probando...";
      syncPull().then(() => { syncPush(); updateSyncStatus(); });
    };
    $("#syncNow").onclick = async () => {
      SYNC.dead = false;
      $("#syncStatus").textContent = "Sincronizando...";
      await syncPull(); await syncPush(); updateSyncStatus();
    };
  }
  $("#expBtn").onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 1)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "maracucho-progreso-" + today() + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
    $("#ioMsg").innerHTML = `<div class="feedback ok">Respaldo descargado.</div>`;
  };
  $("#impBtn").onclick = () => $("#impFile").click();
  $("#impFile").onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const o = JSON.parse(r.result);
        if(!o || (o.v !== 1 && o.v !== SCHEMA) || typeof o.cards !== "object") throw new Error("formato");
        const before = counts().mastered;
        S = mergeStates(S, o);
        save(); renderXP();
        const c = counts();
        $("#ioMsg").innerHTML = `<div class="feedback ok">Progreso combinado. Dominadas: ${before} &rarr; ${c.mastered}. Lecciones: ${lessonsDone()}. XP: ${S.xp}.</div>`;
      }catch(err){
        $("#ioMsg").innerHTML = `<div class="feedback no">Ese archivo no parece un respaldo válido de esta app.</div>`;
      }
    };
    r.readAsText(f);
  };
  $("#resetLec").onclick = () => {
    if(confirm("¿Reiniciar el progreso de las lecciones? Las tarjetas y el XP se quedan.")){ S.lec = {}; save(); renderSettings(); }
  };
  $("#resetBtn").onclick = () => {
    if(confirm("¿Seguro? Esto borra XP, tarjetas, lecciones y estadísticas. No se puede deshacer (a menos que tengas un respaldo).")){
      S = freshState(); save(); renderXP(); renderSettings();
    }
  };
}
/* =====================================================================
   LAYER 2 — CONVERSATION PARTNER (Charla)
   Everything for the AI chat lives between here and the UTIL section.
   It talks ONLY to the local Python proxy (server.py), never directly
   to the Anthropic API, so no key ever touches the browser. If the
   server isn't running, this tab shows setup help and the rest of the
   app is unaffected.
===================================================================== */
const CHARLA = { history:[], model:"haiku", inTok:0, outTok:0, busy:false };
const CHARLA_MODELS = {
  haiku:  { id:"claude-haiku-4-5",  label:"Haiku (rápido y barato)", inRate:1.00, outRate:5.00 },
  sonnet: { id:"claude-sonnet-4-6", label:"Sonnet (más listo)",      inRate:3.00, outRate:15.00 }
};
const CHARLA_MAX_TOKENS = 300; // keeps replies short and cheap
const CHARLA_SYSTEM = [
  "You are a friendly Venezuelan Spanish conversation partner from Maracaibo, helping an adult English speaker (high beginner, A2) practice for time with his girlfriend's Maracucho family in South Florida.",
  "Address him with tú, the way his girlfriend's family actually speaks. Do not use voseo. If he addresses an elder in roleplay, model correct usted. If he uses tú where usted belongs (parents, grandparents, first meetings), point it out kindly.",
  "Use natural Venezuelan Caribbean Spanish with Maracucho flavor: chévere, fino, de pana, chamo, qué molleja, and warm expressions like mijo.",
  "When he makes a mistake, give ONE short correction in parentheses, then continue the conversation naturally. Don't lecture. Praise correct past-tense use, since that's his weak spot.",
  "The family is bilingual and code-switches; occasional English or Spanglish from him is fine. You may use common Miami anglicisms (parquear, textear, chequear) occasionally and naturally.",
  "Keep every reply short: 2 to 4 sentences. Ask a simple follow-up question to keep him talking. Match his level; simple vocabulary, mostly present and past tenses."
].join(" ");

function renderCharla(){
  const root = $("#tab-charla");
  if(HOSTED){
    root.innerHTML = `
      <div class="card done-box">
        <h2>Charla vive en la versión de casa</h2>
        <p class="sub" style="margin:10px 0 4px">Esta es la versión de bolsillo: funciona sin internet en cualquier parte, pero no puede llegar a tu Mac. Para conversar con tu pana de Maracaibo, usa el otro ícono (el de http://192.168...) cuando estés en tu wifi de casa.</p>
      </div>`;
    return;
  }
  const m = CHARLA_MODELS[CHARLA.model];
  const cost = (CHARLA.inTok * m.inRate + CHARLA.outTok * m.outRate) / 1e6;
  root.innerHTML = `
    <div class="card">
      <h2>Charla — compañero de conversación</h2>
      <div class="topic-pills" style="margin-bottom:8px">
        ${Object.keys(CHARLA_MODELS).map(k =>
          `<button class="${CHARLA.model===k?"on":""}" data-m="${k}">${CHARLA_MODELS[k].label}</button>`).join("")}
      </div>
      <div class="chat-box" id="chatBox">
        ${CHARLA.history.length === 0
          ? '<div class="msg ai">¡Épale! ¿Qué más? Soy tu pana de Maracaibo. Cuéntame, ¿qué hiciste hoy?</div>' : ""}
        ${CHARLA.history.map((x,i) => x.role === "user"
          ? `<div class="msg me">${esc(x.content)}</div>`
          : `<div class="msg ai">${esc(x.content)}<br><button class="say-btn" data-say="${i}" title="Escuchar">&#128264; escuchar</button></div>`).join("")}
      </div>
      <div class="chat-input-row">
        <input type="text" id="chatIn" autocomplete="off" autocapitalize="sentences" placeholder="Escribe en español (o Spanglish)...">
        <button class="btn" id="chatSend" ${CHARLA.busy?"disabled":""}>${CHARLA.busy?"...":"Enviar"}</button>
      </div>
      <div class="cost-line">Sesión: ${CHARLA.inTok + CHARLA.outTok} tokens · costo estimado $${cost.toFixed(4)} (tarifas: $${m.inRate}/M entrada, $${m.outRate}/M salida)</div>
    </div>`;
  root.querySelectorAll("[data-m]").forEach(b => {
    b.onclick = () => { CHARLA.model = b.dataset.m; renderCharla(); };
  });
  root.querySelectorAll(".say-btn").forEach(b => {
    b.onclick = () => { const msg = CHARLA.history[Number(b.dataset.say)]; if(msg) say(msg.content); };
  });
  const box = $("#chatBox"); box.scrollTop = box.scrollHeight;
  const input = $("#chatIn");
  const send = () => sendCharla(input.value);
  $("#chatSend").onclick = send;
  input.onkeydown = e => { if(e.key === "Enter") send(); };
  input.focus();
}
async function sendCharla(text){
  text = (text || "").trim();
  if(!text || CHARLA.busy) return;
  CHARLA.history.push({role:"user", content:text});
  CHARLA.busy = true;
  renderCharla();
  try{
    if(SYNC.dead) throw new Error("Sin conexión con la Mac");
    const res = await fetch(apiBase() + "/api/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      signal: AbortSignal.timeout(60000),
      body: JSON.stringify({
        model: CHARLA_MODELS[CHARLA.model].id,
        max_tokens: CHARLA_MAX_TOKENS,
        system: CHARLA_SYSTEM,
        messages: CHARLA.history
      })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error.message || "Error de la API");
    const reply = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim();
    if(!reply) throw new Error("Respuesta vacía");
    CHARLA.history.push({role:"assistant", content:reply});
    if(data.usage){
      CHARLA.inTok += data.usage.input_tokens || 0;
      CHARLA.outTok += data.usage.output_tokens || 0;
    }
    logAnswer(true, 5); // a little XP for showing up to converse
  }catch(err){
    CHARLA.history.pop(); // don't strand the failed message in history
    CHARLA.busy = false;
    renderCharla();
    const box = $("#chatBox");
    const hint = document.createElement("div");
    hint.className = "msg sys";
    hint.textContent = "No pude conectar con la Mac. Charla necesita que el servidor esté corriendo y que estés en la misma wifi. (El resto de la app funciona sin conexión.) Detalle: " + err.message;
    box.appendChild(hint);
    box.scrollTop = box.scrollHeight;
    return;
  }
  CHARLA.busy = false;
  renderCharla();
}
/* ===================== END OF LAYER 2 ===================== */

/* =====================================================================
   LAYER 2.5 — WIFI SYNC (optional, uses the same server.py)
   Works two ways:
     - App opened THROUGH the Mac server: syncs to that same origin.
     - App opened as a local file on the phone (offline-capable): syncs
       to MAC_HOST below whenever the Mac is reachable on wifi.
   Newest timestamp wins. If the Mac isn't reachable, everything keeps
   working from local storage and syncs the next time you're home.
===================================================================== */
const MAC_HOST_DEFAULT = "http://192.168.1.233:8765";  // Noah's Mac mini
function macHost(){
  try{ return localStorage.getItem("maracucho_mac_host") || MAC_HOST_DEFAULT; }
  catch(e){ return MAC_HOST_DEFAULT; }
}
function apiBase(){
  // Served by the Mac already? Use the same origin. Otherwise reach out to the Mac.
  return (location.protocol === "http:" || location.protocol === "https:") ? "" : macHost();
}
const SYNC = { ok:null, last:0, timer:null, dead:false };
const SYNC_TIMEOUT = 1500;   // fail fast; a LAN Mac answers in milliseconds

// Circuit breaker: once the Mac is confirmed unreachable (e.g. you're on
// cellular), stop attempting network calls entirely. Hanging fetches to an
// unreachable LAN address are what made the UI feel stuck. Progress keeps
// saving locally and syncs on the next launch at home.
function syncDown(){
  SYNC.ok = false; SYNC.dead = true;
  clearTimeout(SYNC.timer);
}

async function syncPull(){
  if(SYNC.dead) return "offline";
  try{
    const res = await fetch(apiBase() + "/progress", {signal: AbortSignal.timeout(SYNC_TIMEOUT)});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const remote = await res.json();
    SYNC.ok = true; SYNC.dead = false; SYNC.last = Date.now();
    if(remote && (remote.v === 1 || remote.v === SCHEMA) && typeof remote.cards === "object"){
      const merged = mergeStates(S, remote);
      const changed = JSON.stringify(merged.cards) !== JSON.stringify(S.cards) || merged.xp !== S.xp;
      S = merged;
      try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
      renderXP();
      if(changed) return "adopted";
    }
    return "kept-local";
  }catch(e){ syncDown(); return "offline"; }
}
async function syncPush(){
  if(SYNC.dead) return;
  try{
    const res = await fetch(apiBase() + "/progress", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(S), signal: AbortSignal.timeout(SYNC_TIMEOUT)
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    SYNC.ok = true; SYNC.last = Date.now();
  }catch(e){ syncDown(); }
}
function syncPushSoon(){
  if(SYNC.dead) return;              // never queue a call we know will hang
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(syncPush, 2000);
}
function updateSyncStatus(){
  const elS = document.getElementById("syncStatus");
  if(!elS) return;
  if(SYNC.ok === true) elS.textContent = "Conectado a la Mac. Última sincronización: " + new Date(SYNC.last).toLocaleTimeString();
  else if(SYNC.dead) elS.textContent = "Mac no disponible (¿datos móviles?). Todo se guarda en el teléfono; se sincroniza al volver a casa. Toca 'Reintentar' si ya estás en tu wifi.";
  else if(SYNC.ok === false) elS.textContent = "Mac no disponible. Todo funciona igual y se sincroniza al volver al wifi.";
  else elS.textContent = "Comprobando...";
}
// When the phone comes back to life (app reopened, or network returns),
// give the Mac another chance. Not in hosted mode: there's no Mac to reach.
window.addEventListener("online", () => { if(HOSTED) return; SYNC.dead = false; syncPull().then(syncPush); });
document.addEventListener("visibilitychange", () => {
  if(HOSTED) return;
  if(!document.hidden && SYNC.dead && navigator.onLine){
    SYNC.dead = false;
    syncPull().then(r => { if(r === "adopted") showTab("inicio"); else syncPush(); });
  }
});

/* ============================ UTIL + BOOT ============================ */
buildNav();
renderXP();
showTab("inicio");
/* HOSTED mode: this same file, served over HTTPS (GitHub Pages), becomes the
   go-anywhere pocket version. The service worker makes it work offline for
   real. Sync and Charla need the Mac, so they're disabled here; the
   Mac-served copy (http://192.168.x.x:8765) remains the full version. */
if(HOSTED){
  SYNC.dead = true;
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
} else {
  syncPull().then(r => { if(r === "adopted") showTab("inicio"); });
}
</script>
