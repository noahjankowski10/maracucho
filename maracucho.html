<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Maracucho">
<title>Maracucho — Spanish trainer</title>
<style>
  :root{
    --ink:#22303a; --muted:#5c6b76; --bg:#f7faf9; --card:#ffffff;
    --teal:#0e7c7b; --teal-deep:#0a5f5e; --teal-soft:#e2f1f0;
    --coral:#e8684a; --coral-soft:#fdeae4;
    --gold:#e3a72f; --line:#e2e9e7; --good:#1a8f5c; --bad:#c94f3d;
    --radius:14px; --shadow:0 1px 3px rgba(34,48,58,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.45;
    padding-bottom:70px;
  }
  header{
    background:var(--card); border-bottom:1px solid var(--line);
    padding:14px 16px 10px; position:sticky; top:0; z-index:20;
  }
  .head-row{display:flex; align-items:center; justify-content:space-between; max-width:760px; margin:0 auto;}
  h1{font-size:1.15rem; font-weight:700; letter-spacing:-.01em;}
  h1 .accent{color:var(--teal);}
  .xp-pill{
    background:var(--teal-soft); color:var(--teal-deep); font-weight:700; font-size:.8rem;
    padding:5px 12px; border-radius:999px; white-space:nowrap;
  }
  nav{
    display:flex; gap:4px; overflow-x:auto; max-width:760px; margin:10px auto 0;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  nav::-webkit-scrollbar{display:none;}
  nav button{
    border:none; background:transparent; color:var(--muted); font-size:.85rem; font-weight:600;
    padding:8px 12px; border-radius:999px; cursor:pointer; white-space:nowrap;
  }
  nav button.on{background:var(--teal); color:#fff;}
  main{max-width:760px; margin:0 auto; padding:16px;}
  section{display:none;}
  section.on{display:block;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px; margin-bottom:14px;
  }
  h2{font-size:1rem; font-weight:700; margin-bottom:10px;}
  h3{font-size:.85rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px;}
  .sub{color:var(--muted); font-size:.85rem;}
  .btn{
    display:inline-block; border:none; border-radius:10px; padding:11px 18px; font-size:.95rem;
    font-weight:700; cursor:pointer; background:var(--teal); color:#fff; transition:transform .05s;
  }
  .btn:active{transform:scale(.97);}
  .btn.coral{background:var(--coral);}
  .btn.ghost{background:transparent; color:var(--teal-deep); border:1.5px solid var(--teal);}
  .btn.gray{background:#eef2f1; color:var(--ink);}
  .btn.sm{padding:7px 12px; font-size:.82rem;}
  .btn:disabled{opacity:.45; cursor:default;}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
  .chip{
    display:inline-block; font-size:.68rem; font-weight:700; padding:3px 9px; border-radius:999px;
    text-transform:uppercase; letter-spacing:.03em;
  }
  .chip.elders{background:var(--teal-soft); color:var(--teal-deep);}
  .chip.casual{background:var(--coral-soft); color:#b34527;}
  .chip.spang{background:#fff3d6; color:#8a6410;}
  .chip.ret{background:#efe6fb; color:#6b3fa0;}
  .chip.new{background:#e4f3ea; color:var(--good);}

  /* Stats home */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .stat{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:14px;
  }
  .stat .num{font-size:1.9rem; font-weight:800; letter-spacing:-.02em;}
  .stat .lbl{font-size:.75rem; color:var(--muted); font-weight:600;}
  .stat.hero{grid-column:1 / -1; display:flex; align-items:center; gap:16px; background:linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%); border:none; color:#fff;}
  .stat.hero .lbl{color:rgba(255,255,255,.85);}
  .ring{position:relative; width:84px; height:84px; flex-shrink:0;}
  .ring svg{transform:rotate(-90deg);}
  .ring .lvl{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:800; font-size:1.3rem; line-height:1;}
  .ring .lvl small{font-size:.6rem; font-weight:700; opacity:.85;}
  .stat.retain{border:1.5px solid var(--coral); }
  .stat.retain .num{color:var(--coral);}
  .bar-wrap{margin:8px 0 12px;}
  .bar-label{display:flex; justify-content:space-between; font-size:.8rem; font-weight:600; margin-bottom:4px;}
  .bar{height:9px; background:#edf1f0; border-radius:999px; overflow:hidden;}
  .bar > div{height:100%; background:var(--teal); border-radius:999px; transition:width .4s;}
  .trend{display:flex; align-items:flex-end; gap:4px; height:70px; margin-top:6px;}
  .trend .tbar{flex:1; background:var(--teal-soft); border-radius:4px 4px 0 0; position:relative; min-height:3px;}
  .trend .tbar.filled{background:var(--teal);}
  .trend-dates{display:flex; gap:4px; margin-top:4px;}
  .trend-dates span{flex:1; text-align:center; font-size:.55rem; color:var(--muted);}

  /* Flashcard */
  .flash{
    min-height:190px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:10px; cursor:pointer; padding:22px 16px;
  }
  .flash .big{font-size:1.45rem; font-weight:800; letter-spacing:-.01em;}
  .flash .note{font-size:.82rem; color:var(--muted); max-width:420px;}
  .flash .hint{font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; font-weight:700;}
  .sound-note{font-size:.9rem; color:var(--coral); font-weight:600;}
  input[type=text]{
    width:100%; padding:12px; font-size:1.05rem; border:1.5px solid var(--line); border-radius:10px;
    background:#fff; color:var(--ink); font-family:inherit;
  }
  input[type=text]:focus{outline:none; border-color:var(--teal);}
  .feedback{margin-top:10px; padding:12px; border-radius:10px; font-weight:600; font-size:.95rem;}
  .feedback.ok{background:#e4f3ea; color:var(--good);}
  .feedback.no{background:#fbe9e5; color:var(--bad);}
  .progress-line{height:6px; background:#e8eeec; border-radius:999px; margin-bottom:14px; overflow:hidden;}
  .progress-line > div{height:100%; background:var(--coral); border-radius:999px; transition:width .3s;}
  .opt{display:block; width:100%; text-align:left; margin-top:8px; padding:12px; border:1.5px solid var(--line);
    background:#fff; border-radius:10px; font-size:.95rem; cursor:pointer; font-family:inherit; color:var(--ink);}
  .opt.ok{border-color:var(--good); background:#e4f3ea;}
  .opt.no{border-color:var(--bad); background:#fbe9e5;}
  .topic-pills{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .topic-pills button{
    border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:6px 12px;
    font-size:.78rem; font-weight:600; cursor:pointer; color:var(--muted);
  }
  .topic-pills button.on{border-color:var(--teal); color:var(--teal-deep); background:var(--teal-soft);}
  .switch-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line);}
  .switch-row:last-child{border-bottom:none;}
  .toggle{position:relative; width:46px; height:26px; flex-shrink:0;}
  .toggle input{opacity:0; width:0; height:0;}
  .toggle span{
    position:absolute; inset:0; background:#cfd8d6; border-radius:999px; cursor:pointer; transition:.2s;
  }
  .toggle span::after{
    content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff;
    border-radius:50%; transition:.2s;
  }
  .toggle input:checked + span{background:var(--teal);}
  .toggle input:checked + span::after{left:23px;}
  .celebrate{font-size:1.05rem; font-weight:800; color:var(--coral); text-align:center; margin:6px 0;}
  .done-box{text-align:center; padding:26px 16px;}
  .done-box .big{font-size:1.5rem; font-weight:800;}
  table.mini{width:100%; border-collapse:collapse; font-size:.85rem;}
  table.mini td{padding:6px 4px; border-bottom:1px solid var(--line);}
  table.mini td:last-child{text-align:right; font-weight:700;}
  @media (min-width:600px){
    .stat-grid{grid-template-columns:repeat(4,1fr);}
    .stat.hero{grid-column:1 / -1;}
  }
  .footer-note{font-size:.72rem; color:var(--muted); text-align:center; margin-top:18px;}
  /* Layer 2: chat */
  .chat-box{display:flex; flex-direction:column; gap:8px; min-height:260px; max-height:55vh; overflow-y:auto; padding:4px 2px;}
  .msg{max-width:86%; padding:10px 13px; border-radius:14px; font-size:.95rem; white-space:pre-wrap; line-height:1.4;}
  .msg.me{align-self:flex-end; background:var(--teal); color:#fff; border-bottom-right-radius:4px;}
  .msg.ai{align-self:flex-start; background:#eef2f1; border-bottom-left-radius:4px;}
  .msg.sys{align-self:center; background:var(--coral-soft); color:#8a3a22; font-size:.82rem; border-radius:10px;}
  .chat-input-row{display:flex; gap:8px; margin-top:10px;}
  .chat-input-row input{flex:1;}
  .cost-line{font-size:.72rem; color:var(--muted); margin-top:8px; text-align:right;}
  .say-btn{border:none; background:transparent; color:var(--teal-deep); font-size:.72rem; font-weight:700; cursor:pointer; padding:4px 0 0; font-family:inherit;}

  /* ---- v2: lessons ---- */
  .lesson-hero{background:linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%); color:#fff; border:none;}
  .lesson-hero h2{color:#fff; font-size:1.2rem;}
  .lesson-hero .sub{color:rgba(255,255,255,.85);}
  .lesson-hero p{color:#fff;}
  .step-header{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .step-num{background:var(--teal-soft); color:var(--teal-deep); font-weight:800; font-size:.85rem; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .step-title{font-weight:800; font-size:1rem;}
  .lesson-body p{margin-bottom:10px;}
  .lesson-body p:last-child{margin-bottom:0;}
  .lesson-body ul{margin:6px 0 10px 18px;}
  .lesson-body li{margin-bottom:4px;}
  .grammar-table{width:100%; border-collapse:collapse; font-size:.92rem; margin:8px 0 6px;}
  .grammar-table th{background:var(--teal-soft); color:var(--teal-deep); font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; padding:8px 10px; text-align:left;}
  .grammar-table td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
  .grammar-table td:first-child{color:var(--muted); font-size:.85rem; width:34%;}
  .grammar-table td:last-child{font-weight:700;}
  .grammar-table .am{color:var(--coral);}
  .callout{background:#fff3d6; border-left:3px solid var(--gold); padding:10px 12px; border-radius:0 8px 8px 0; margin:10px 0; font-size:.9rem;}
  .callout b{color:#8a6410;}
  .callout.teal{background:var(--teal-soft); border-left-color:var(--teal);}
  .callout.teal b{color:var(--teal-deep);}
  .example-row{padding:10px 0; border-bottom:1px solid var(--line);}
  .example-row:last-child{border-bottom:none;}
  .example-es{font-weight:700; font-size:1.02rem; margin-bottom:3px;}
  .example-es .verb, .lesson-body .verb{color:var(--coral); text-decoration:underline; text-decoration-color:var(--coral-soft); text-decoration-thickness:3px; text-underline-offset:2px;}
  .example-en{color:var(--muted); font-size:.88rem;}
  .example-note{font-size:.78rem; color:var(--muted); font-style:italic; margin-top:4px;}
  .practice-q .stem{font-size:1.05rem; margin-bottom:8px;}
  .blank{display:inline-block; min-width:70px; border-bottom:2px solid var(--coral); color:var(--coral); font-weight:700; text-align:center; padding:0 6px;}
  .hint-inline{font-size:.82rem; color:var(--muted); margin-bottom:8px;}
  .qbox{background:#f7faf9; padding:14px; margin:10px 0; border:1px solid var(--line); border-radius:12px;}
  .score-box{text-align:center; padding:20px 16px; background:linear-gradient(135deg, var(--teal-soft) 0%, #fff 100%); border:1px solid var(--teal-soft); border-radius:var(--radius); margin:14px 0;}
  .score-num{font-size:2.5rem; font-weight:800; color:var(--teal-deep); letter-spacing:-.02em;}
  .score-lbl{color:var(--muted); font-size:.85rem; font-weight:600; margin-top:4px;}
  .feedback small{display:block; font-weight:500; color:var(--muted); margin-top:4px;}
  .opt.picked{border-color:var(--teal); background:var(--teal-soft); color:var(--teal-deep);}
  .lesson-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); cursor:pointer;}
  .lesson-row:last-child{border-bottom:none;}
  .lesson-row .ln{width:30px; height:30px; border-radius:50%; background:#eef2f1; color:var(--muted); font-weight:800; font-size:.8rem; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .lesson-row.done .ln{background:var(--good); color:#fff;}
  .lesson-row.next .ln{background:var(--coral); color:#fff;}
  .lesson-row .lt{flex:1;}
  .lesson-row .lt b{display:block; font-size:.95rem;}
  .lesson-row .lt span{font-size:.78rem; color:var(--muted);}
  .lesson-row .ls{font-size:.78rem; font-weight:700; color:var(--muted); white-space:nowrap;}
  .unit-title{font-size:.78rem; font-weight:800; color:var(--teal-deep); text-transform:uppercase; letter-spacing:.06em; margin:16px 0 4px;}
  /* ---- v2: cards ---- */
  .flash .situation{font-size:.88rem; color:var(--muted); font-style:italic; max-width:460px;}
  .flash .kind{font-size:.68rem; color:var(--teal-deep); text-transform:uppercase; letter-spacing:.06em; font-weight:700; background:var(--teal-soft); padding:4px 10px; border-radius:999px;}
  .flash .front{font-size:1.15rem; font-weight:600; line-height:1.45; max-width:100%;}
  .flash .front .blank{color:var(--coral);}
  .flash .street{font-size:1.4rem; color:var(--coral); font-weight:800;}
  .flash .answer{font-size:1.35rem; font-weight:800; color:var(--teal-deep);}
  .flash input[type=text]{max-width:360px; margin-top:4px;}
  .flash .said{font-size:1.05rem; font-weight:700; background:#eef2f1; padding:8px 14px; border-radius:14px 14px 14px 4px; max-width:100%;}
  /* ---- v2: plan ---- */
  .plan-step{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);}
  .plan-step:last-child{border-bottom:none;}
  .plan-step .pn{width:30px; height:30px; border-radius:50%; background:var(--coral); color:#fff; font-weight:800; font-size:.85rem; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .plan-step.opt .pn{background:#eef2f1; color:var(--muted);}
  .plan-step .pt{flex:1;}
  .plan-step .pt b{display:block; font-size:.95rem;}
  .plan-step .pt span{font-size:.8rem; color:var(--muted);}
</style>
</head>
<body>

<header>
  <div class="head-row">
    <h1>Maracucho <span class="accent">·</span> entrenador</h1>
    <div class="xp-pill" id="xpPill">0 XP</div>
  </div>
  <nav id="nav"></nav>
</header>

<main>
  <section id="tab-inicio"></section>
  <section id="tab-sesion"></section>
  <section id="tab-lecciones"></section>
  <section id="tab-tarjetas"></section>
  <section id="tab-verbos"></section>
  <section id="tab-hablar"></section>
  <section id="tab-escuchar"></section>
  <section id="tab-charla"></section>
  <section id="tab-ajustes"></section>
  <!-- LAYER 2 (Charla) lives in the clearly marked block near the end
       of the script. Remove that block plus the "charla" entry in TABS
       and the offline core still works exactly the same. -->
</main>

<script>
"use strict";
// True when running from the HTTPS-hosted copy (GitHub Pages): fully offline
// via service worker, but no Mac features (Charla, wifi sync).
const HOSTED = location.protocol === "https:";
/* =====================================================================
   VOCAB v2 — every card is one of five kinds:
     cloze  fill the blank in a Spanish sentence, given a situation
     scen   produce a whole phrase from a real-life situation
     reply  someone says something; you answer with the target phrase
     verb   conjugate inside a real sentence (hint: verb · person · tense)
     phon   read the street spelling, pick the meaning
   Fields: id, k, t (topic), r ("e" safe with elders / "c" casual),
   l (optional: lesson id that must be passed before this card appears),
   then kind-specific: sit, stem, said, ans, acc (accepted variants),
   mean (English meaning), n (note), s (street pronunciation).
   The English side never contains the answer word.
   ids 1-104 keep the meaning of the v1 cards so progress carries over.
===================================================================== */
const TOPICS = {
  familia:"Conocer a la familia", comidas:"Comidas", charla:"Charla", casa:"Casa y rutina",
  emociones:"Reacciones", textos:"Textos", preguntas:"Preguntas", spanglish:"Spanglish",
  gramatica:"Gramática en contexto", oido:"Oído caribeño", boda:"La boda"
};

const VOCAB = [
 // ---- Meeting the family (1-15) ----
 {id:1, k:"scen", t:"familia", r:"e", sit:"You're introduced to a cousin for the first time. Say 'nice to meet you' (the short, universal one).", ans:"Mucho gusto", mean:"Nice to meet you. Works with everyone."},
 {id:2, k:"scen", t:"familia", r:"e", sit:"You're introduced to her grandfather. Say 'a pleasure to meet you' with the usted-level formality (lo for a man).", ans:"Un placer conocerlo", acc:["un placer conocerle","un placer"], mean:"A pleasure to meet you (to an older man; conocerla for a woman)."},
 {id:3, k:"scen", t:"familia", r:"e", sit:"Her mom opens the door. Ask how she is, respectfully.", ans:"¿Cómo está usted?", acc:["como esta usted","como esta"], mean:"How are you? (usted, for parents and grandparents)"},
 {id:4, k:"scen", t:"familia", r:"c", sit:"A cousin your age walks in. Ask how they are.", ans:"¿Cómo estás?", acc:["como estas"], mean:"How are you? (tú, with peers)", s:"¿Cómo ehtáh?"},
 {id:5, k:"cloze", t:"familia", r:"e", sit:"Explaining who's who to a friend:", stem:"La mamá de Maria es mi ___.", ans:"suegra", mean:"mother-in-law (used even before marriage)"},
 {id:6, k:"cloze", t:"familia", r:"e", sit:"Same conversation:", stem:"El papá de Maria es mi ___.", ans:"suegro", mean:"father-in-law"},
 {id:7, k:"cloze", t:"familia", r:"e", sit:"Her brother, from your side:", stem:"El hermano de Maria es mi ___.", ans:"cuñado", mean:"brother-in-law (cuñada = sister-in-law)"},
 {id:8, k:"reply", t:"familia", r:"c", sit:"Her grandmother hands you a plate and says:", said:"Come, ___, que estás flaco.", stem:"What's the affectionate word she'd use for you?", ans:"mijo", acc:["mi hijo"], mean:"'sweetie, dear' (from mi hijo). Elders say it to you; you don't say it back.", n:"You will hear this constantly. Warm."},
 {id:9, k:"scen", t:"familia", r:"e", sit:"You're leaving her parents' house. Tell them 'let me know' (if anything comes up).", ans:"Avísame", acc:["avíseme","aviseme","avisame"], mean:"Let me know / give me a heads-up. (avíseme to an elder)", n:"From avisar. Extremely high-frequency."},
 {id:10, k:"scen", t:"familia", r:"e", sit:"Her cousin arrives at your place for the first time. Welcome him (one word).", ans:"Bienvenido", acc:["bienvenida"], mean:"Welcome (bienvenida for a woman)"},
 {id:11, k:"scen", t:"familia", r:"e", sit:"You need to squeeze past her aunt in the kitchen. What do you say?", ans:"Con permiso", mean:"Excuse me (passing by, leaving the table)"},
 {id:12, k:"scen", t:"familia", r:"e", sit:"End of the visit. Thank her parents for having you.", ans:"Gracias por recibirme", acc:["gracias por recibirnos"], mean:"Thanks for having me"},
 {id:13, k:"cloze", t:"familia", r:"c", sit:"Pointing out a guy at the party to Maria:", stem:"¿Quién es ese ___ de la camisa azul?", ans:"chamo", mean:"guy / kid (Venezuelan). chama for a girl."},
 {id:14, k:"scen", t:"familia", r:"c", sit:"Ask a cousin what part of Maracaibo they're from (tú).", ans:"¿De qué parte de Maracaibo eres?", acc:["de que parte de maracaibo eres","de que parte eres"], mean:"What part of Maracaibo are you from?", s:"¿De qué parte de Maracaibo ereh?"},
 {id:15, k:"scen", t:"familia", r:"e", sit:"Saying goodbye to her uncle. Ask him to say hi to the family for you.", ans:"Saludos a la familia", acc:["saludos a todos"], mean:"Say hi to the family for me"},

 // ---- Meals (16-30) ----
 {id:16, k:"cloze", t:"comidas", r:"e", sit:"Breakfast. Her mom asks what you want. The round corn cake, split and filled:", stem:"Quiero una ___ con queso, por favor.", ans:"arepa", mean:"the corn cake that's the daily staple"},
 {id:17, k:"cloze", t:"comidas", r:"e", sit:"Party food. The fried cheese sticks are gone:", stem:"¡Se acabaron los ___!", ans:"tequeños", mean:"fried cheese sticks, the party food", s:"loh tequeñoh"},
 {id:18, k:"cloze", t:"comidas", r:"e", sit:"Maracaibo's signature sandwich, on fried green plantain instead of bread:", stem:"En Maracaibo tienes que probar el ___.", ans:"patacón", acc:["patacon"], mean:"fried green plantain 'sandwich', a Maracaibo specialty"},
 {id:19, k:"cloze", t:"comidas", r:"e", sit:"The national dish: rice, black beans, shredded beef, plantain, all on one plate:", stem:"Mi suegra hizo ___ para el almuerzo.", ans:"pabellón", acc:["pabellon"], mean:"the national dish (rice, black beans, shredded beef, plantain)"},
 {id:20, k:"cloze", t:"comidas", r:"e", sit:"December. The whole family spends a day making the wrapped holiday tamales:", stem:"En diciembre hacemos ___ todos juntos.", ans:"hallacas", mean:"the holiday tamale-like dish, wrapped in plantain leaves"},
 {id:21, k:"cloze", t:"comidas", r:"e", sit:"Breakfast at your suegra's. She sets down a plate of fried cornmeal rings and says:", stem:"¿Quieres ___ recién hechas?", ans:"mandocas", acc:["una mandoca","la mandoca"], mean:"Maracucho fried cornmeal rings, classic breakfast"},

 {id:25, k:"scen", t:"comidas", r:"e", sit:"Second bite. It's really, really good. Say so (the -ísimo one).", ans:"Está buenísimo", acc:["esta buenisimo","buenísimo","buenisimo","está buenísima","esta buenisima"], mean:"It's really good", s:"'Tá buenísimo"},
 {id:26, k:"scen", t:"comidas", r:"c", sit:"Maria's plate is empty. Ask if she wants more (tú).", ans:"¿Quieres más?", acc:["quieres mas"], mean:"Do you want more? (tú)", s:"¿Quiereh máh?"},
 {id:27, k:"scen", t:"comidas", r:"e", sit:"Her dad's plate is empty. Ask if he'd like more (usted).", ans:"¿Quiere más?", acc:["quiere mas","quiere usted mas","¿quiere usted más?"], mean:"Would you like more? (usted, to elders)"},
 {id:28, k:"reply", t:"comidas", r:"c", sit:"Her aunt offers you a fourth tequeño:", said:"¿Otro tequeño?", stem:"Decline warmly: 'Gracias, pero estoy ___.'", ans:"full", mean:"I'm stuffed (yes, with English 'full', very Venezuelan)"},
 {id:29, k:"scen", t:"comidas", r:"c", sit:"You walk into the kitchen at Maria's. Ask what there is to eat (casual).", ans:"¿Qué hay de comer?", acc:["que hay de comer","que hay"], mean:"What's there to eat?"},
 {id:30, k:"scen", t:"comidas", r:"e", sit:"After dinner, tell her mom you loved the food (past tense).", ans:"Me encantó la comida", acc:["me encanto la comida","me encantó","me encanto"], mean:"I loved the food"},

 // ---- Small talk (31-49) ----
 {id:31, k:"scen", t:"charla", r:"c", sit:"You run into a cousin. The casual Venezuelan 'what's up?' (two words).", ans:"¿Qué más?", acc:["que mas"], mean:"What's up? / How's it going?", s:"¿Qué máh?"},
 {id:32, k:"scen", t:"charla", r:"e", sit:"Her uncle calls. Ask how everything's going (safe with anyone).", ans:"¿Cómo va todo?", acc:["como va todo"], mean:"How's everything going?"},

 {id:34, k:"reply", t:"charla", r:"c", sit:"A cousin proposes the beach at 8. Agree with the one-word Venezuelan 'cool':", said:"¿Playa a las 8?", stem:"___, ahí nos vemos.", ans:"fino", acc:["dale","chévere","chevere"], mean:"cool, great (Venezuelan)"},
 {id:35, k:"reply", t:"charla", r:"c", sit:"Maria says her cousin got engaged. Ask 'for real?' (two words):", said:"¡Mi prima se comprometió!", stem:"¿De ___?", ans:"pana", mean:"for real, seriously"},

 {id:37, k:"cloze", t:"charla", r:"c", sit:"Describing the wedding food to a cousin. 'A ton of' / 'super':", stem:"Los tequeños estaban ___ de buenos.", ans:"burda", mean:"a ton of, super (burda de bueno = really good)"},
 {id:38, k:"scen", t:"charla", r:"c", sit:"Her cousin shows you a photo of Maracaibo's lake bridge lit up. React with THE Maracucho exclamation.", ans:"¡Qué molleja!", acc:["que molleja"], mean:"Wow! / No way! (the Maracucho exclamation)", n:"Signature Maracucho. Fine among family and friends."},
 {id:39, k:"phon", t:"charla", r:"c", street:"¡Vergación, qué caló!", std:"¡Vergación, qué calor!", opts:["Damn, it's hot!","Wow, what a car!","Ugh, what a bore!"], ans:0, mean:"vergación = Maracucho intensifier (damn/whoa). Recognize it; don't lead with it around elders."},
 {id:40, k:"scen", t:"charla", r:"c", sit:"You spot a cousin across the room. The friendly Venezuelan 'hey!'", ans:"¡Épale!", acc:["epale"], mean:"Hey! (friendly greeting)"},
 {id:41, k:"scen", t:"charla", r:"e", sit:"Small talk with her dad. Ask 'and how's work?'", ans:"¿Y qué tal el trabajo?", acc:["y que tal el trabajo","que tal el trabajo","¿y cómo va el trabajo?","y como va el trabajo"], mean:"And how's work?"},
 {id:42, k:"scen", t:"charla", r:"c", sit:"August in Miami. Complain about the heat the Maracaibo way (with the -ón).", ans:"¡Qué calorón!", acc:["que caloron","que calor","qué calor"], mean:"It's so hot! (a very Maracaibo complaint)"},
 {id:43, k:"reply", t:"charla", r:"e", sit:"Maria apologizes for being late:", said:"Perdón, llegué tarde.", stem:"___, no pasa nada.", ans:"tranquila", acc:["tranquilo","tranqui"], mean:"no worries, relax, it's fine (tranquila to a woman)"},
 {id:44, k:"reply", t:"charla", r:"c", sit:"A friend texts:", said:"¿Nos vemos a las 8?", stem:"___, ahí te espero.", ans:"dale pues", acc:["dale","dale pue","va"], mean:"alright then, sounds good", s:"dale pueh"},
 {id:45, k:"reply", t:"charla", r:"e", sit:"Her dad asks if the wedding is in November or December. You don't know for sure:", said:"¿Es en noviembre?", stem:"No estoy ___.", ans:"seguro", mean:"I'm not sure (segura if you were a woman)"},
 {id:46, k:"reply", t:"charla", r:"e", sit:"Her grandmother asks if you understood her story. You got most of it:", said:"¿Entendiste?", stem:"___, la mitad, jaja.", ans:"más o menos", acc:["mas o menos"], mean:"so-so, more or less", s:"máh o menoh"},
 {id:47, k:"reply", t:"charla", r:"e", sit:"Her mom hopes the weather holds for the wedding:", said:"Ojalá no llueva el sábado.", stem:"___, sí.", ans:"ojalá", acc:["ojala"], mean:"hopefully, I hope so"},
 {id:48, k:"cloze", t:"charla", r:"c", sit:"Cousin describing last night:", stem:"Fue una ___ hasta las cuatro de la mañana.", ans:"parranda", acc:["rumba"], mean:"party, revelry"},
 {id:49, k:"cloze", t:"charla", r:"c", sit:"Where the cousins hang out:", stem:"El ___ de los primos es la casa del tío Luis.", ans:"juntadero", mean:"casual get-together spot, hangout"},

 // ---- Texting (50-66) ----
 {id:50, k:"cloze", t:"textos", r:"c", sit:"Texting. Abbreviate 'que/qué':", stem:"___ haces?", ans:"q", acc:["k"], mean:"que / qué (texting)"},
 {id:51, k:"cloze", t:"textos", r:"c", sit:"Texting. Abbreviate 'por qué':", stem:"___ no me dijiste?", ans:"xq", acc:["pq","porq"], mean:"porque / por qué (texting)"},
 {id:52, k:"cloze", t:"textos", r:"c", sit:"Texting. Shorten 'estoy':", stem:"___ en casa, ven.", ans:"toy", mean:"estoy (texting: toy en casa = I'm home)"},

 {id:55, k:"cloze", t:"textos", r:"c", sit:"Texting. Abbreviate 'también':", stem:"Yo ___ te extraño.", ans:"tmb", acc:["tb"], mean:"también (texting)"},
 {id:56, k:"reply", t:"textos", r:"c", sit:"She texts she'll be 10 minutes late:", said:"Voy tarde, perdón!", stem:"Reply with the 3-letter 'don't worry':", ans:"ntp", mean:"no te preocupes (texting)"},
 {id:57, k:"reply", t:"textos", r:"c", sit:"She texts:", said:"Te paso a buscar a las 7?", stem:"Agree with the one-word 'okay, go ahead':", ans:"dale", acc:["va","fino","ok"], mean:"okay, go ahead, sounds good"},
 {id:58, k:"reply", t:"textos", r:"c", sit:"She asks if you sent the address yet. You did:", said:"Mandaste la dirección?", stem:"One word: 'done':", ans:"listo", mean:"done / okay / ready"},
 {id:59, k:"reply", t:"textos", r:"c", sit:"She texts:", said:"¿Nos vemos a las 8?", stem:"The shortest possible 'okay' (two letters):", ans:"va", mean:"okay (short agreement)"},
 {id:60, k:"cloze", t:"textos", r:"c", sit:"Closing a text to Maria. Abbreviate 'te quiero mucho':", stem:"Buenas noches, ___ ❤️", ans:"tqm", acc:["tkm"], mean:"te quiero mucho (texting)"},
 {id:61, k:"cloze", t:"textos", r:"c", sit:"Opening a text to Maria with 'babe' (the two-letter version):", stem:"Hola ___, q haces?", ans:"bb", acc:["bebé","bebe"], mean:"babe"},
 {id:62, k:"scen", t:"textos", r:"c", sit:"The most common term of endearment for Maria, two words:", ans:"mi amor", mean:"my love"},
 {id:63, k:"cloze", t:"textos", r:"c", sit:"She sends a meme. Laugh in Spanish:", stem:"___ no puede ser", ans:"jajaja", acc:["jaja","jajajaja"], mean:"hahaha (Spanish laughing: j, never h)"},
 {id:64, k:"scen", t:"textos", r:"c", sit:"You're at the restaurant and she's not. Text 'where are you?'", ans:"¿Dónde estás?", acc:["donde estas","dnd tas","dónde tas","donde tas"], mean:"Where are you? (tú)", s:"¿Ónde ehtáh?"},
 {id:65, k:"scen", t:"textos", r:"e", sit:"You just left the house. Text her 'on my way'.", ans:"Ya voy en camino", acc:["voy en camino","en camino"], mean:"On my way"},
 {id:66, k:"scen", t:"textos", r:"e", sit:"She's driving to her parents' tonight. Ask her to text you when she gets there.", ans:"Avísame cuando llegues", acc:["avisame cuando llegues","escríbeme cuando llegues","escribeme cuando llegues"], mean:"Text me when you get there"},

 // ---- Common questions (67-76) ----
 {id:67, k:"scen", t:"preguntas", r:"e", sit:"You don't know the word for 'dishwasher'. Ask her mom 'how do you say...?'", ans:"¿Cómo se dice...?", acc:["como se dice"], mean:"How do you say...?"},

 {id:70, k:"scen", t:"preguntas", r:"c", sit:"A cousin mumbled. Ask 'say that again?' casually (tú).", ans:"¿Me lo repites?", acc:["me lo repites","¿cómo?","como"], mean:"Say that again? (tú, casual)"},
 {id:71, k:"scen", t:"preguntas", r:"c", sit:"You just met Maria's cousin at a wedding. Ask him how long he's lived here (tú).", ans:"¿Cuánto tiempo llevas aquí?", acc:["cuanto tiempo llevas aqui","cuanto tiempo llevas aqui en la florida","¿cuánto tiempo llevas viviendo aquí?","cuanto tiempo llevas viviendo aqui"], mean:"How long have you been here? 'Llevas aquí' = have been here, no perfect tense needed."},
 {id:72, k:"scen", t:"preguntas", r:"e", sit:"You need the bathroom at a relative's house. Ask where it is (the 'located' verb).", ans:"¿Dónde queda el baño?", acc:["donde queda el baño","donde queda el bano","¿dónde está el baño?","donde esta el baño"], mean:"Where is the bathroom (located)?"},
 {id:73, k:"scen", t:"preguntas", r:"e", sit:"Ask what time the wedding is.", ans:"¿A qué hora es la boda?", acc:["a que hora es la boda","a que hora es"], mean:"What time is the wedding?"},
 {id:74, k:"scen", t:"preguntas", r:"c", sit:"You can't figure out the Spanish keyboard. Ask Maria to help you with this (tú).", ans:"¿Me ayudas con esto?", acc:["me ayudas con esto","me ayudas"], mean:"Can you help me with this? (tú)"},

 {id:76, k:"scen", t:"preguntas", r:"c", sit:"At a Venezuelan restaurant with Maria. Ask what she recommends (tú).", ans:"¿Qué me recomiendas?", acc:["que me recomiendas"], mean:"What do you recommend? (tú)"},

 {id:99, k:"scen", t:"boda", r:"e", sit:"The bride walks in. Say 'she looks beautiful' to whoever's next to you.", ans:"Se ve hermosa", acc:["se ve hermosa","está hermosa","esta hermosa","qué hermosa","que hermosa"], mean:"She looks beautiful (about the bride)"},

 {id:102, k:"scen", t:"boda", r:"e", sit:"An aunt you've never met asks who you are. Your intro line.", ans:"Soy Noah, el novio de Maria", acc:["soy noah el novio de maria","noah, el novio de maria","mucho gusto, soy noah, el novio de maria"], mean:"I'm Noah, Maria's boyfriend (your intro line)"},

 {id:119, k:"scen", t:"familia", r:"e", sit:"Her grandmother's birthday. Say 'happy birthday'.", ans:"Feliz cumpleaños", acc:["feliz cumple"], mean:"Happy birthday"},

 {id:123, k:"scen", t:"familia", r:"e", sit:"Her dad is heading out on a trip. 'Have a good trip.'", ans:"Buen viaje", acc:["que le vaya bien","que tenga buen viaje"], mean:"Have a good trip"},
 {id:124, k:"scen", t:"familia", r:"e", sit:"Someone sneezes at the table. What do you say?", ans:"Salud", mean:"Bless you (same word as cheers)"},

 sub:"Completed past actions · the tense you need most",
 intro:"The preterite is the past tense for actions that happened, finished, and can be pinned to a moment: I ate, she called, we drove. It's your English simple past. It is also the tense you're weakest in and the one her family will use with you constantly, so it comes first. By the end you'll build past sentences with any regular verb.",

 {title:"Concepto", body:`
  <p>Spanish has two everyday past tenses: the <b>pretérito</b> and the <b>imperfecto</b>. English mostly gets by with one, which is why this feels foreign. This lesson is only the preterite. The imperfect is Lesson 4, and the two get compared in Lessons 5 and 6.</p>
  <p>Use the preterite when the action <b>happened once, is over, and you could say when</b>. Think of it as a snapshot with a timestamp.</p>
  <div class="callout"><b>Quick test:</b> if you can naturally put "ayer" (yesterday), "anoche" (last night), "la semana pasada" (last week), "el sábado" (on Saturday) or "una vez" (once) in front of the sentence, you want the preterite.</div>
  <p>Some common time markers that signal preterite:</p>
  <ul>
   <li><b>ayer</b> yesterday · <b>anoche</b> last night · <b>anteayer</b> the day before yesterday</li>
   <li><b>la semana pasada</b> last week · <b>el mes pasado</b> last month · <b>el año pasado</b> last year</li>
   <li><b>el lunes</b> on Monday (a specific one) · <b>en 2019</b> in 2019 · <b>hace dos días</b> two days ago</li>
   <li><b>una vez</b> once · <b>de repente</b> suddenly · <b>por fin</b> finally</li>
  </ul>
  <p>What the preterite is <i>not</i> for: habits ("I used to eat there every Sunday"), descriptions of how things were ("the house was big"), or actions in progress ("I was cooking when..."). Those are imperfect territory. For now, just notice the difference; you'll drill it later.</p>
  <div class="callout teal"><b>Why this matters for you:</b> "¿Qué hiciste el fin de semana?" (What did you do this weekend?) is the most common question you'll get at family gatherings. Every answer is preterite.</div>
 `},
 {title:"Las terminaciones", body:`
  <p>Two patterns. Verbs ending in <b>-AR</b> take one set of endings. Verbs in <b>-ER</b> and <b>-IR</b> share the other. Drop the -ar/-er/-ir and add the ending.</p>
  <h3>-AR (hablar, to talk)</h3>
  <table class="grammar-table">
   <tr><th>Persona</th><th>Forma</th></tr>
   <tr><td>yo</td><td>habl<span class="am">é</span></td></tr>
   <tr><td>tú</td><td>habl<b>aste</b></td></tr>
   <tr><td>usted / él / ella</td><td>habl<span class="am">ó</span></td></tr>
   <tr><td>nosotros</td><td>habl<b>amos</b></td></tr>
   <tr><td>ustedes / ellos</td><td>habl<b>aron</b></td></tr>
  </table>
  <h3>-ER and -IR (comer, to eat · vivir, to live)</h3>
  <table class="grammar-table">
   <tr><th>Persona</th><th>comer</th></tr>
   <tr><td>yo</td><td>com<span class="am">í</span></td></tr>
   <tr><td>tú</td><td>com<b>iste</b></td></tr>
   <tr><td>usted / él / ella</td><td>com<span class="am">ió</span></td></tr>
   <tr><td>nosotros</td><td>com<b>imos</b></td></tr>
   <tr><td>ustedes / ellos</td><td>com<b>ieron</b></td></tr>
  </table>
  <p>vivir works exactly like comer: viví, viviste, vivió, vivimos, vivieron.</p>
  <div class="callout"><b>Three things to notice.</b> (1) The accent on the <b>yo</b> and <b>usted/él/ella</b> forms is not decoration: <i>hablo</i> is "I talk" and <i>habló</i> is "he talked". In speech the stress moves to the last syllable. (2) The <b>nosotros</b> form of -AR and -IR verbs is spelled the same as the present (hablamos, vivimos). The time marker tells you which it is. (3) There is no accent on <b>-aron</b> / <b>-ieron</b>.</div>
  <p>Say them out loud in a rhythm: <i>hablé, hablaste, habló, hablamos, hablaron</i>. The stress pattern is the thing your ear needs to own.</p>
  <div class="callout teal"><b>Usted and ustedes:</b> the family uses usted with elders and ustedes for any group. Both borrow the él/ellos forms, so "¿Comió bien?" works for grandma and "¿Llegaron bien?" works for the cousins as a group.</div>
 `},
 {title:"En contexto", body:`
  <p>Six sentences you could realistically say this month. The preterite verb is underlined. Read each one aloud.</p>
  <div class="example-row"><div class="example-es">Ayer <span class="verb">comí</span> tres arepas.</div><div class="example-en">Yesterday I ate three arepas.</div><div class="example-note">comer · yo. "Ayer" is the tell.</div></div>
  <div class="example-row"><div class="example-es">¿<span class="verb">Trabajaste</span> el fin de semana?</div><div class="example-en">Did you work over the weekend? (to your girlfriend or a cousin)</div><div class="example-note">trabajar · tú. The weekend is finished, so preterite.</div></div>
  <div class="example-row"><div class="example-es">Su mamá <span class="verb">preparó</span> hallacas para la Navidad.</div><div class="example-en">Her mom made hallacas for Christmas.</div><div class="example-note">preparar · ella. Note the accent on preparó.</div></div>
  <div class="example-row"><div class="example-es">Anoche <span class="verb">hablamos</span> por dos horas.</div><div class="example-en">Last night we talked for two hours.</div><div class="example-note">hablar · nosotros. Same spelling as present, but "anoche" pins it to the past.</div></div>
  <div class="example-row"><div class="example-es">Los primos <span class="verb">llegaron</span> tarde a la fiesta.</div><div class="example-en">The cousins arrived late to the party.</div><div class="example-note">llegar · ellos. No accent on llegaron.</div></div>
  <div class="example-row"><div class="example-es">¿Usted <span class="verb">vivió</span> en Maracaibo muchos años?</div><div class="example-en">Did you live in Maracaibo for many years? (to her dad)</div><div class="example-note">vivir · usted. Polite, and a great conversation opener.</div></div>
  <div class="callout"><b>Pattern to steal:</b> [time marker] + [preterite verb] + [what]. "El sábado cociné pabellón." "Anoche vimos una película." Once the frame is automatic, you only have to swap the pieces.</div>

 intro:"Eight verbs cover a huge share of everyday past-tense talk, and none of them follow the regular pattern. The good news: seven of them share one new set of endings, and once you see the stems as a family instead of eight random words, they stick. This is the single highest-value lesson in the app.",

 steps:[
 {title:"Concepto", body:`
  <p>These eight verbs are irregular in the preterite because they were irregular in Latin two thousand years ago and nobody fixed them. You can't derive them; you memorize them. But you can memorize them <i>efficiently</i>.</p>
  <p>Here's the structure. Seven of the eight (all except ser/ir) work the same way: a <b>new stem</b> plus <b>one shared set of endings</b>. The endings are:</p>
  <table class="grammar-table">
   <tr><th>Persona</th><th>Ending</th></tr>
   <tr><td>yo</td><td>-e</td></tr>
   <tr><td>tú</td><td>-iste</td></tr>
   <tr><td>usted / él / ella</td><td>-o</td></tr>
   <tr><td>nosotros</td><td>-imos</td></tr>
   <tr><td>ustedes / ellos</td><td>-ieron (or -eron after j)</td></tr>
  </table>
  <div class="callout"><b>The one thing that surprises everyone:</b> no accent marks. Regular preterite has hablé and habló. These irregulars have tuve and tuvo, stress on the <i>first</i> syllable. If you say "tuvé" or "hizó", it sounds wrong immediately. Stress the stem.</div>
  <p>So the job is: learn seven stems, learn one ending set, learn ser/ir as its own thing. That's it.</p>
 `},
 {title:"Los stems y las formas", body:`
  <p>The seven stems, grouped by what happens to the vowel:</p>
  <table class="grammar-table">
   <tr><th>Verbo</th><th>Stem</th></tr>
   <tr><td>tener (to have)</td><td>tuv-</td></tr>
   <tr><td>estar (to be, state)</td><td>estuv-</td></tr>
   <tr><td>poder (to be able)</td><td>pud-</td></tr>
   <tr><td>hacer (to do/make)</td><td>hic- (hiz- for usted/él)</td></tr>
   <tr><td>querer (to want)</td><td>quis-</td></tr>
   <tr><td>venir (to come)</td><td>vin-</td></tr>
   <tr><td>decir (to say)</td><td>dij-</td></tr>
  </table>
  <p>Three "u" stems (tuv, estuv, pud), three "i" stems (hic, quis, vin), and one "j" stem (dij). Plug in the endings:</p>
  <table class="grammar-table">
   <tr><th></th><th>tener · hacer · decir</th></tr>
   <tr><td>yo</td><td>tuve · hice · dije</td></tr>
   <tr><td>tú</td><td>tuviste · hiciste · dijiste</td></tr>
   <tr><td>usted / él / ella</td><td>tuvo · hi<span class="am">z</span>o · dijo</td></tr>
   <tr><td>nosotros</td><td>tuvimos · hicimos · dijimos</td></tr>
   <tr><td>ustedes / ellos</td><td>tuvieron · hicieron · dij<span class="am">eron</span></td></tr>
  </table>
  <div class="callout"><b>Two spelling notes.</b> hacer becomes <b>hizo</b> (z, not c) in the usted/él form to keep the "s" sound. decir becomes <b>dijeron</b>, not dijieron: after a j, the i drops.</div>
  <h3>ser and ir: identical twins</h3>
  <table class="grammar-table">
   <tr><th>Persona</th><th>ser = ir</th></tr>
   <tr><td>yo</td><td>fui</td></tr>
   <tr><td>tú</td><td>fuiste</td></tr>
   <tr><td>usted / él / ella</td><td>fue</td></tr>
   <tr><td>nosotros</td><td>fuimos</td></tr>
   <tr><td>ustedes / ellos</td><td>fueron</td></tr>
  </table>
  <p>Yes, "I was" and "I went" are the same word. Context always makes it clear: "Fui al mercado" is going, "Fue un día largo" is being. Nobody gets confused in practice.</p>
  <div class="callout teal"><b>Memory trick:</b> "Tuve que hacer" (I had to do) is one of the most common combos in Spanish. Say it ten times. That single phrase gets you tuve and the feel of stem stress.</div>
 `},

  <div class="example-row"><div class="example-es">¿Qué <span class="verb">hiciste</span> el fin de semana?</div><div class="example-en">What did you do this weekend?</div><div class="example-note">hacer · tú. The question you will hear more than any other.</div></div>

 `},

 id:"pret-cambios", n:3, unitName:U1, tense:"pret",
 title:"Pretéritos con cambios",
 sub:"llegué · busqué · durmió · leyó · dar · ver",
 intro:"The regular preterite has a few predictable wrinkles: spelling fixes that keep a sound intact, a handful of -IR verbs whose stem vowel shifts in two forms, and two tiny verbs (dar, ver) that look irregular but are just short. None of this is hard once you know why it happens. This lesson is about the why.",

 homework:"Write one sentence each with llegué, busqué and durmió. Send them to your girlfriend.",
 steps:[
 {title:"Concepto", body:`
  <p>Three separate things happen here. They look like exceptions but each one has a clean reason.</p>
  <p><b>1. Spelling fixes in the yo form (-car, -gar, -zar).</b> Spanish spelling protects sounds. "Llegar" has a hard g. If you just added -é you'd get "llegé", which reads with a soft "h" sound. So the spelling adjusts: <b>llegué</b>. Same logic for -car (busqué) and -zar (empecé). Only the yo form changes; everything else is regular.</p>
  <p><b>2. Stem vowel shift in -IR verbs (only usted/él and ellos).</b> A few -IR verbs whose stem has an e or o change it to i or u, but only in the third-person forms. dormir: dormí, dormiste, <b>durmió</b>, dormimos, <b>durmieron</b>. pedir (to ask for): pedí, pediste, <b>pidió</b>, pedimos, <b>pidieron</b>.</p>
  <p><b>3. The "i becomes y" rule between vowels.</b> When the stem ends in a vowel, "-ió" and "-ieron" become "-yó" and "-yeron", because Spanish doesn't like an unstressed i sitting between two vowels. leer: leí, leíste, <b>leyó</b>, leímos, <b>leyeron</b>. oír (to hear): oí, oíste, <b>oyó</b>, oímos, <b>oyeron</b>.</p>
  <div class="callout"><b>Plus two shorties:</b> dar (to give) and ver (to see) are so short they don't need accents. di, diste, dio, dimos, dieron. vi, viste, vio, vimos, vieron. That's the whole story.</div>
 `},
 {title:"Las formas", body:`
  <h3>Spelling fixes, yo form only</h3>
  <table class="grammar-table">
   <tr><th>Verbo</th><th>yo</th></tr>
   <tr><td>llegar (to arrive)</td><td>lle<span class="am">gu</span>é</td></tr>
   <tr><td>pagar (to pay)</td><td>pa<span class="am">gu</span>é</td></tr>
   <tr><td>jugar (to play)</td><td>ju<span class="am">gu</span>é</td></tr>
   <tr><td>buscar (to look for)</td><td>bus<span class="am">qu</span>é</td></tr>
   <tr><td>sacar (to take out)</td><td>sa<span class="am">qu</span>é</td></tr>
   <tr><td>empezar (to start)</td><td>empe<span class="am">c</span>é</td></tr>
   <tr><td>almorzar (to have lunch)</td><td>almor<span class="am">c</span>é</td></tr>
  </table>
  <p>The tú form and everything after it are regular: llegaste, llegó, llegamos, llegaron.</p>
  <h3>Stem shift, third person only (-IR verbs)</h3>
  <table class="grammar-table">
   <tr><th>Verbo</th><th>usted/él · ellos</th></tr>
   <tr><td>dormir (to sleep)</td><td>d<span class="am">u</span>rmió · d<span class="am">u</span>rmieron</td></tr>
   <tr><td>morir (to die)</td><td>m<span class="am">u</span>rió · m<span class="am">u</span>rieron</td></tr>
   <tr><td>pedir (to ask for/order)</td><td>p<span class="am">i</span>dió · p<span class="am">i</span>dieron</td></tr>
   <tr><td>servir (to serve)</td><td>s<span class="am">i</span>rvió · s<span class="am">i</span>rvieron</td></tr>
   <tr><td>sentir (to feel)</td><td>s<span class="am">i</span>ntió · s<span class="am">i</span>ntieron</td></tr>
   <tr><td>preferir (to prefer)</td><td>pref<span class="am">i</span>rió · pref<span class="am">i</span>rieron</td></tr>
   <tr><td>conseguir (to find, Venezuelan)</td><td>cons<span class="am">i</span>guió · cons<span class="am">i</span>guieron</td></tr>
  </table>
  <p>Only -IR verbs do this. dormir does it, but "volver" (an -ER verb) does not: volvió.</p>
  <h3>i → y between vowels</h3>
  <table class="grammar-table">
   <tr><th>Verbo</th><th>usted/él · ellos</th></tr>
   <tr><td>leer (to read)</td><td>le<span class="am">y</span>ó · le<span class="am">y</span>eron</td></tr>
   <tr><td>creer (to believe)</td><td>cre<span class="am">y</span>ó · cre<span class="am">y</span>eron</td></tr>
   <tr><td>oír (to hear)</td><td>o<span class="am">y</span>ó · o<span class="am">y</span>eron</td></tr>
   <tr><td>caer (to fall)</td><td>ca<span class="am">y</span>ó · ca<span class="am">y</span>eron</td></tr>
  </table>
  <div class="callout teal"><b>conseguir</b> is worth extra attention: in Venezuela it means "to find" far more than "to get". "No conseguí las llaves" is "I couldn't find the keys". You'll hear it daily.</div>
 `},
 {title:"En contexto", body:`
  <div class="example-row"><div class="example-es"><span class="verb">Llegué</span> a las nueve y <span class="verb">busqué</span> a Maria.</div><div class="example-en">I arrived at nine and looked for Maria.</div><div class="example-note">Two yo-form spelling fixes in one sentence.</div></div>
  <div class="example-row"><div class="example-es">Mi suegra <span class="verb">sirvió</span> el café.</div><div class="example-en">My mother-in-law served the coffee.</div><div class="example-note">servir · ella. e → i in the third person.</div></div>
  <div class="example-row"><div class="example-es">Los primos <span class="verb">durmieron</span> en el sofá.</div><div class="example-en">The cousins slept on the couch.</div><div class="example-note">dormir · ellos. o → u.</div></div>
  <div class="example-row"><div class="example-es">Ayer no <span class="verb">conseguí</span> el pasaporte.</div><div class="example-en">Yesterday I couldn't find the passport.</div><div class="example-note">conseguir · yo, regular in this form. Venezuelan "to find".</div></div>
  <div class="example-row"><div class="example-es">¿<span class="verb">Oyó</span> la noticia?</div><div class="example-en">Did you hear the news? (usted)</div><div class="example-note">oír · usted. i → y.</div></div>
  <div class="example-row"><div class="example-es">Le <span class="verb">di</span> las gracias y <span class="verb">vi</span> que <span class="verb">empecé</span> a entender.</div><div class="example-en">I thanked him and saw that I started to understand.</div><div class="example-note">dar · yo, ver · yo, empezar · yo (z → c).</div></div>
 `},

{
 id:"impf", n:4, unitName:U1, tense:"impf",
 title:"El imperfecto",
 sub:"Habits, descriptions, and what was going on",
 intro:"The imperfect is the other past tense. Where the preterite is a snapshot, the imperfect is the background footage: what things were like, what you used to do, what was happening when something else cut in. It's the easiest tense in Spanish to conjugate (only three irregular verbs in the entire language) and one of the most useful for telling stories about Venezuela, childhood, and \"back then\".",
 outro:"Both past tenses are now yours. The next two lessons teach you when to reach for which, which is where the real fluency lives.",
 homework:"Ask her dad or mom: \"¿Cómo era Maracaibo cuando usted era joven?\" Then just listen. Every verb you hear back will be imperfect.",
 steps:[
 {title:"Concepto", body:`
  <p>The imperfect describes the past without saying it ended. Three main jobs:</p>
  <ul>
   <li><b>Habits and repetition:</b> "We used to eat at grandma's every Sunday." (comíamos)</li>
   <li><b>Descriptions and states:</b> "The house was big. It was hot. I was tired." (era, hacía, estaba)</li>
   <li><b>Ongoing action, especially as background:</b> "I was cooking when she called." (cocinaba)</li>
  </ul>
  <p>English signals: "used to", "would" (as in "we would go every summer"), "was/were ...ing", and any description of how things were. Time markers that pull toward imperfect:</p>
  <ul>
   <li><b>siempre</b> always · <b>nunca</b> never · <b>todos los días</b> every day · <b>cada verano</b> every summer</li>
   <li><b>de niño / de niña</b> as a kid · <b>cuando era joven</b> when I was young · <b>antes</b> before, back then</li>
   <li><b>mientras</b> while · <b>a menudo</b> often · <b>generalmente</b> usually</li>
  </ul>
  <div class="callout"><b>Age, time and weather in the past are almost always imperfect.</b> Tenía veinte años (I was twenty). Eran las ocho (it was eight o'clock). Hacía calor (it was hot). Not tuve, fueron, hizo.</div>
  <div class="callout teal"><b>For you specifically:</b> the family talks about Maracaibo in the imperfect. "Vivíamos cerca del lago." "Íbamos a la playa los domingos." "Hacía un calor terrible." Recognizing this tense unlocks their stories.</div>
 `},
 {title:"Las terminaciones", body:`
  <p>Same two-pattern split as the preterite, and even more regular.</p>
  <h3>-AR (hablar)</h3>
  <table class="grammar-table">
   <tr><th>Persona</th><th>Forma</th></tr>
   <tr><td>yo</td><td>habl<b>aba</b></td></tr>
   <tr><td>tú</td><td>habl<b>abas</b></td></tr>
   <tr><td>usted / él / ella</td><td>habl<b>aba</b></td></tr>
   <tr><td>nosotros</td><td>habl<span class="am">á</span>bamos</td></tr>
   <tr><td>ustedes / ellos</td><td>habl<b>aban</b></td></tr>
  </table>
  <h3>-ER and -IR (comer, vivir)</h3>
  <table class="grammar-table">
   <tr><th>Persona</th><th>comer</th></tr>
   <tr><td>yo</td><td>com<span class="am">ía</span></td></tr>
   <tr><td>tú</td><td>com<span class="am">ías</span></td></tr>
   <tr><td>usted / él / ella</td><td>com<span class="am">ía</span></td></tr>
   <tr><td>nosotros</td><td>com<span class="am">íamos</span></td></tr>
   <tr><td>ustedes / ellos</td><td>com<span class="am">ían</span></td></tr>
  </table>
  <div class="callout"><b>Notice:</b> yo and usted/él/ella are identical (hablaba, comía). Say "yo" or the name when it matters. Every -ER/-IR form carries an accent on the í. The only -AR accent is nosotros (hablábamos).</div>
  <h3>The only three irregulars in the whole language</h3>
  <table class="grammar-table">
   <tr><th></th><th>ser · ir · ver</th></tr>
   <tr><td>yo</td><td>era · iba · veía</td></tr>
   <tr><td>tú</td><td>eras · ibas · veías</td></tr>
   <tr><td>usted / él / ella</td><td>era · iba · veía</td></tr>
   <tr><td>nosotros</td><td>éramos · íbamos · veíamos</td></tr>
   <tr><td>ustedes / ellos</td><td>eran · iban · veían</td></tr>
  </table>
  <p>ver is barely irregular; it just keeps the e. era and iba you simply memorize. Every other verb in Spanish, including tener, hacer, estar, poder, is regular in the imperfect: tenía, hacía, estaba, podía.</p>
 `},
 {title:"En contexto", body:`
  <div class="example-row"><div class="example-es">De niña, Maria <span class="verb">vivía</span> cerca del lago.</div><div class="example-en">As a girl, Maria lived near the lake.</div><div class="example-note">vivir · ella. A state over time, not a single event.</div></div>
  <div class="example-row"><div class="example-es">Los domingos <span class="verb">íbamos</span> a la playa.</div><div class="example-en">On Sundays we would go to the beach.</div><div class="example-note">ir · nosotros. Habit. "Los domingos" = every Sunday.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Hacía</span> mucho calor y no <span class="verb">había</span> luz.</div><div class="example-en">It was really hot and there was no power.</div><div class="example-note">hacer, haber. Weather and "there was" are imperfect. Every Venezuelan story has this line.</div></div>
  <div class="example-row"><div class="example-es">Yo <span class="verb">cocinaba</span> cuando ella llamó.</div><div class="example-en">I was cooking when she called.</div><div class="example-note">cocinar · yo (imperfect, background) + llamó (preterite, the interruption). This is the pattern Lesson 5 drills.</div></div>
  <div class="example-row"><div class="example-es">Mi suegro <span class="verb">era</span> ingeniero y <span class="verb">trabajaba</span> en PDVSA.</div><div class="example-en">My father-in-law was an engineer and worked at PDVSA.</div><div class="example-note">ser · él, trabajar · él. Description of a past state.</div></div>
  <div class="example-row"><div class="example-es">¿Usted <span class="verb">tenía</span> familia en Miami antes de venir?</div><div class="example-en">Did you have family in Miami before coming?</div><div class="example-note">tener · usted. Regular in the imperfect, unlike the preterite tuvo.</div></div>
 `},
 {title:"Práctica guiada", practice:[
  {stem:"De niño, yo ___ en Nueva York.", hint:"vivir · yo", ans:"vivía", acc:["vivia"], tr:"As a kid, I lived in New York."},
  {stem:"Los sábados nosotros ___ arepas.", hint:"hacer · nosotros", ans:"hacíamos", acc:["haciamos"], tr:"On Saturdays we used to make arepas."},
  {stem:"Ella ___ muy joven.", hint:"ser · ella", ans:"era", tr:"She was very young."},
  {stem:"¿Tú ___ a la escuela en Maracaibo?", hint:"ir · tú", ans:"ibas", tr:"Did you go to school in Maracaibo?"},
  {stem:"Siempre ___ calor.", hint:"hacer · impersonal (él)", ans:"hacía", acc:["hacia"], tr:"It was always hot."}
 ]},
 {title:"Examen", test:[
  {stem:"Mis abuelos ___ cerca del lago.", hint:"vivir · ellos", ans:"vivían", acc:["vivian"], tr:"My grandparents lived near the lake."},
  {stem:"Yo ___ veinte años.", hint:"tener · yo", ans:"tenía", acc:["tenia"], tr:"I was twenty."},
  {stem:"Nosotros ___ a la playa cada verano.", hint:"ir · nosotros", ans:"íbamos", acc:["ibamos"], tr:"We would go to the beach every summer."},
  {stem:"___ las ocho de la noche.", hint:"ser · ellas (las ocho)", ans:"eran", tr:"It was eight at night."},
  {stem:"Ella siempre ___ música de Guaco.", hint:"escuchar · ella", ans:"escuchaba", tr:"She always listened to Guaco."},
  {stem:"¿Usted ___ en Maracaibo?", hint:"trabajar · usted", ans:"trabajaba", tr:"Did you work in Maracaibo?"},
  {stem:"Los chamos ___ fútbol en la calle.", hint:"jugar · ellos", ans:"jugaban", tr:"The kids played soccer in the street."},
  {stem:"Yo ___ televisión cuando llegó.", hint:"ver · yo", ans:"veía", acc:["veia"], tr:"I was watching TV when he arrived."},
  {stem:"No ___ luz en toda la ciudad.", hint:"haber · impersonal", ans:"había", acc:["habia"], tr:"There was no power in the whole city."},
  {stem:"Tú ___ muy tímido de niño.", hint:"ser · tú", ans:"eras", tr:"You were very shy as a kid."},
  {stem:"Nosotros ___ arepas todos los días.", hint:"comer · nosotros", ans:"comíamos", acc:["comiamos"], tr:"We ate arepas every day."},
  {stem:"Mi suegra ___ en un hospital.", hint:"trabajar · ella", ans:"trabajaba", tr:"My mother-in-law worked at a hospital."},
  {k:"mc", stem:"Which is imperfect?", opts:["Comí arepas ayer.","Comía arepas todos los días.","Comeré arepas mañana."], ans:1, note:"\"Todos los días\" (every day) is a habit: comía."},
  {k:"mc", stem:"¿Qué significa?", es:"Hacía calor y no había luz.", opts:["It was hot and there was no power.","It's hot and there's no power.","It got hot and the power went out."], ans:0, note:"hacía and había: describing the situation, not narrating events."},
  {k:"mc", stem:"How many verbs are irregular in the imperfect?", opts:["Eight","Three","None"], ans:1, note:"Only ser (era), ir (iba) and ver (veía)."},
  {k:"mc", stem:"\"I was twenty\" in Spanish:", opts:["Tuve veinte años.","Tenía veinte años.","Fui veinte años."], ans:1, note:"Age in the past is imperfect: tenía."},
  {k:"mc", stem:"Which describes a habit?", opts:["Fuimos a la playa el sábado.","Íbamos a la playa los sábados.","Vamos a la playa el sábado."], ans:1, note:"Íbamos + los sábados = we used to go on Saturdays."}
 ]}
 ]
},

{
 id:"pvi-1", n:5, unitName:U1,
 title:"Pretérito vs imperfecto: la regla",
 sub:"Which past tense, and why",
 intro:"You know both past tenses. Now the part that actually makes you sound fluent: choosing between them without thinking. There is one core idea underneath every rule, and once you have it, the rules stop feeling like a list. This lesson gives you the idea, the three questions to ask, and a lot of side-by-side pairs.",
 outro:"You can now choose a past tense on purpose. Next lesson puts both in the same sentence, which is how real stories work.",
 homework:"Tell your girlfriend about your childhood home in three sentences (imperfect), then one thing that happened there once (preterite).",
 steps:[
 {title:"La idea central", body:`
  <p>The preterite <b>moves the story forward</b>. The imperfect <b>sets the scene</b>. That's the whole thing. A story is a sequence of events (preterite) painted on top of a background (imperfect).</p>
  <p>Three questions, in order. Stop at the first "yes".</p>
  <ul>
   <li><b>Is it a description, a state, a feeling, age, time or weather?</b> → imperfect. <i>Era alto. Estaba cansado. Tenía diez años. Eran las tres. Hacía frío.</i></li>
   <li><b>Is it a habit or something repeated over an unspecified stretch?</b> → imperfect. <i>Íbamos cada domingo. Siempre cocinaba mi abuela.</i></li>
   <li><b>Did it happen and finish, once or a counted number of times?</b> → preterite. <i>Fui el domingo. Cocinó tres veces.</i></li>
  </ul>
  <div class="callout"><b>The counting trick:</b> if you can put a number on how many times it happened, it's preterite. "Fui a Maracaibo dos veces" (twice). If the honest answer is "I don't know, it was just what we did", it's imperfect: "Iba a Maracaibo cada verano".</div>
  <div class="callout teal"><b>The duration trap:</b> "for ten years" feels like background, but if the period is closed and measured, it's preterite. <i>Viví en Maracaibo diez años</i> (I lived there ten years, then left). <i>Vivía en Maracaibo</i> (I was living there, no endpoint given). The family will say "Vivimos veinte años en Maracaibo" because that chapter closed.</div>
 `},
 {title:"Verbos que cambian de sentido", body:`
  <p>Some verbs mean slightly different things depending on tense. These are worth memorizing because the preterite versions are super common.</p>
  <table class="grammar-table">
   <tr><th>Imperfect (state)</th><th>Preterite (event)</th></tr>
   <tr><td>sabía = I knew (a fact)</td><td>supe = I found out</td></tr>
   <tr><td>conocía = I knew (a person)</td><td>conocí = I met</td></tr>
   <tr><td>quería = I wanted</td><td>quise = I tried / no quise = I refused</td></tr>
   <tr><td>podía = I was able (in general)</td><td>pude = I managed / no pude = I failed to</td></tr>
   <tr><td>tenía = I had</td><td>tuve = I got, received</td></tr>
   <tr><td>había = there was (scene)</td><td>hubo = there was (an event, e.g. a party)</td></tr>
  </table>
  <p>"Conocí a tu papá en la boda" = I met your dad at the wedding. "Conocía a tu papá" = I already knew your dad. Both are correct Spanish; they say different things.</p>
  <div class="callout"><b>Ser and estar in the past:</b> era/estaba for descriptions and states (most of the time). fue/estuvo when you're rating a finished event: <i>La fiesta estuvo buenísima. Fue un día largo.</i> This is why "estuvo buenísimo" comes up so much: it's the verdict on something that ended.</div>
 `},
 {title:"En contexto: pares", body:`
  <p>Each pair uses the same verb in both tenses so you can feel the difference.</p>
  <div class="example-row"><div class="example-es">Mi abuela <span class="verb">cocinaba</span> todos los días. / El domingo mi abuela <span class="verb">cocinó</span> pabellón.</div><div class="example-en">My grandma cooked every day. / On Sunday my grandma cooked pabellón.</div><div class="example-note">Habit vs one Sunday.</div></div>
  <div class="example-row"><div class="example-es">Yo <span class="verb">vivía</span> en Nueva York. / <span class="verb">Viví</span> en Nueva York cinco años.</div><div class="example-en">I was living in New York. / I lived in New York for five years.</div><div class="example-note">Open background vs closed, measured period.</div></div>
  <div class="example-row"><div class="example-es">No <span class="verb">sabía</span> que eran de Maracaibo. / Ayer <span class="verb">supe</span> que son de Maracaibo.</div><div class="example-en">I didn't know they were from Maracaibo. / Yesterday I found out they're from Maracaibo.</div><div class="example-note">Knowing vs the moment of finding out.</div></div>
  <div class="example-row"><div class="example-es">La casa <span class="verb">era</span> grande. / La fiesta <span class="verb">fue</span> un éxito.</div><div class="example-en">The house was big. / The party was a success.</div><div class="example-note">Description vs verdict on a finished event.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Quería</span> ir pero no <span class="verb">pude</span>.</div><div class="example-en">I wanted to go but I couldn't (didn't manage to).</div><div class="example-note">Wanting = state. Not managing = event.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Conocía</span> a Maria desde 2022. La <span class="verb">conocí</span> en una fiesta.</div><div class="example-en">I'd known Maria since 2022. I met her at a party.</div><div class="example-note">Knew vs met.</div></div>
 `},

  {stem:"Ayer ___ a tu tío en el mall.", hint:"conocer · yo · met for the first time", ans:"conocí", acc:["conoci"], tr:"Yesterday I met your uncle at the mall."},
  {stem:"La comida ___ deliciosa.", hint:"estar · ella · verdict on last night's dinner", ans:"estuvo", tr:"The food was delicious."},
  {stem:"Cuando ___ diez años, vivíamos en Doral.", hint:"tener · yo · age", ans:"tenía", acc:["tenia"], tr:"When I was ten, we lived in Doral."},
  {stem:"No ___ que hoy era feriado.", hint:"saber · yo · state of not knowing", ans:"sabía", acc:["sabia"], tr:"I didn't know today was a holiday."}
 ]},
 {title:"Examen", test:[
  {stem:"Mi suegro ___ ingeniero en Maracaibo.", hint:"ser · él · description", ans:"era", tr:"My father-in-law was an engineer in Maracaibo."},
  {stem:"El sábado nosotros ___ al cine.", hint:"ir · nosotros · one time", ans:"fuimos", tr:"On Saturday we went to the movies."},
  {stem:"___ las nueve cuando llegaron.", hint:"ser · time of day", ans:"eran", tr:"It was nine when they arrived."},
  {stem:"Ayer ___ que tu prima se casa.", hint:"saber · yo · found out", ans:"supe", tr:"Yesterday I found out your cousin is getting married."},
  {stem:"Yo ___ en Nueva York cinco años.", hint:"vivir · yo · closed period", ans:"viví", acc:["vivi"], tr:"I lived in New York for five years."},
  {stem:"Cada verano ___ a la playa.", hint:"ir · nosotros · habit", ans:"íbamos", acc:["ibamos"], tr:"Every summer we went to the beach."},
  {stem:"La boda ___ preciosa.", hint:"estar · ella · verdict on a finished event", ans:"estuvo", tr:"The wedding was beautiful."},

{
 id:"pvi-2", n:6, unitName:U1,
 title:"Pretérito e imperfecto juntos",
 sub:"Interruptions, mientras, cuando, and telling a story",
 intro:"Real stories mix both tenses in every other sentence: \"I was cooking when she called.\" \"While we were eating, the power went out.\" This lesson is about the two connectors that glue them together, cuando and mientras, and the shape of a story told in Spanish. After this you can narrate your weekend the way a native speaker does.",
 outro:"You can now tell a story with background and events. Next: the time markers that make the choice automatic.",
 homework:"Tell your girlfriend one thing that happened this week using \"estaba ___ cuando ___\".",
 steps:[
 {title:"El patrón de la interrupción", body:`
  <p>The most common mixed sentence in Spanish:</p>
  <div class="callout teal"><b>[imperfect: what was going on] + cuando + [preterite: what happened]</b><br><i>Estaba cocinando cuando ella llamó.</i> I was cooking when she called.</div>
  <p>The imperfect verb is the background, already in progress. The preterite verb is the interruption, a point in time. Flip the order and it still works: <i>Cuando ella llamó, yo estaba cocinando.</i></p>
  <p>You'll often see the background in the <b>past progressive</b> (estaba + -ando/-iendo), which is just imperfect estar + gerund. <i>Estaba durmiendo</i> = I was sleeping. Plain imperfect works too: <i>Dormía cuando llegaste.</i> Both are fine; the progressive emphasizes the in-progress feeling.</p>
  <h3>mientras: two things at once</h3>
  <p><b>mientras</b> (while) usually takes two imperfects when both actions are ongoing: <i>Mientras yo cocinaba, ella ponía la mesa.</i> While I cooked, she set the table. If one action is a sudden event, that one goes preterite: <i>Mientras comíamos, se fue la luz.</i> While we were eating, the power went out.</p>
  <h3>The shape of a story</h3>
  <ul>
   <li><b>Open with the scene</b> (imperfect): Era sábado. Hacía calor. Estábamos en casa de los suegros.</li>
   <li><b>Then the events, in order</b> (preterite): Llegaron los primos. Comimos. Bailamos.</li>
   <li><b>Sprinkle feelings as background</b> (imperfect): Yo estaba nervioso. Todos estaban contentos.</li>
   <li><b>Close with a verdict</b> (preterite): Fue un día increíble.</li>
  </ul>
 `},
 {title:"Palabras que unen", body:`
  <table class="grammar-table">
   <tr><th>Conector</th><th>Uso típico</th></tr>
   <tr><td>cuando (when)</td><td>imperfect + cuando + preterite (interruption)</td></tr>
   <tr><td>mientras (while)</td><td>two imperfects, or imperfect + preterite event</td></tr>
   <tr><td>de repente (suddenly)</td><td>introduces a preterite event</td></tr>
   <tr><td>entonces (then)</td><td>next preterite event in a sequence</td></tr>
   <tr><td>después (afterward)</td><td>next preterite event</td></tr>
   <tr><td>al final (in the end)</td><td>closing preterite</td></tr>
   <tr><td>en ese momento (at that moment)</td><td>the preterite interruption</td></tr>
  </table>
  <div class="callout"><b>A trap:</b> "cuando" can also introduce a habit: <i>Cuando era niño, íbamos a la playa</i> (When I was a kid, we'd go to the beach). Both imperfect, because both are background. The tense follows the meaning, not the word.</div>
 `},
 {title:"En contexto", body:`
  <div class="example-row"><div class="example-es"><span class="verb">Estaba</span> trabajando cuando me <span class="verb">escribiste</span>.</div><div class="example-en">I was working when you texted me.</div><div class="example-note">Background + interruption. The texting-your-girlfriend sentence.</div></div>
  <div class="example-row"><div class="example-es">Mientras <span class="verb">comíamos</span>, se <span class="verb">fue</span> la luz.</div><div class="example-en">While we were eating, the power went out.</div><div class="example-note">Ongoing + sudden event. Every Venezuelan has this story.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Era</span> sábado y <span class="verb">hacía</span> calor. <span class="verb">Llegaron</span> los primos y <span class="verb">comimos</span> tequeños.</div><div class="example-en">It was Saturday and it was hot. The cousins arrived and we ate tequeños.</div><div class="example-note">Scene, then events.</div></div>
  <div class="example-row"><div class="example-es">Yo <span class="verb">tenía</span> miedo, pero <span class="verb">hablé</span> con su papá.</div><div class="example-en">I was scared, but I talked to her dad.</div><div class="example-note">Feeling (background) + action (event).</div></div>
  <div class="example-row"><div class="example-es">Mientras ella <span class="verb">cocinaba</span>, yo <span class="verb">ponía</span> la mesa.</div><div class="example-en">While she cooked, I set the table.</div><div class="example-note">Two simultaneous ongoing actions: both imperfect.</div></div>
  <div class="example-row"><div class="example-es">De repente <span class="verb">sonó</span> el teléfono. <span class="verb">Era</span> mi suegra.</div><div class="example-en">Suddenly the phone rang. It was my mother-in-law.</div><div class="example-note">Event, then identification (imperfect).</div></div>
 `},

{
 id:"marcadores", n:7, unitName:U1,
 title:"Marcadores de tiempo",
 sub:"The words that pick the tense for you",
 intro:"Most of the time you don't need to reason about preterite vs imperfect: the time expression in the sentence already decided. This lesson is a reference you'll actually memorize: preterite triggers, imperfect triggers, plus three super-common structures for talking about time (hace + time, acabar de, llevar + time) that don't fit neatly in either tense but come up constantly.",
 outro:"Unit 1 is complete. You own the past tense. Unit 2 sharpens the present and adds the near future.",
 homework:"Send your girlfriend one sentence with \"hace\", one with \"acabo de\", and one with \"llevo\".",
 steps:[
 {title:"Marcadores de pretérito", body:`
  <table class="grammar-table">
   <tr><th>Marcador</th><th>Ejemplo</th></tr>
   <tr><td>ayer / anoche / anteayer</td><td>Anoche cenamos en casa de los tíos.</td></tr>
   <tr><td>la semana / el mes / el año pasado</td><td>El año pasado fuimos a Aruba.</td></tr>
   <tr><td>el lunes, el sábado (one specific)</td><td>El sábado llegaron los primos.</td></tr>
   <tr><td>hace + tiempo (ago)</td><td>Hace dos años me mudé a Nueva York.</td></tr>
   <tr><td>una vez / dos veces</td><td>Fui a Maracaibo una vez.</td></tr>
   <tr><td>de repente / por fin / entonces</td><td>De repente sonó el teléfono.</td></tr>
   <tr><td>en 2019, el 4 de julio</td><td>En 2019 empecé a trabajar allí.</td></tr>
   <tr><td>durante + closed period</td><td>Viví allí durante cinco años.</td></tr>
  </table>
  <h3>Marcadores de imperfecto</h3>
  <table class="grammar-table">
   <tr><th>Marcador</th><th>Ejemplo</th></tr>
   <tr><td>siempre / nunca</td><td>Siempre cocinaba mi abuela.</td></tr>
   <tr><td>todos los días / los domingos (every)</td><td>Los domingos íbamos a misa.</td></tr>
   <tr><td>cada verano / cada año</td><td>Cada verano visitábamos a la familia.</td></tr>
   <tr><td>de niño / de joven / antes</td><td>De niño vivía cerca del lago.</td></tr>
   <tr><td>mientras</td><td>Mientras comíamos, hablábamos.</td></tr>
   <tr><td>a menudo / generalmente / a veces</td><td>A veces salíamos a bailar.</td></tr>
   <tr><td>en esa época / en aquel tiempo</td><td>En esa época no había internet.</td></tr>
  </table>
  <div class="callout"><b>"El sábado" vs "los sábados":</b> singular with el = one specific Saturday (preterite). Plural with los = every Saturday (imperfect). One letter changes the tense.</div>
 `},
 {title:"Tres estructuras de tiempo", body:`
  <h3>1. hace + tiempo + que + presente = "have been ___ for"</h3>
  <p><i>Hace dos años que vivo en Nueva York.</i> I've been living in New York for two years. Note: present tense, because it's still true. English uses "have been", Spanish uses plain present.</p>
  <p>Same "hace" with a preterite means "ago": <i>Me mudé hace dos años.</i> I moved two years ago.</p>
  <h3>2. llevar + tiempo + gerundio = "have been ___ing for"</h3>
  <p><i>Llevo tres meses estudiando español.</i> I've been studying Spanish for three months. Extremely common. Also without the gerund: <i>Llevo dos años aquí</i> (I've been here two years). This is the "¿Cuánto tiempo llevas aquí?" from your cards.</p>
  <h3>3. acabar de + infinitivo = "just did"</h3>
  <p><i>Acabo de llegar.</i> I just arrived. <i>Acabamos de comer.</i> We just ate. Present tense of acabar, then "de", then the infinitive. Simpler than English.</p>
  <div class="callout teal"><b>All three in one conversation:</b> "¿Cuánto tiempo llevas en Nueva York?" "Llevo cinco años. Me mudé hace cinco años, y acabo de renovar el contrato." Practice that exchange until it's smooth; it's a guaranteed small-talk question.</div>
 `},
 {title:"En contexto", body:`
  <div class="example-row"><div class="example-es">Hace tres años <span class="verb">conocí</span> a Maria.</div><div class="example-en">Three years ago I met Maria.</div><div class="example-note">hace + preterite = ago.</div></div>
  <div class="example-row"><div class="example-es">Hace tres años que <span class="verb">estamos</span> juntos.</div><div class="example-en">We've been together for three years.</div><div class="example-note">hace + que + present = still true.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Llevo</span> dos semanas practicando el pretérito.</div><div class="example-en">I've been practicing the preterite for two weeks.</div><div class="example-note">llevar + time + gerund.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Acabo</span> de hablar con tu mamá.</div><div class="example-en">I just talked to your mom.</div><div class="example-note">acabar de + infinitive.</div></div>
  <div class="example-row"><div class="example-es">Los domingos <span class="verb">almorzábamos</span> con los abuelos. El domingo pasado <span class="verb">almorzamos</span> solos.</div><div class="example-en">On Sundays we'd have lunch with the grandparents. Last Sunday we ate alone.</div><div class="example-note">los domingos vs el domingo pasado.</div></div>
  <div class="example-row"><div class="example-es">En esa época no <span class="verb">había</span> WhatsApp.</div><div class="example-en">Back then there was no WhatsApp.</div><div class="example-note">en esa época = imperfect scene.</div></div>
 `},
