{
 id:"futuro", n:8, unitName:U2, tense:"futr",
 title:"El futuro cercano: ir a + infinitivo",
 sub:"Plans, invitations, and \"what are you going to do?\"",
 intro:"Spanish has a real future tense (hablaré, comeré), but in conversation, especially Caribbean conversation, people mostly use \"going to\": voy a comer, vamos a salir. It's the same as English \"gonna\" and it's built from one irregular verb you already know (ir) plus any infinitive. This lesson makes it automatic, adds the present tense for scheduled plans, and covers the questions and answers you'll actually trade with the family.",
 outro:"You can talk about plans now. Next: the present progressive, for saying what's happening right now.",
 homework:"Text your girlfriend your plans for tomorrow: three sentences with \"voy a\".",
 steps:[
 {title:"La estructura", body:`
  <p><b>ir (present) + a + infinitivo</b>. That's it.</p>
  <table class="grammar-table">
   <tr><th>Persona</th><th>Forma</th></tr>
   <tr><td>yo</td><td>voy a + comer</td></tr>
   <tr><td>tú</td><td>vas a + comer</td></tr>
   <tr><td>usted / él / ella</td><td>va a + comer</td></tr>
   <tr><td>nosotros</td><td>vamos a + comer</td></tr>
   <tr><td>ustedes / ellos</td><td>van a + comer</td></tr>
  </table>
  <p>The infinitive never changes. All the work is in ir. "Voy a" = I'm going to, "vamos a" = we're going to / let's.</p>
  <div class="callout"><b>Two meanings of "vamos a":</b> "Vamos a comer" can be "we're going to eat" or "let's eat", depending on tone. When someone says it at the table, it's an invitation. Answer with "dale" or "vamos".</div>
  <h3>The present for scheduled things</h3>
  <p>Like English, Spanish uses the plain present for things on the calendar: <i>Mañana trabajo.</i> (I work tomorrow.) <i>La boda es en noviembre.</i> (The wedding is in November.) <i>Salimos a las ocho.</i> (We leave at eight.) Use ir a for intentions, present for the schedule.</p>
  <h3>The "real" future, for recognition</h3>
  <p>You'll hear it in promises and predictions: <i>Te llamaré.</i> (I'll call you.) <i>Va a estar bien / Estará bien.</i> (It'll be fine.) Endings attach to the full infinitive: hablar → hablaré, hablarás, hablará, hablaremos, hablarán. You don't need to produce it yet; recognize it.</p>
 `},
 {title:"Preguntas y respuestas de planes", body:`
  <table class="grammar-table">
   <tr><th>Pregunta</th><th>Respuesta modelo</th></tr>
   <tr><td>¿Qué vas a hacer mañana?</td><td>Voy a trabajar y después voy al gym.</td></tr>
   <tr><td>¿Qué van a hacer este fin de semana?</td><td>Vamos a ir a la playa.</td></tr>
   <tr><td>¿Vas a venir a la cena?</td><td>Sí, claro. ¿A qué hora?</td></tr>
   <tr><td>¿Van a quedarse a dormir?</td><td>No, nos vamos temprano.</td></tr>
   <tr><td>¿Cuándo van a casarse? (the question you'll get)</td><td>Todavía no sabemos. Estamos viendo.</td></tr>
  </table>
  <div class="callout teal"><b>Time words for plans:</b> mañana (tomorrow), pasado mañana (day after), esta noche (tonight), este fin de semana, la próxima semana (next week), el próximo mes, en noviembre, después (later), luego (later), más tarde (later on), ahorita (in a bit, Venezuelan; can also mean right now).</div>
  <div class="callout"><b>ahorita</b> is famously ambiguous. "Ahorita voy" can mean "I'm coming right now" or "I'll come in a while". Tone and context decide. Don't set your watch by it.</div>
 `},
 {title:"En contexto", body:`
  <div class="example-row"><div class="example-es">Mañana <span class="verb">voy a</span> cocinar para todos.</div><div class="example-en">Tomorrow I'm going to cook for everyone.</div><div class="example-note">Intention: ir a.</div></div>
  <div class="example-row"><div class="example-es">¿<span class="verb">Vas a</span> venir a la boda en Aruba?</div><div class="example-en">Are you going to come to the wedding in Aruba?</div><div class="example-note">tú question.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Vamos a</span> comer, que se enfría.</div><div class="example-en">Let's eat, it's getting cold.</div><div class="example-note">Invitation. "Que se enfría" = because it's getting cold.</div></div>
  <div class="example-row"><div class="example-es">Los primos <span class="verb">van a</span> llegar el viernes.</div><div class="example-en">The cousins are going to arrive Friday.</div><div class="example-note">ellos.</div></div>
  <div class="example-row"><div class="example-es">El vuelo <span class="verb">sale</span> a las seis.</div><div class="example-en">The flight leaves at six.</div><div class="example-note">Schedule: plain present.</div></div>
  <div class="example-row"><div class="example-es">Tranquila, <span class="verb">va a estar</span> bien.</div><div class="example-en">Relax, it's going to be fine.</div><div class="example-note">Reassurance. Tranquila to your girlfriend, tranquilo to a guy.</div></div>
 `},

{
 id:"progresivo", n:9, unitName:U2,
 title:"El presente progresivo",
 sub:"estar + -ando / -iendo: what's happening right now",
 intro:"\"¿Qué estás haciendo?\" is the text your girlfriend sends most. The answer is the present progressive: estoy cocinando, estoy trabajando, estoy viendo una película. It's built from estar plus a gerund, and the gerund has only a handful of irregular forms. This lesson also connects it to the past progressive from Lesson 6 so you can say \"I was ___ing\" and \"I'm ___ing\" with the same machinery.",
 outro:"You can say what's happening now and what was happening then. Next: reflexive verbs, the ones with \"me\", \"te\", \"se\".",
 homework:"Next time she texts \"¿qué estás haciendo?\", answer in Spanish with estoy + gerund, and add \"¿y tú?\"",
 steps:[
 {title:"La estructura", body:`
  <p><b>estar (present) + gerundio</b>. The gerund is the "-ing" form:</p>
  <table class="grammar-table">
   <tr><th>Infinitivo</th><th>Gerundio</th></tr>
   <tr><td>-AR: hablar, cocinar</td><td>habl<b>ando</b>, cocin<b>ando</b></td></tr>
   <tr><td>-ER: comer, hacer</td><td>com<b>iendo</b>, hac<b>iendo</b></td></tr>
   <tr><td>-IR: vivir, escribir</td><td>viv<b>iendo</b>, escrib<b>iendo</b></td></tr>
  </table>
  <p>With estar: estoy hablando, estás comiendo, está viviendo, estamos haciendo, están escribiendo.</p>
  <h3>The few irregular gerunds</h3>
  <table class="grammar-table">
   <tr><th>Infinitivo</th><th>Gerundio</th></tr>
   <tr><td>dormir (to sleep)</td><td>d<span class="am">u</span>rmiendo</td></tr>
   <tr><td>decir (to say)</td><td>d<span class="am">i</span>ciendo</td></tr>
   <tr><td>pedir (to ask for)</td><td>p<span class="am">i</span>diendo</td></tr>
   <tr><td>venir (to come)</td><td>v<span class="am">i</span>niendo</td></tr>
   <tr><td>leer (to read)</td><td>le<span class="am">y</span>endo</td></tr>
   <tr><td>oír (to hear)</td><td>o<span class="am">y</span>endo</td></tr>
   <tr><td>ir (to go)</td><td><span class="am">yendo</span></td></tr>
  </table>
  <p>Same families as the preterite quirks from Lesson 3: o → u, e → i, and i → y between vowels. The rule you learned once pays twice.</p>
  <div class="callout"><b>When NOT to use it:</b> Spanish uses the progressive less than English. "I'm living in New York" is usually just <i>Vivo en Nueva York</i>. "I'm going to the store" is <i>Voy a la tienda</i>, never "estoy yendo". Save the progressive for things literally in progress right now: <i>estoy cocinando</i> means there's a pan on the stove.</div>
  <h3>Past progressive: same idea, imperfect estar</h3>
  <p><i>Estaba cocinando cuando llamaste.</i> I was cooking when you called. Just swap estoy → estaba. You met this in Lesson 6.</p>
 `},
 {title:"Preguntas y respuestas de ahora", body:`
  <table class="grammar-table">
   <tr><th>Pregunta</th><th>Respuestas</th></tr>
   <tr><td>¿Qué estás haciendo?</td><td>Estoy trabajando. / Nada, viendo tele. / Estoy cocinando.</td></tr>
   <tr><td>¿Qué está haciendo Maria?</td><td>Está durmiendo. / Está hablando por teléfono.</td></tr>
   <tr><td>¿Dónde estás? (not progressive, but paired)</td><td>Estoy en casa, cocinando.</td></tr>
   <tr><td>¿Qué están haciendo los primos?</td><td>Están jugando fútbol afuera.</td></tr>
  </table>
  <p>A very natural shortcut in texting: drop estar and just send the gerund. <i>"¿Qué haces?" "Cocinando."</i> The family does this constantly.</p>
  <div class="callout teal"><b>Seguir + gerundio = still ___ing.</b> <i>Sigo trabajando</i> = I'm still working. <i>¿Sigues ahí?</i> = you still there? Very common in texts.</div>
 `},
 {title:"En contexto", body:`
  <div class="example-row"><div class="example-es">¿Qué <span class="verb">estás haciendo</span>?</div><div class="example-en">What are you doing?</div><div class="example-note">The text.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Estoy cocinando</span> arepas, ¿quieres?</div><div class="example-en">I'm making arepas, want some?</div><div class="example-note">yo.</div></div>
  <div class="example-row"><div class="example-es">Tu mamá <span class="verb">está durmiendo</span>, hablamos bajito.</div><div class="example-en">Your mom's sleeping, let's talk quietly.</div><div class="example-note">Irregular gerund: durmiendo.</div></div>
  <div class="example-row"><div class="example-es">Los chamos <span class="verb">están viendo</span> el partido.</div><div class="example-en">The guys are watching the game.</div><div class="example-note">ellos.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Sigo estudiando</span> español todos los días.</div><div class="example-en">I'm still studying Spanish every day.</div><div class="example-note">seguir + gerund.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Estaba leyendo</span> cuando me escribiste.</div><div class="example-en">I was reading when you texted.</div><div class="example-note">Past progressive, i → y.</div></div>
 `},

{
 id:"reflexivos", n:10, unitName:U2,
 title:"Los verbos reflexivos",
 sub:"me levanto, se fue, nos vemos: the daily-routine verbs",
 intro:"A big slice of everyday Spanish uses verbs with me, te, se, nos: I get up (me levanto), she left (se fue), see you (nos vemos), don't worry (no te preocupes). English hides this; Spanish makes it explicit. Once you see the pronoun as a normal part of the verb, a whole category of sentences opens up, including most of your daily-routine and texting phrases.",
 outro:"Reflexives handled, in the present and the past. Next: gustar, the verb that works backwards.",
 homework:"Describe your morning to your girlfriend in four reflexive sentences: me despierto, me levanto, me baño, me voy.",
 steps:[
 {title:"Qué son y cómo se conjugan", body:`
  <p>A reflexive verb has a pronoun that matches the subject: <i>levantarse</i> (to get up) → yo <b>me</b> levanto, tú <b>te</b> levantas. The verb itself conjugates normally; the pronoun goes in front.</p>
  <table class="grammar-table">
   <tr><th>Persona</th><th>Pronombre + verbo</th></tr>
   <tr><td>yo</td><td><b>me</b> levanto</td></tr>
   <tr><td>tú</td><td><b>te</b> levantas</td></tr>
   <tr><td>usted / él / ella</td><td><b>se</b> levanta</td></tr>
   <tr><td>nosotros</td><td><b>nos</b> levantamos</td></tr>
   <tr><td>ustedes / ellos</td><td><b>se</b> levantan</td></tr>
  </table>
  <p>In the past, same pronouns, past verb: <i>me levanté, te levantaste, se levantó, nos levantamos, se levantaron.</i></p>
  <h3>The high-frequency set</h3>
  <table class="grammar-table">
   <tr><th>Verbo</th><th>Significado</th></tr>
   <tr><td>despertarse (e→ie)</td><td>to wake up: me despierto</td></tr>
   <tr><td>levantarse</td><td>to get up</td></tr>
   <tr><td>bañarse</td><td>to shower / bathe (Venezuelan: bañarse, not ducharse)</td></tr>
   <tr><td>vestirse (e→i)</td><td>to get dressed: me visto</td></tr>
   <tr><td>irse</td><td>to leave: me voy, se fue</td></tr>
   <tr><td>quedarse</td><td>to stay: me quedo en casa</td></tr>
   <tr><td>acostarse (o→ue)</td><td>to go to bed: me acuesto</td></tr>
   <tr><td>sentarse (e→ie)</td><td>to sit down: siéntese (usted)</td></tr>
   <tr><td>preocuparse</td><td>to worry: no te preocupes</td></tr>
   <tr><td>casarse</td><td>to get married: se casan en noviembre</td></tr>
   <tr><td>verse</td><td>to see each other: nos vemos</td></tr>
   <tr><td>llamarse</td><td>to be called: me llamo Noah</td></tr>
  </table>
  <div class="callout"><b>irse vs ir:</b> ir is "to go (somewhere)", irse is "to leave". <i>Voy al mercado</i> (I'm going to the market) vs <i>Me voy</i> (I'm leaving). "Se fue la luz" = the power left = the power went out. "Ya me voy" = I'm heading out.</div>
 `},
 {title:"Dónde va el pronombre", body:`
  <p>Three positions, and you'll see all three daily:</p>
  <ul>
   <li><b>Before a conjugated verb:</b> <i>Me levanto a las seis.</i></li>
   <li><b>Attached to an infinitive or gerund:</b> <i>Voy a levantar<b>me</b>. Estoy bañándo<b>me</b>.</i> (Or before estar: <i>me estoy bañando</i>. Both fine.)</li>
   <li><b>Attached to a positive command:</b> <i>Siénta<b>te</b>. Siénte<b>se</b>. Quéda<b>te</b>.</i> Negative commands put it in front: <i>No <b>te</b> preocupes.</i></li>
  </ul>
  <div class="callout teal"><b>Texting gold:</b> <i>nos vemos</i> (see you), <i>me voy</i> (heading out), <i>ya me acosté</i> (already in bed), <i>me quedo en casa</i> (staying in), <i>no te preocupes</i> (don't worry, the "ntp" from your cards), <i>¿te vas?</i> (you leaving?).</div>
  <div class="callout"><b>se as "each other":</b> <i>Se conocieron en Maracaibo.</i> They met each other in Maracaibo. <i>Nos conocimos en una fiesta.</i> We met at a party. <i>Se quieren mucho.</i> They love each other a lot.</div>
 `},
 {title:"En contexto", body:`
  <div class="example-row"><div class="example-es"><span class="verb">Me levanto</span> a las seis y <span class="verb">me baño</span>.</div><div class="example-en">I get up at six and shower.</div><div class="example-note">Two reflexives, present.</div></div>
  <div class="example-row"><div class="example-es">Anoche <span class="verb">me acosté</span> tarde.</div><div class="example-en">Last night I went to bed late.</div><div class="example-note">Preterite reflexive.</div></div>
  <div class="example-row"><div class="example-es">Ya <span class="verb">se fueron</span> los primos.</div><div class="example-en">The cousins already left.</div><div class="example-note">irse · ellos, preterite.</div></div>
  <div class="example-row"><div class="example-es">Bueno, <span class="verb">nos vemos</span> el sábado.</div><div class="example-en">Okay, see you Saturday.</div><div class="example-note">verse · nosotros.</div></div>
  <div class="example-row"><div class="example-es">No <span class="verb">te preocupes</span>, yo lo llevo.</div><div class="example-en">Don't worry, I'll take it.</div><div class="example-note">Negative command, pronoun in front.</div></div>
  <div class="example-row"><div class="example-es">Maria y yo <span class="verb">nos conocimos</span> hace tres años.</div><div class="example-en">Maria and I met three years ago.</div><div class="example-note">Reciprocal: each other.</div></div>
 `},
 {title:"Práctica guiada", practice:[
  {stem:"Yo ___ levanto a las siete.", hint:"pronoun · yo", ans:"me", tr:"I get up at seven."},
  {stem:"Ella ___ fue temprano.", hint:"pronoun · ella (irse)", ans:"se", tr:"She left early."},
  {stem:"___ vemos mañana.", hint:"pronoun · nosotros (verse)", ans:"nos", tr:"See you tomorrow."},
  {stem:"Anoche yo me ___ tarde.", hint:"acostarse · yo · preterite verb only", ans:"acosté", acc:["acoste"], tr:"Last night I went to bed late."},

 ]},

  {stem:"Los primos ya se ___.", hint:"irse · ellos · preterite", ans:"fueron", tr:"The cousins already left."},
  {stem:"Maria ___ llama Maria.", hint:"pronoun · ella", ans:"se", tr:"Her name is Maria."},
  {stem:"Nosotros nos ___ en una fiesta.", hint:"conocerse · preterite", ans:"conocimos", tr:"We met at a party."},
  {stem:"¿A qué hora te ___ tú?", hint:"acostarse · tú · present (o→ue)", ans:"acuestas", tr:"What time do you go to bed?"},
  {stem:"Yo ___ quedo en casa hoy.", hint:"pronoun · yo", ans:"me", tr:"I'm staying home today."},
  {stem:"Ella se ___ y salió.", hint:"vestirse · ella · preterite (e→i)", ans:"vistió", acc:["vistio"], tr:"She got dressed and went out."},
  {stem:"Ya ___ voy, nos vemos.", hint:"pronoun · yo", ans:"me", tr:"I'm heading out, see you."},
  {stem:"Ellos se ___ en noviembre.", hint:"casarse · ellos · present", ans:"casan", tr:"They're getting married in November."},
  {stem:"___ baño antes de salir.", hint:"pronoun · yo", ans:"me", tr:"I shower before going out."},
  {stem:"Se ___ la luz anoche.", hint:"irse · preterite (la luz)", ans:"fue", tr:"The power went out last night."},

  {k:"mc", stem:"\"Me voy\" vs \"voy\":", opts:["Same thing","me voy = I'm leaving; voy = I'm going (somewhere)","voy is more polite"], ans:1, note:"irse = to leave; ir = to go."},
  {k:"mc", stem:"¿Qué significa?", es:"Se fue la luz.", opts:["The light left (the power went out).","The light was gone.","Turn off the light."], ans:0, note:"irse + la luz = power outage."},
  {k:"mc", stem:"Where does the pronoun go in a positive command?", opts:["Before: te siéntate","Attached: siéntate","Either"], ans:1, note:"Positive commands attach it; negatives put it in front (no te sientes)."},
  {k:"mc", stem:"\"Nos conocimos en Maracaibo\" means:", opts:["We knew Maracaibo.","We met each other in Maracaibo.","We know each other from Maracaibo."], ans:1, note:"Reciprocal nos + preterite conocer = met."},
  {k:"mc", stem:"In Venezuela, \"to shower\" is usually:", opts:["ducharse","bañarse","lavarse"], ans:1, note:"bañarse covers showering in most of Latin America."}
 ]}

/* ---------------------------------------------------------------- 11 */
{
 id:"gustar", n:11, unitName:U2,
 title:"Gustar y compañía",
 sub:"me gusta, me encanta, me molesta, me falta: verbs that work backwards",
 intro:"\"I like arepas\" in Spanish is literally \"arepas please me\": me gustan las arepas. The thing you like is the subject; you are the person it pleases. This trips up English speakers for years, but the pattern is small and a dozen very useful verbs share it: encantar, molestar, importar, faltar, quedar, doler, parecer. Learn the shape once and you get all of them.",
 outro:"You can now say what you like, love, mind and need. Next: object pronouns (lo, la, le) so you can stop repeating nouns.",
 homework:"Tell her mom three things you love about Venezuelan food using \"me encanta\" / \"me encantan\".",
 steps:[
 {title:"La estructura", body:`
  <p>Three pieces, in this order:</p>
  <div class="callout teal"><b>[indirect pronoun] + [gustar in 3rd person] + [the thing]</b><br><i>Me gusta el café. Me gustan las arepas.</i></div>
  <table class="grammar-table">
   <tr><th>Quién</th><th>Pronombre</th></tr>
   <tr><td>to me</td><td>me</td></tr>
   <tr><td>to you (tú)</td><td>te</td></tr>
   <tr><td>to him / her / you (usted)</td><td>le</td></tr>
   <tr><td>to us</td><td>nos</td></tr>
   <tr><td>to them / you all</td><td>les</td></tr>
  </table>
  <p>The verb only has two everyday forms: <b>gusta</b> (one thing, or an activity) and <b>gustan</b> (plural things).</p>
  <ul>
   <li>Me gust<b>a</b> el pabellón. (one thing)</li>
   <li>Me gust<b>a</b> bailar. (an activity, always singular)</li>
   <li>Me gust<b>an</b> los tequeños. (plural)</li>
  </ul>
  <div class="callout"><b>Adding the person for clarity or emphasis:</b> <i>A mí me gusta. A ti te gusta. A Maria le gusta. A usted le gusta. A nosotros nos gusta.</i> The "a + person" is optional but very common, especially with le/les, which are ambiguous alone. "A mi suegra le encanta bailar."</div>
  <p>Past tense: <i>me gustó</i> (one thing, preterite), <i>me gustaron</i>, <i>me gustaba</i> (imperfect, used to like). "Me encantó la comida" = I loved the food.</p>
 `},
 {title:"La familia de gustar", body:`
  <table class="grammar-table">
   <tr><th>Verbo</th><th>Ejemplo</th></tr>
   <tr><td>encantar (to love)</td><td>Me encanta Maracaibo. Me encantan las hallacas.</td></tr>
   <tr><td>molestar (to bother)</td><td>Me molesta el calor. ¿Te molesta si abro la ventana?</td></tr>
   <tr><td>importar (to matter, to mind)</td><td>No me importa. ¿Le importa si me siento aquí?</td></tr>
   <tr><td>faltar (to be missing / need)</td><td>Me falta sal. Nos faltan dos sillas.</td></tr>
   <tr><td>quedar (to fit / to have left)</td><td>Te queda bien esa camisa. Me quedan diez dólares.</td></tr>
   <tr><td>doler (to hurt, o→ue)</td><td>Me duele la cabeza. Me duelen los pies.</td></tr>
   <tr><td>parecer (to seem)</td><td>Me parece bien. ¿Qué te parece?</td></tr>
   <tr><td>interesar (to interest)</td><td>Me interesa la historia de Venezuela.</td></tr>
   <tr><td>tocar (to be one's turn)</td><td>Me toca lavar los platos. Te toca a ti.</td></tr>
  </table>
  <div class="callout"><b>Small but important:</b> "Me gusta Maria" means you're attracted to Maria. For liking a person as a person, Venezuelans say <i>me cae bien</i> (I like him/her, they're cool). <i>Tu primo me cae muy bien.</i> Use caer bien for people, gustar for things.</div>
  <div class="callout teal"><b>¿Qué te parece?</b> (what do you think?) and <b>me parece bien</b> (sounds good to me) are two of the most useful phrases in planning conversations. "¿Qué te parece si vamos el sábado?" "Me parece perfecto."</div>
 `},
 {title:"En contexto", body:`
  <div class="example-row"><div class="example-es">Me <span class="verb">encantan</span> los tequeños de tu mamá.</div><div class="example-en">I love your mom's tequeños.</div><div class="example-note">Plural thing: encantan.</div></div>
  <div class="example-row"><div class="example-es">A mi suegro le <span class="verb">gusta</span> hablar de béisbol.</div><div class="example-en">My father-in-law likes to talk about baseball.</div><div class="example-note">Activity: singular gusta.</div></div>
  <div class="example-row"><div class="example-es">¿Te <span class="verb">molesta</span> si pongo música?</div><div class="example-en">Do you mind if I put on music?</div><div class="example-note">Polite check-in.</div></div>
  <div class="example-row"><div class="example-es">Nos <span class="verb">faltan</span> dos sillas para la cena.</div><div class="example-en">We're two chairs short for dinner.</div><div class="example-note">Plural: faltan.</div></div>
  <div class="example-row"><div class="example-es">Me <span class="verb">encantó</span> la boda. <span class="verb">Estuvo</span> increíble.</div><div class="example-en">I loved the wedding. It was incredible.</div><div class="example-note">Preterite gustar-type + verdict.</div></div>
  <div class="example-row"><div class="example-es">Tu prima me <span class="verb">cae</span> muy bien.</div><div class="example-en">I really like your cousin (as a person).</div><div class="example-note">caer bien, not gustar.</div></div>
 `},

{
 id:"objetos", n:12, unitName:U2,
 title:"Lo, la, le: pronombres de objeto",
 sub:"Stop repeating nouns: dámelo, te lo digo, la vi",
 intro:"\"Did you see the movie? Yes, I saw it.\" That \"it\" is an object pronoun, and Spanish uses them constantly: lo vi, la compré, te lo mando, dámelo. They're short, they go in predictable places, and without them your sentences sound like a textbook. This lesson covers direct (lo, la, los, las), indirect (le, les, plus me, te, nos), and the two rules for stacking them.",
 outro:"Unit 2 done. Your present tense is now genuinely B1. Unit 3 is about the family: tú vs usted, commands, and questions.",
 homework:"Reply to three of your girlfriend's texts today using at least one object pronoun each (lo, la, te lo, me lo).",
 steps:[
 {title:"Directos: lo, la, los, las", body:`
  <p>Direct object = the thing receiving the action. Replace it with a pronoun matching gender and number:</p>
  <table class="grammar-table">
   <tr><th>Reemplaza</th><th>Pronombre</th></tr>
   <tr><td>el pabellón (masc. sing.)</td><td><b>lo</b>: Lo comí.</td></tr>
   <tr><td>la arepa (fem. sing.)</td><td><b>la</b>: La comí.</td></tr>
   <tr><td>los tequeños</td><td><b>los</b>: Los comí.</td></tr>
   <tr><td>las hallacas</td><td><b>las</b>: Las comí.</td></tr>
   <tr><td>me / te / nos (people)</td><td>Te vi ayer. Me llamó. Nos invitaron.</td></tr>
  </table>
  <p>Position: <b>before the conjugated verb</b> (<i>lo vi</i>), or <b>attached to an infinitive / gerund / positive command</b> (<i>voy a verlo, estoy viéndolo, ¡cómelo!</i>).</p>
  <h3>Indirectos: le, les (and me, te, nos)</h3>
  <p>Indirect object = the person receiving something. <i>Le mandé un mensaje a Maria.</i> I sent Maria a message. <i>Les dije la verdad.</i> I told them the truth. Same me/te/nos for first and second person: <i>Te mando la foto. Nos dieron regalos.</i></p>
  <div class="callout"><b>Spanish doubles the indirect object:</b> even when you name the person, you keep le. <i>Le dije a tu papá</i>, not "dije a tu papá". This feels redundant to English ears and is completely standard.</div>
 `},
 {title:"Dos juntos: las reglas de combinación", body:`
  <p>When you use both (I sent it to her), two rules:</p>
  <ul>
   <li><b>Indirect first, then direct:</b> <i>Te lo mando.</i> (I'll send it to you.) <i>Me la dio.</i> (She gave it to me.)</li>
   <li><b>le/les + lo/la becomes se:</b> "le lo" is illegal. <i>Se lo mandé</i> (I sent it to him/her/them). This "se" is not reflexive; it's just le in disguise.</li>
  </ul>
  <table class="grammar-table">
   <tr><th>Frase</th><th>Con pronombres</th></tr>
   <tr><td>Te mando la foto.</td><td>Te <b>la</b> mando.</td></tr>
   <tr><td>Le doy el regalo a tu mamá.</td><td><b>Se lo</b> doy.</td></tr>
   <tr><td>Me dijo la verdad.</td><td>Me <b>la</b> dijo.</td></tr>
   <tr><td>Dame el teléfono.</td><td>Dá<b>melo</b>.</td></tr>
   <tr><td>Voy a decirle a Maria.</td><td>Voy a decír<b>selo</b>.</td></tr>
  </table>
  <div class="callout teal"><b>Texting reflexes:</b> <i>te lo mando</i> (sending it to you), <i>ya te lo dije</i> (I already told you), <i>dímelo</i> (tell me), <i>mándamela</i> (send it to me, fem.), <i>lo sé</i> (I know), <i>no lo sé</i> (I don't know), <i>¿lo viste?</i> (did you see it?).</div>
  <div class="callout"><b>Accents when attaching:</b> when two pronouns attach to a command or infinitive, the stress stays where it was, so you add an accent to hold it: dá<b>me</b>lo, dí<b>me</b>lo, mán<b>da</b>mela. You'll get this right by ear before you get it right on paper. Don't stress about the written accent early on.</div>
 `},
 {title:"En contexto", body:`
  <div class="example-row"><div class="example-es">¿Viste la película? Sí, <span class="verb">la</span> vi anoche.</div><div class="example-en">Did you see the movie? Yes, I saw it last night.</div><div class="example-note">la = la película.</div></div>
  <div class="example-row"><div class="example-es">Te <span class="verb">lo</span> mando ahorita.</div><div class="example-en">I'll send it to you in a sec.</div><div class="example-note">te (to you) + lo (it).</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Le</span> dije a tu mamá que llegamos a las ocho.</div><div class="example-en">I told your mom we're arriving at eight.</div><div class="example-note">le doubled with "a tu mamá".</div></div>
  <div class="example-row"><div class="example-es">¿El regalo? Ya <span class="verb">se lo</span> di.</div><div class="example-en">The gift? I already gave it to her.</div><div class="example-note">le + lo = se lo.</div></div>
  <div class="example-row"><div class="example-es">Dá<span class="verb">me</span><span class="verb">lo</span>, yo lo llevo.</div><div class="example-en">Give it to me, I'll carry it.</div><div class="example-note">Attached to a command.</div></div>
  <div class="example-row"><div class="example-es">No <span class="verb">lo</span> sé, pregúntale a Maria.</div><div class="example-en">I don't know, ask Maria.</div><div class="example-note">lo sé / no lo sé; pregúntale = ask her.</div></div>
 `},
 {title:"Práctica guiada", practice:[
  {stem:"¿Los tequeños? ___ comí todos.", hint:"direct · los tequeños", ans:"los", tr:"The tequeños? I ate them all."},
  {stem:"Te ___ mando por WhatsApp.", hint:"direct · la foto", ans:"la", tr:"I'll send it (the photo) to you on WhatsApp."},
  {stem:"___ dije a tu papá que vamos.", hint:"indirect · a tu papá", ans:"le", tr:"I told your dad we're going."},
  {stem:"¿El libro? Ya ___ lo di a Maria.", hint:"le + lo becomes ___", ans:"se", tr:"The book? I already gave it to Maria."},
  {stem:"No ___ sé.", hint:"direct · it", ans:"lo", tr:"I don't know."}
 ]},
 {title:"Examen", test:[
  {stem:"¿La arepa? ___ comí.", hint:"direct · la arepa", ans:"la", tr:"The arepa? I ate it."},
  {stem:"___ vi ayer en el mall.", hint:"direct · you (tú)", ans:"te", tr:"I saw you yesterday at the mall."},
  {stem:"___ mandé un mensaje a los primos.", hint:"indirect · a los primos", ans:"les", tr:"I sent the cousins a message."},
  {stem:"¿Las llaves? No ___ encuentro.", hint:"direct · las llaves", ans:"las", tr:"The keys? I can't find them."},
  {stem:"Te ___ digo mañana.", hint:"direct · it (lo)", ans:"lo", tr:"I'll tell you tomorrow."},
  {stem:"¿El regalo? ___ lo di a tu mamá.", hint:"le → ___ before lo", ans:"se", tr:"The gift? I gave it to your mom."},
  {stem:"Dá___ el teléfono.", hint:"attached · to me", ans:"me", tr:"Give me the phone."},
  {stem:"¿Me ___ mandas?", hint:"direct · la foto", ans:"la", tr:"Will you send it (the photo) to me?"},
  {stem:"___ invitaron a la boda.", hint:"direct · us", ans:"nos", tr:"They invited us to the wedding."},
  {stem:"Ya ___ ___ dije.", hint:"to you + it (two words)", ans:"te lo", tr:"I already told you."},
  {stem:"Voy a decir___ a Maria.", hint:"attached indirect · to her", ans:"le", tr:"I'm going to tell Maria."},
  {stem:"¿El pabellón? ___ hizo mi suegra.", hint:"direct · el pabellón", ans:"lo", tr:"The pabellón? My mother-in-law made it."},
  {k:"mc", stem:"\"I sent it (the photo) to her\" is:", opts:["Le la mandé.","Se la mandé.","La le mandé."], ans:1, note:"le + la → se la; indirect before direct."},
  {k:"mc", stem:"Why \"le dije a tu papá\" and not \"dije a tu papá\"?", opts:["Spanish doubles the indirect object even when the person is named","le is optional","It's a Venezuelan quirk"], ans:0, note:"Standard Spanish keeps le/les alongside the named person."},
  {k:"mc", stem:"¿Qué significa?", es:"Dímelo.", opts:["Tell it to me.","Give it to me.","Say it."], ans:0, note:"di (say) + me (to me) + lo (it)."},
  {k:"mc", stem:"Where can \"lo\" go with \"voy a ver\"?", opts:["Lo voy a ver / voy a verlo (both)","Only voy a verlo","Only lo voy a ver"], ans:0, note:"Before the conjugated verb or attached to the infinitive."},
  {k:"mc", stem:"\"No lo sé\" means:", opts:["I don't know it / I don't know.","I don't see it.","I'm not it."], ans:0, note:"lo sé = I know (it)."}
 ]}
 ]

{
 id:"tu-usted", n:13, unitName:U3,
 title:"Tú y usted",
 sub:"Who gets which, and how to switch mid-conversation",
 intro:"Getting tú and usted right is the single fastest way to sound respectful to her parents and natural with everyone else. This family uses tú with peers and usted with elders, no voseo. The grammar is simple: usted borrows the él/ella forms. The hard part is switching on the fly when grandma walks into a room full of cousins. This lesson gives you the rules, the forms side by side, and the escape hatches for when you're not sure.",
 outro:"You can now address anyone in the family correctly. Next: telling people what to do, nicely (tú commands).",
 homework:"Next family call, greet each person with the right form out loud: \"¿Cómo está usted?\" to parents, \"¿Cómo estás?\" to Maria's siblings and cousins.",
 steps:[
 {title:"Quién recibe qué", body:`
  <table class="grammar-table">
   <tr><th>Persona</th><th>Forma</th></tr>
   <tr><td>Maria</td><td>tú</td></tr>
   <tr><td>her siblings, cousins, friends your age</td><td>tú</td></tr>
   <tr><td>her parents</td><td>usted, until they tell you otherwise</td></tr>
   <tr><td>grandparents, great-aunts and uncles</td><td>usted, always</td></tr>
   <tr><td>aunts and uncles</td><td>usted to start; many will say "tutéame"</td></tr>
   <tr><td>kids</td><td>tú</td></tr>
   <tr><td>any group (mixed or not)</td><td>ustedes</td></tr>
  </table>
  <div class="callout"><b>The switch:</b> when an elder says <i>"tutéame"</i> or <i>"háblame de tú"</i> or just <i>"dime Carlos"</i>, that's permission. Say "gracias" and switch. Until then, usted. Erring toward usted is never rude; erring toward tú with a grandparent can be.</div>
  <div class="callout teal"><b>Ustedes covers everyone.</b> Latin America has no vosotros in daily speech, so "you all" is always ustedes, whether it's grandma and grandpa or the cousins. The vosotros toggle in this app exists only for Madrid.</div>
  <p>Her family are bilingual South Floridians, so they will sometimes address you in English. Reply in Spanish anyway when you can; the effort is the point.</p>
 `},
 {title:"Las formas, lado a lado", body:`
  <p>usted uses the él/ella form of every verb. That's the entire rule.</p>
  <table class="grammar-table">
   <tr><th>tú</th><th>usted</th></tr>
   <tr><td>¿Cómo estás?</td><td>¿Cómo está?</td></tr>
   <tr><td>¿Quieres más?</td><td>¿Quiere más?</td></tr>
   <tr><td>¿De dónde eres?</td><td>¿De dónde es?</td></tr>
   <tr><td>¿Tienes hambre?</td><td>¿Tiene hambre?</td></tr>
   <tr><td>¿Qué hiciste?</td><td>¿Qué hizo?</td></tr>
   <tr><td>¿Puedes repetir?</td><td>¿Puede repetir?</td></tr>
   <tr><td>tu casa (your house)</td><td>su casa</td></tr>
   <tr><td>te ayudo (I'll help you)</td><td>le ayudo</td></tr>
   <tr><td>siéntate (sit)</td><td>siéntese</td></tr>
  </table>
  <p>Plural: ustedes takes the ellos form. <i>¿Cómo están? ¿Quieren más? Su casa. Les ayudo. Siéntense.</i></p>
  <div class="callout"><b>Possessives:</b> tu (your, tú) vs su (your, usted / his / her / their). "Su casa es muy bonita" works for her mom's house. Since su is ambiguous, Spanish speakers add "de usted" when needed: <i>la casa de usted</i>.</div>
  <h3>Softeners that work with both</h3>
  <p><i>por favor</i>, <i>disculpe</i> (usted) / <i>disculpa</i> (tú), <i>con permiso</i>, <i>¿me permite?</i> (usted, may I?), <i>si no es molestia</i> (if it's no trouble).</p>
 `},
 {title:"En contexto", body:`
  <div class="example-row"><div class="example-es">Buenas tardes, señora. ¿Cómo <span class="verb">está</span> <span class="verb">usted</span>?</div><div class="example-en">Good afternoon, ma'am. How are you?</div><div class="example-note">Her mom at the door. Señora is polite, not old.</div></div>
  <div class="example-row"><div class="example-es">¡Épale! ¿Cómo <span class="verb">estás</span>? ¿Qué más?</div><div class="example-en">Hey! How are you? What's up?</div><div class="example-note">A cousin, same greeting in tú.</div></div>
  <div class="example-row"><div class="example-es">Don Carlos, ¿<span class="verb">quiere</span> más café?</div><div class="example-en">Don Carlos, would you like more coffee?</div><div class="example-note">Don + first name is warm and respectful for an older man. Doña for women.</div></div>
  <div class="example-row"><div class="example-es">Maria, ¿<span class="verb">quieres</span> más café?</div><div class="example-en">Maria, want more coffee?</div><div class="example-note">Same sentence, tú.</div></div>
  <div class="example-row"><div class="example-es">Disculpe, no <span class="verb">le</span> entendí. ¿<span class="verb">Puede</span> repetir?</div><div class="example-en">Sorry, I didn't catch that. Could you repeat?</div><div class="example-note">usted: disculpe, le, puede.</div></div>
  <div class="example-row"><div class="example-es">¿<span class="verb">Ustedes</span> <span class="verb">vivieron</span> mucho tiempo en Maracaibo?</div><div class="example-en">Did you all live in Maracaibo a long time?</div><div class="example-note">To her parents as a pair: ustedes.</div></div>
 `},
 {title:"Práctica guiada", practice:[
  {stem:"(A su mamá) ¿Cómo ___ usted?", hint:"estar · usted", ans:"está", acc:["esta"], tr:"How are you? (to her mom)"},
  {stem:"(A un primo) ¿Cómo ___?", hint:"estar · tú", ans:"estás", acc:["estas"], tr:"How are you? (to a cousin)"},
  {stem:"(Al abuelo) ¿___ más arroz?", hint:"querer · usted", ans:"quiere", tr:"Would you like more rice? (to grandpa)"},
  {stem:"(A los primos) ¿___ hambre?", hint:"tener · ustedes", ans:"tienen", tr:"Are you all hungry?"},
  {stem:"(A su papá) Disculpe, ¿___ repetir?", hint:"poder · usted", ans:"puede", tr:"Sorry, could you repeat?"}
 ]},
 {title:"Examen", test:[
  {stem:"(A la abuela) ¿Qué ___ hoy?", hint:"hacer · usted · preterite", ans:"hizo", tr:"What did you do today? (to grandma)"},
  {stem:"(A Maria) ¿Qué ___ hoy?", hint:"hacer · tú · preterite", ans:"hiciste", tr:"What did you do today? (to Maria)"},
  {stem:"(A su mamá) ___ casa es muy bonita.", hint:"possessive · usted", ans:"su", tr:"Your house is very pretty."},
  {stem:"(A un primo) ___ carro es nuevo, ¿no?", hint:"possessive · tú", ans:"tu", tr:"Your car is new, right?"},
  {stem:"(Al tío) ¿De dónde ___ usted?", hint:"ser · usted", ans:"es", tr:"Where are you from?"},
  {stem:"(A una prima) ¿De dónde ___?", hint:"ser · tú", ans:"eres", tr:"Where are you from?"},
  {stem:"(A los abuelos) ¿Cómo ___ ustedes?", hint:"estar · ustedes", ans:"están", acc:["estan"], tr:"How are you both?"},
  {stem:"(A su papá) ___ ayudo con las bolsas.", hint:"pronoun · usted", ans:"le", tr:"I'll help you with the bags."},
  {stem:"(A Maria) ___ ayudo con las bolsas.", hint:"pronoun · tú", ans:"te", tr:"I'll help you with the bags."},
  {stem:"(A la señora) ¿___ hambre?", hint:"tener · usted", ans:"tiene", tr:"Are you hungry?"},
  {stem:"(Al abuelo) ___, no entendí.", hint:"disculpar · usted command", ans:"disculpe", tr:"Sorry, I didn't understand."},
  {stem:"(A un amigo) ___, no entendí.", hint:"disculpar · tú command", ans:"disculpa", tr:"Sorry, I didn't understand."},
  {k:"mc", stem:"Her dad says \"tutéame\". You should:", opts:["Keep using usted to be safe","Switch to tú and say thanks","Ask why"], ans:1, note:"That's explicit permission; not switching can feel cold."},
  {k:"mc", stem:"\"You all\" to her parents as a pair is:", opts:["vosotros","ustedes","tú"], ans:1, note:"Latin America uses ustedes for every plural you."},
  {k:"mc", stem:"usted takes which verb form?", opts:["tú form","él/ella form","its own form"], ans:1, note:"No new conjugation to learn."},
  {k:"mc", stem:"\"Don Carlos\" is:", opts:["A formal title meaning Mr.","A warm respectful way to address an older man by first name","Only for grandfathers"], ans:1, note:"Don/Doña + first name: respectful and affectionate."},
  {k:"mc", stem:"Safest default with an aunt you just met:", opts:["tú","usted","English"], ans:1, note:"Start with usted; she'll likely release you to tú."}
 ]}
 ]

/* ---------------------------------------------------------------- 14 */
{
 id:"mandatos-tu", n:14, unitName:U3,
 title:"Mandatos con tú",
 sub:"dame, ven, dime, avísame, no te preocupes",
 intro:"Half of texting is tiny commands: send me, tell me, come, wait, don't worry. With tú, the positive command is easy (it's just the él form), the negative command borrows a different form, and eight verbs have one-syllable irregulars you'll use constantly. This lesson makes them automatic, with pronouns attached the way real messages have them.",
 outro:"You can ask peers to do things naturally. Next: the same thing, politely, with usted.",
 homework:"Send Maria five one-word commands today: dime, avísame, mándame (something), ven, espera.",
 steps:[
 {title:"Positivo: la forma de él", body:`
  <p>For a positive tú command, use the <b>él/ella present form</b>. That's it.</p>
  <table class="grammar-table">
   <tr><th>Infinitivo</th><th>Mandato tú</th></tr>
   <tr><td>hablar</td><td>habla (más despacio)</td></tr>
   <tr><td>comer</td><td>come (algo)</td></tr>
   <tr><td>escribir</td><td>escribe (cuando llegues)</td></tr>
   <tr><td>esperar</td><td>espera (un momento)</td></tr>
   <tr><td>mandar</td><td>manda (la foto)</td></tr>
   <tr><td>avisar</td><td>avisa</td></tr>
  </table>
  <h3>The eight irregulars (memorize as one chunk)</h3>
  <table class="grammar-table">
   <tr><th>Verbo</th><th>Mandato</th></tr>
   <tr><td>decir</td><td><b>di</b> (dime = tell me)</td></tr>
   <tr><td>hacer</td><td><b>haz</b> (hazlo = do it)</td></tr>
   <tr><td>ir</td><td><b>ve</b> (ve a la tienda)</td></tr>
   <tr><td>poner</td><td><b>pon</b> (pon la mesa = set the table)</td></tr>
   <tr><td>salir</td><td><b>sal</b> (sal de ahí)</td></tr>
   <tr><td>ser</td><td><b>sé</b> (sé paciente)</td></tr>
   <tr><td>tener</td><td><b>ten</b> (ten cuidado = be careful)</td></tr>
   <tr><td>venir</td><td><b>ven</b> (ven acá = come here)</td></tr>
  </table>
  <p>Memory line: <i>di, haz, ve, pon, sal, sé, ten, ven.</i> Say it as a rhythm.</p>
  <div class="callout"><b>Pronouns attach to positive commands:</b> dame (give me), dime (tell me), mándame (send me), avísame (let me know), espérame (wait for me), llámame (call me), ayúdame (help me). With two pronouns: dámelo, dímelo, mándamela.</div>
 `},
 {title:"Negativo: la forma \"contraria\"", body:`
  <p>Negative tú commands use a different form: take the yo form, drop the -o, and add the opposite ending: -AR verbs get <b>-es</b>, -ER/-IR verbs get <b>-as</b>.</p>
  <table class="grammar-table">
   <tr><th>Positivo</th><th>Negativo</th></tr>
   <tr><td>habla</td><td>no habl<b>es</b></td></tr>
   <tr><td>come</td><td>no com<b>as</b></td></tr>
   <tr><td>escribe</td><td>no escrib<b>as</b></td></tr>
   <tr><td>hazlo</td><td>no lo hag<b>as</b> (from hago)</td></tr>
   <tr><td>dime</td><td>no me dig<b>as</b> (from digo)</td></tr>
   <tr><td>ven</td><td>no veng<b>as</b> (from vengo)</td></tr>
   <tr><td>vete (go away)</td><td>no te vay<b>as</b> (irregular)</td></tr>
   <tr><td>preocúpate</td><td>no te preocup<b>es</b></td></tr>
  </table>
  <p>Pronouns go <b>in front</b> in negative commands: <i>no me digas</i>, <i>no te preocupes</i>, <i>no lo hagas</i>.</p>
  <div class="callout teal"><b>Top texting commands:</b> dime (tell me), avísame (let me know), mándame (send me), llámame (call me), espera (wait), ven (come), no te preocupes (don't worry), no me digas (no way / you're kidding), tranquila (relax), dale (go ahead).</div>
  <div class="callout"><b>"No me digas"</b> is more often an exclamation ("no way!") than a real command. If a cousin tells you something surprising, "¡No me digas!" is the perfect reaction.</div>
 `},
 {title:"En contexto", body:`
  <div class="example-row"><div class="example-es"><span class="verb">Avísame</span> cuando llegues.</div><div class="example-en">Let me know when you get there.</div><div class="example-note">avisar + me.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Mándame</span> la dirección, porfa.</div><div class="example-en">Send me the address, please.</div><div class="example-note">porfa = por favor, casual.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Ven</span> acá, <span class="verb">mira</span> esto.</div><div class="example-en">Come here, look at this.</div><div class="example-note">ven (irregular) + mira (regular).</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">No te preocupes</span>, yo lo llevo.</div><div class="example-en">Don't worry, I'll take it.</div><div class="example-note">Negative, pronoun in front.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Dime</span> a qué hora y voy.</div><div class="example-en">Tell me what time and I'll go.</div><div class="example-note">di + me.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Ten</span> cuidado en la carretera.</div><div class="example-en">Be careful on the road.</div><div class="example-note">ten cuidado: what her mom will say to you.</div></div>
 `},

{
 id:"mandatos-usted", n:15, unitName:U3,
 title:"Mandatos con usted",
 sub:"pase, siéntese, dígame, no se preocupe: polite requests to elders",
 intro:"With her parents and grandparents you'll need polite commands: come in, sit down, tell me, don't worry. Usted commands use the same \"opposite ending\" form as the negative tú commands from Lesson 14, positive and negative alike, so you already know the mechanism. This lesson adds the forms, the softeners that make a command feel like an invitation, and the ones you'll hear directed at you.",
 outro:"You can now host and be hosted politely. Next: asking questions that sound natural instead of textbook.",
 homework:"Next time her parents visit or you visit them, use three: pase, siéntese, and one \"dígame\".",
 steps:[
 {title:"La forma", body:`
  <p>Take the <b>yo</b> form, drop the -o, add the opposite ending: -AR verbs get <b>-e</b>, -ER/-IR verbs get <b>-a</b>. Same form for positive and negative. Plural (ustedes): add -n.</p>
  <table class="grammar-table">
   <tr><th>Infinitivo (yo)</th><th>usted / ustedes</th></tr>
   <tr><td>pasar (paso)</td><td>pase / pasen (come in)</td></tr>
   <tr><td>esperar (espero)</td><td>espere / esperen</td></tr>
   <tr><td>comer (como)</td><td>coma / coman</td></tr>
   <tr><td>decir (digo)</td><td>diga / digan</td></tr>
   <tr><td>venir (vengo)</td><td>venga / vengan</td></tr>
   <tr><td>tener (tengo)</td><td>tenga / tengan</td></tr>
   <tr><td>hacer (hago)</td><td>haga / hagan</td></tr>
   <tr><td>poner (pongo)</td><td>ponga / pongan</td></tr>
   <tr><td>sentarse (me siento)</td><td>siéntese / siéntense</td></tr>
   <tr><td>preocuparse</td><td>no se preocupe / no se preocupen</td></tr>
  </table>
  <p>Five irregulars: ir → <b>vaya</b>, ser → <b>sea</b>, saber → <b>sepa</b>, dar → <b>dé</b>, estar → <b>esté</b>. You'll mostly hear "vaya con Dios" and "que esté bien".</p>
  <div class="callout"><b>Pronouns:</b> attached to positive (<i>dígame, siéntese, páselo</i>), in front of negative (<i>no se preocupe, no me diga</i>). Same rule as tú.</div>
  <div class="callout teal"><b>This same form is the subjunctive.</b> You'll see it after "que" in wishes: <i>que le vaya bien</i> (hope it goes well for you), <i>que esté bien</i> (take care), <i>que descanse</i> (rest well). You don't need to learn the subjunctive yet, but notice you're already using it.</div>
 `},
 {title:"Suavizadores y frases hechas", body:`
  <p>A bare command to an elder can sound abrupt even in usted. Wrap it:</p>
  <table class="grammar-table">
   <tr><th>Frase</th><th>Uso</th></tr>
   <tr><td>Pase, pase.</td><td>Come in (doubled = warmer)</td></tr>
   <tr><td>Siéntese, por favor.</td><td>Please sit.</td></tr>
   <tr><td>Dígame.</td><td>Tell me / Yes? (answering a call or a "señor?")</td></tr>
   <tr><td>No se preocupe.</td><td>Don't worry.</td></tr>
   <tr><td>Disculpe, ¿me permite?</td><td>Excuse me, may I? (reaching past someone)</td></tr>
   <tr><td>¿Me hace el favor de...?</td><td>Would you do me the favor of...</td></tr>
   <tr><td>Con permiso.</td><td>Excuse me (leaving, passing).</td></tr>
   <tr><td>Que le vaya bien.</td><td>Take care / hope it goes well (goodbye).</td></tr>
   <tr><td>Que descanse.</td><td>Rest well (at night).</td></tr>
   <tr><td>Buen provecho.</td><td>Enjoy your meal.</td></tr>
  </table>
  <h3>What they'll say to you</h3>
  <p><i>Siéntate, mijo</i> (tú, because they're older). <i>Come, come</i> (eat, eat). <i>Ten cuidado</i>. <i>Avísanos cuando llegues</i> (let us know). <i>No seas tímido</i> (don't be shy). Elders use tú with you; you use usted with them. That asymmetry is normal and warm.</p>
 `},
 {title:"En contexto", body:`
  <div class="example-row"><div class="example-es"><span class="verb">Pase</span>, doña Ana, <span class="verb">siéntese</span>.</div><div class="example-en">Come in, doña Ana, have a seat.</div><div class="example-note">Hosting her mom.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Dígame</span>, ¿en qué le ayudo?</div><div class="example-en">Yes? How can I help you?</div><div class="example-note">Answering when an elder calls your name.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">No se preocupe</span>, yo llevo a Maria.</div><div class="example-en">Don't worry, I'll take Maria.</div><div class="example-note">Negative, se in front.</div></div>
  <div class="example-row"><div class="example-es">Disculpe, ¿<span class="verb">me permite</span> pasar?</div><div class="example-en">Excuse me, may I get by?</div><div class="example-note">Politer than "con permiso" alone.</div></div>
  <div class="example-row"><div class="example-es">Que <span class="verb">le vaya</span> bien, don Carlos.</div><div class="example-en">Take care, don Carlos.</div><div class="example-note">Goodbye formula.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Coman</span>, que hay bastante.</div><div class="example-en">Eat up, there's plenty.</div><div class="example-note">ustedes; what her mom says to the table.</div></div>
 `},

/* ---------------------------------------------------------------- 16 */
{
 id:"preguntas", n:16, unitName:U3,
 title:"Preguntas naturales",
 sub:"Question words, tag questions, and keeping a conversation going",
 intro:"You understand more than you can say, and the fastest way to close that gap is asking good questions: they hand the talking to the other person and buy you listening time. This lesson covers the question words with their accents, the tag questions Venezuelans use constantly (¿verdad?, ¿no?, ¿o qué?), and a set of follow-ups that keep any family conversation rolling.",
 outro:"Unit 3 complete. You can address, request, and ask like a member of the family. Unit 4 is the Maracucho ear and mouth.",
 homework:"At the next family meal, ask three questions and follow each with \"¿y usted?\" or \"¿y tú?\".",
 steps:[
 {title:"Las palabras interrogativas", body:`
  <table class="grammar-table">
   <tr><th>Palabra</th><th>Ejemplo</th></tr>
   <tr><td>¿qué? (what)</td><td>¿Qué hiciste? ¿Qué es esto?</td></tr>
   <tr><td>¿cuál? / ¿cuáles? (which)</td><td>¿Cuál prefieres? ¿Cuál es tu número?</td></tr>
   <tr><td>¿quién? / ¿quiénes? (who)</td><td>¿Quién es él? ¿Con quién fuiste?</td></tr>
   <tr><td>¿cuándo? (when)</td><td>¿Cuándo llegan?</td></tr>
   <tr><td>¿dónde? (where)</td><td>¿Dónde queda? ¿De dónde eres?</td></tr>
   <tr><td>¿adónde? (where to)</td><td>¿Adónde vamos?</td></tr>
   <tr><td>¿cómo? (how)</td><td>¿Cómo se dice? ¿Cómo está?</td></tr>
   <tr><td>¿cuánto/a? ¿cuántos/as? (how much/many)</td><td>¿Cuánto cuesta? ¿Cuántos años tienes?</td></tr>
   <tr><td>¿por qué? (why)</td><td>¿Por qué no vino?</td></tr>
  </table>
  <div class="callout"><b>Accents matter here:</b> qué with an accent is "what?"; que without is "that". <i>¿Qué dijo?</i> vs <i>Dijo que sí.</i> Same for dónde/donde, cómo/como, cuándo/cuando. In texting people drop them; in your head, keep them.</div>
  <div class="callout teal"><b>qué vs cuál:</b> "¿Cuál es tu número?" not "¿Qué es tu número?". Rule of thumb: before "es", use cuál unless you're asking for a definition. <i>¿Qué es una hallaca?</i> (definition) vs <i>¿Cuál es tu hallaca favorita?</i> (choice).</div>
  <p>Prepositions go in front of the question word, never at the end: <i>¿Con quién?</i> (who with), <i>¿De dónde?</i> (where from), <i>¿Para qué?</i> (what for), <i>¿A qué hora?</i> (at what time).</p>
 `},
 {title:"Preguntas de sí/no y coletillas", body:`
  <p>Yes/no questions are just statements with rising intonation. No word-order change needed: <i>¿Tienes hambre? ¿Vienen mañana?</i></p>
  <h3>Tag questions (coletillas)</h3>
  <table class="grammar-table">
   <tr><th>Coletilla</th><th>Ejemplo</th></tr>
   <tr><td>¿verdad? (right?)</td><td>Ustedes son de Maracaibo, ¿verdad?</td></tr>
   <tr><td>¿no? (right?, casual)</td><td>Está buenísimo, ¿no?</td></tr>
   <tr><td>¿cierto? (right?)</td><td>Llegan el viernes, ¿cierto?</td></tr>
   <tr><td>¿o qué? (or what?, very casual)</td><td>¿Vamos o qué?</td></tr>
   <tr><td>¿va? (okay?)</td><td>Nos vemos a las ocho, ¿va?</td></tr>
   <tr><td>¿sí? (yeah?)</td><td>Me avisas, ¿sí?</td></tr>
  </table>
  <h3>Follow-ups that keep it going</h3>
  <ul>
   <li><b>¿Y tú? / ¿Y usted?</b> And you? (always have this ready)</li>
   <li><b>¿Y eso?</b> How come? / What's that about?</li>
   <li><b>¿Cómo así?</b> How so? What do you mean?</li>
   <li><b>¿En serio?</b> Really? · <b>¿De verdad?</b> For real?</li>
   <li><b>¿Y qué pasó?</b> And what happened? · <b>¿Y después?</b> And then?</li>
   <li><b>Cuéntame.</b> Tell me about it. · <b>Cuénteme.</b> (usted)</li>
   <li><b>¿Cómo era?</b> What was it like? (opens the imperfect stories)</li>
  </ul>
  <div class="callout"><b>The listening trick:</b> "¿Cómo era Maracaibo?" or "¿Y cómo fue eso?" gets you a five-minute story where you only have to nod and say "¿en serio?" and "¿y después?". That's real conversation practice with zero pressure to produce.</div>
 `},
 {title:"En contexto", body:`
  <div class="example-row"><div class="example-es">¿<span class="verb">De dónde</span> es usted exactamente, de Maracaibo mismo?</div><div class="example-en">Where exactly are you from, Maracaibo proper?</div><div class="example-note">Preposition first.</div></div>
  <div class="example-row"><div class="example-es">¿<span class="verb">Cuánto tiempo</span> llevan aquí en la Florida?</div><div class="example-en">How long have you all been here in Florida?</div><div class="example-note">Combines Lesson 7.</div></div>
  <div class="example-row"><div class="example-es">Ustedes se conocieron en Maracaibo, ¿<span class="verb">verdad</span>?</div><div class="example-en">You two met in Maracaibo, right?</div><div class="example-note">Tag question to confirm what you half-know.</div></div>
  <div class="example-row"><div class="example-es">¿<span class="verb">Y eso</span>? ¿<span class="verb">Cómo así</span>?</div><div class="example-en">How come? What do you mean?</div><div class="example-note">Two follow-ups in a row.</div></div>
  <div class="example-row"><div class="example-es">¿<span class="verb">Cuál</span> es su plato favorito?</div><div class="example-en">What's your favorite dish?</div><div class="example-note">cuál before es for a choice.</div></div>
  <div class="example-row"><div class="example-es">¿<span class="verb">Cómo era</span> la vida allá? <span class="verb">Cuénteme</span>.</div><div class="example-en">What was life like there? Tell me.</div><div class="example-note">The story-opener.</div></div>
 `},

  {stem:"¿___ quién fuiste a la fiesta?", hint:"preposition + who", ans:"con", tr:"Who did you go to the party with?"},

  {stem:"¿___ queda el restaurante?", hint:"where", ans:"dónde", acc:["donde"], tr:"Where's the restaurant?"},
  {stem:"¿___ es esto?", hint:"what (definition)", ans:"qué", acc:["que"], tr:"What is this?"},

/* ---------------------------------------------------------------- 17 */
{
 id:"fonetica", n:17, unitName:U4,
 title:"Fonética caribeña",
 sub:"Why \"¿Dónde estás?\" sounds like \"¿Ónde ehtáh?\"",
 intro:"Your biggest listening problem isn't vocabulary, it's that Caribbean Spanish deletes and softens sounds you've been trained to expect. The good news: the changes are systematic. There are about six of them, they apply everywhere, and once your ear knows the rules it starts filling in the missing letters automatically. This lesson names each rule, shows it on real phrases, and gives you a decoding method.",
 outro:"You now know what Maracucho speech is doing to the words you learned. Next: the words themselves, the slang and expressions that make it Maracucho.",
 homework:"Listen to one Guaco or Rawayana song with the lyrics open and mark every dropped s.",
 steps:[
 {title:"Las seis reglas", body:`
  <table class="grammar-table">
   <tr><th>Regla</th><th>Ejemplo (escrito → hablado)</th></tr>
   <tr><td><b>1. s at the end of a syllable → h or silent</b></td><td>estás → ehtáh · los tequeños → loh tequeñoh · ¿cómo estás? → ¿cómo ehtáh?</td></tr>
   <tr><td><b>2. d between vowels (especially -ado/-ido) → disappears</b></td><td>cansado → cansao · comido → comío · nada → na'</td></tr>
   <tr><td><b>3. r at the end of a word → soft or gone</b></td><td>comer → comé · hacer → hacé · calor → caló · por favor → po' favó</td></tr>
   <tr><td><b>4. para → pa', para el → pal</b></td><td>voy para la casa → voy pa' la casa · para el mercado → pal mercao</td></tr>
   <tr><td><b>5. está / estoy → 'tá / 'toy</b></td><td>está bien → 'tá bien · estoy cansado → 'toy cansao</td></tr>
   <tr><td><b>6. dónde → ónde, todo → to', muy → mu</b></td><td>¿dónde está? → ¿ónde 'tá? · todo el mundo → to' el mundo</td></tr>
  </table>
  <div class="callout"><b>The s rule is the big one.</b> It hits plurals (las arepas → lah arepah), verb endings (tienes → tieneh, estamos → ehtamoh), and the word "es" itself (es que → eh que). Your brain has to learn to hear a slight breath, or nothing, and still register "s".</div>
  <div class="callout teal"><b>What doesn't change:</b> vowels. Caribbean Spanish keeps vowels crisp, which is why the rhythm still carries the sentence. Listen for vowels and word stress; let the consonants be a suggestion.</div>
 `},
 {title:"Método de decodificación", body:`
  <p>When you hear something that doesn't parse, run this in order:</p>
  <ul>
   <li><b>Add s back</b> at the end of any syllable with a breathy gap. "ehtáh" → estás. "loh chamoh" → los chamos.</li>
   <li><b>Add d back</b> into any "ao" or "ío" at the end of a word. "cansao" → cansado. "comío" → comido.</li>
   <li><b>Add r back</b> to any verb that ends in a stressed é/á/í. "comé" → comer. "trabajá" → trabajar.</li>
   <li><b>Expand pa'</b> to para, and <b>'tá/'toy</b> to está/estoy.</li>
  </ul>
  <p>Practice pairs (say the left, hear the right):</p>
  <table class="grammar-table">
   <tr><th>Escrito</th><th>Hablado</th></tr>
   <tr><td>¿Qué vas a hacer?</td><td>¿Qué vah a hacé?</td></tr>
   <tr><td>Estamos listos.</td><td>'Tamoh lihtoh.</td></tr>
   <tr><td>Vamos para la casa.</td><td>Vamoh pa' la casa.</td></tr>
   <tr><td>Estoy cansado, nada más.</td><td>'Toy cansao, na' máh.</td></tr>
   <tr><td>¿Dónde están los tequeños?</td><td>¿Ónde 'tán loh tequeñoh?</td></tr>
   <tr><td>Hace mucho calor, ¿verdad?</td><td>Hace mucho caló, ¿verdá?</td></tr>
  </table>
  <div class="callout"><b>Speed:</b> Maracuchos also talk fast and run words together. "¿Qué es lo que pasa?" becomes "¿Qué eh lo que pasa?" said as one word. Don't try to catch every word. Catch the stressed vowels and the verb, then ask "¿cómo?" if you need the rest.</div>
  <div class="callout teal"><b>Should you talk this way?</b> A little, naturally, over time. Dropping a final s here and there sounds relaxed. Forcing it sounds like a costume. Focus on understanding; your own accent will drift on its own.</div>
 `},
 {title:"En contexto", body:`
  <div class="example-row"><div class="example-es"><span class="verb">¿Cómo ehtáh?</span> = ¿Cómo estás?</div><div class="example-en">How are you?</div><div class="example-note">s → h twice.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">'Toy full, gracia'.</span> = Estoy full, gracias.</div><div class="example-en">I'm stuffed, thanks.</div><div class="example-note">estoy → 'toy; final s gone.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Vamo' pal mercao.</span> = Vamos para el mercado.</div><div class="example-en">Let's go to the market.</div><div class="example-note">para el → pal; d gone.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">¿Ónde 'tá tu hermana?</span> = ¿Dónde está tu hermana?</div><div class="example-en">Where's your sister?</div><div class="example-note">dónde → ónde; está → 'tá.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Lah arepah ehtán lihtah.</span> = Las arepas están listas.</div><div class="example-en">The arepas are ready.</div><div class="example-note">Four s's, all aspirated.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Ehpérate, ya vengo.</span> = Espérate, ya vengo.</div><div class="example-en">Hold on, I'll be right back.</div><div class="example-note">Internal s too.</div></div>
 `},

  {k:"mc", stem:"\"¿Ónde 'tá?\" means:", opts:["Where is it/he/she?","Who is it?","When is it?"], ans:0, note:"dónde → ónde; está → 'tá."},
  {k:"mc", stem:"What stays crisp in Caribbean Spanish?", opts:["Final consonants","Vowels","The letter s"], ans:1, note:"Listen for vowels and stress."},
  {k:"mc", stem:"Should you force a Maracucho accent when speaking?", opts:["Yes, always drop every s","No, understand it first; let your accent drift naturally","Only with elders"], ans:1, note:"Forced accents sound like costumes."},
  {k:"mc", stem:"\"Vamo' pal mercao\" contains how many of the six rules?", opts:["One","Two","Three"], ans:2, note:"s dropped (vamos), para el → pal, d dropped (mercado)."}

/* ---------------------------------------------------------------- 18 */
{
 id:"maracucho", n:18, unitName:U4,
 title:"Vocabulario maracucho",
 sub:"molleja, vergación, chévere, vaina: what to say and what to only recognize",
 intro:"Maracaibo has the most distinctive slang in Venezuela and the family is proud of it. Some of it you should use (chévere, fino, chamo, qué molleja); some of it you should understand but leave to them (vergación, arrecho, and anything with coño). This lesson sorts the vocabulary by register, explains the handful of words that mean something different in Zulia than in the textbooks, and gives you the reactions and fillers that make you sound like you belong at the table.",
 outro:"You can now follow and join family banter. Next: the Spanglish layer, so nothing they say catches you off guard.",
 homework:"Use \"qué molleja\" once, in front of a cousin, about something genuinely impressive. Watch their face.",
 steps:[
 {title:"Úsalas: seguras con todos", body:`
  <table class="grammar-table">
   <tr><th>Palabra</th><th>Significado y uso</th></tr>
   <tr><td>chévere</td><td>cool, great. Universal Venezuelan. "Todo chévere" = all good.</td></tr>
   <tr><td>fino</td><td>cool, great, deal. "¿Vamos a las ocho?" "Fino."</td></tr>
   <tr><td>chamo / chama</td><td>guy / girl, dude. Also "kid". "Ese chamo es mi primo."</td></tr>
   <tr><td>pana</td><td>buddy, friend. "Mi pana." Also as adjective: "es muy pana" = he's really cool.</td></tr>
   <tr><td>de pana</td><td>for real, seriously. "¿De pana?" = seriously?</td></tr>
   <tr><td>burda de</td><td>a ton of, super. "Burda de bueno" = really good. "Burda de gente" = tons of people.</td></tr>
   <tr><td>dale / dale pues</td><td>okay, go ahead, sounds good.</td></tr>
   <tr><td>¡qué molleja!</td><td>wow / no way. THE Maracucho exclamation. Positive or negative surprise. Fine with family.</td></tr>
   <tr><td>¡épale!</td><td>hey! (greeting) or whoa! (surprise).</td></tr>
   <tr><td>full</td><td>full, packed, a lot. "Estoy full" (stuffed). "Full trabajo" (tons of work).</td></tr>
   <tr><td>na' guará</td><td>Maracucho for "wow, dang". Softer than vergación. Locals will love hearing it.</td></tr>
   <tr><td>la vaina</td><td>the thing, the stuff. Mildly vulgar origin, now neutral. "¿Qué es esa vaina?" = what's that thing?</td></tr>
  </table>
  <div class="callout teal"><b>Zulia-specific meanings:</b> <i>conseguir</i> = to find (not just get). <i>arrecho</i> in Zulia can mean "awesome" (¡qué arrecho!) but elsewhere means angry or horny; hear it, don't say it. <i>mollejúo</i> = huge, awesome (from molleja). <i>verga</i> in Maracaibo is a generic noun for "thing" the way "vaina" is, but it's vulgar; the family will use it, you shouldn't yet.</div>
 `},
 {title:"Reconócelas: déjalas a la familia", body:`
  <table class="grammar-table">
   <tr><th>Palabra</th><th>Qué es</th></tr>
   <tr><td>vergación</td><td>Maracucho intensifier, "damn / holy". Vulgar-ish but extremely common. Wait until elders use it with you.</td></tr>
   <tr><td>¡verga!</td><td>"damn!". Vulgar. Recognize only.</td></tr>
   <tr><td>coño</td><td>"damn / shit". Vulgar, everywhere in Venezuela. "Coño de la madre" is strong.</td></tr>
   <tr><td>arrecho / arrechísimo</td><td>see note above: great, or angry. Context.</td></tr>
   <tr><td>ladilla / ladillado</td><td>annoying / annoyed, bored. "Qué ladilla" = what a pain. Casual, fine among peers.</td></tr>
   <tr><td>bolsa</td><td>dummy, idiot (mild). "No seas bolsa."</td></tr>
   <tr><td>güevón</td><td>dude (between friends) or idiot (as insult). Very common, very casual. Recognize.</td></tr>
   <tr><td>marico / marica</td><td>used between close friends like "dude", but it's a slur in origin. Never yours to use.</td></tr>
   <tr><td>rumba / rumbear</td><td>party / to party. Fine to use.</td></tr>
   <tr><td>bochinche</td><td>a ruckus, a loud mess. "¡Qué bochinche!"</td></tr>
   <tr><td>guachimán</td><td>watchman (from "watchman"). Security guard.</td></tr>
   <tr><td>cónchale</td><td>"dang / shoot". Softer version of coño. Fine to use.</td></tr>
  </table>
  <h3>Reactions and fillers</h3>
  <ul>
   <li><b>¡No me digas!</b> No way! · <b>¡En serio!</b> Seriously! · <b>¿De pana?</b> For real?</li>
   <li><b>Sí, vale.</b> Yeah, sure. · <b>Bueno...</b> Well... · <b>O sea...</b> I mean... · <b>Este...</b> Um...</li>
   <li><b>Qué chimbo.</b> That sucks. (casual) · <b>Qué broma.</b> What a drag / what a thing. (broma = thing, not joke, in Venezuela)</li>
   <li><b>Ya va.</b> Hold on / wait. · <b>Ahorita.</b> In a bit / right now.</li>
   <li><b>Tranquilo.</b> No worries. · <b>Está bien.</b> It's fine.</li>
  </ul>
  <div class="callout"><b>Broma and vaina:</b> both mean "thing" in Venezuelan Spanish. "Pásame esa broma" = hand me that thing. "Esa vaina no sirve" = that thing doesn't work. broma is cleaner; vaina is a bit rougher but fine with family.</div>
 `},
 {title:"En contexto", body:`
  <div class="example-row"><div class="example-es">¡<span class="verb">Qué molleja</span>! ¿Ustedes hicieron todo esto?</div><div class="example-en">Wow! You all made all this?</div><div class="example-note">Positive surprise at the spread.</div></div>
  <div class="example-row"><div class="example-es">Tu primo es muy <span class="verb">pana</span>, me cayó <span class="verb">burda de</span> bien.</div><div class="example-en">Your cousin is really cool, I liked him a lot.</div><div class="example-note">pana as adjective, burda de as intensifier.</div></div>
  <div class="example-row"><div class="example-es">¿Vamos a la playa el sábado? <span class="verb">Fino</span>, <span class="verb">dale pues</span>.</div><div class="example-en">Beach on Saturday? Cool, sounds good.</div><div class="example-note">Two agreement words.</div></div>
  <div class="example-row"><div class="example-es">Pásame esa <span class="verb">broma</span>, porfa.</div><div class="example-en">Hand me that thing, please.</div><div class="example-note">broma = thing.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Qué ladilla</span> el tráfico hoy.</div><div class="example-en">Traffic was such a pain today.</div><div class="example-note">Casual complaint, fine with cousins.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Na' guará</span>, está haciendo un <span class="verb">calorón</span>.</div><div class="example-en">Dang, it's brutally hot.</div><div class="example-note">Maracucho softener + the classic complaint.</div></div>
 `},

/* ---------------------------------------------------------------- 19 */
{
 id:"spanglish", n:19, unitName:U4,
 title:"Spanglish y code-switching",
 sub:"parquear, el mall, \"so\": how a bilingual family actually talks",
 intro:"After twenty years in South Florida, the family speaks a third thing: Spanish with English parts snapped in. Verbs get Spanish endings (parquear, textear), nouns keep their English form with a Spanish article (el mall, la app), and whole sentences flip languages mid-stream. None of this is wrong; it's a dialect. Your job is to recognize it instantly, understand the rules for when they switch, and know which bits you can adopt without sounding like you're mocking them.",
 outro:"The bilingual layer decoded. Next: texting, where Spanglish and abbreviations meet.",
 homework:"Listen for three code-switches at the next family gathering. Note what triggered each one.",
 steps:[
 {title:"Los tres tipos", body:`
  <h3>1. Verbos anglicados (English root + Spanish endings)</h3>
  <table class="grammar-table">
   <tr><th>Spanglish</th><th>Español estándar</th></tr>
   <tr><td>parquear</td><td>estacionar (to park)</td></tr>
   <tr><td>textear</td><td>escribir / mandar un mensaje (to text)</td></tr>
   <tr><td>chequear</td><td>revisar (to check)</td></tr>
   <tr><td>rentar</td><td>alquilar (to rent)</td></tr>
   <tr><td>aplicar (para un trabajo)</td><td>solicitar (to apply)</td></tr>
   <tr><td>googlear</td><td>buscar en Google</td></tr>
   <tr><td>janguear</td><td>pasar el rato (to hang out)</td></tr>
   <tr><td>printear</td><td>imprimir (to print)</td></tr>
   <tr><td>lonchar</td><td>almorzar (to have lunch)</td></tr>
   <tr><td>wachar</td><td>mirar (to watch), less common in Florida</td></tr>
  </table>
  <p>They conjugate like normal -AR verbs: parqueé, chequeaste, textéame.</p>
  <h3>2. Sustantivos prestados (English noun, Spanish article)</h3>
  <p><i>el mall, la app, el break, el parking, el lunch, el weekend, el laptop, la troca</i> (truck, more Mexican), <i>el bill, los taxes, el freeway, la cash, el email.</i> Gender is usually masculine by default unless the English word "feels" feminine (la app, la cash).</p>
  <h3>3. Cambio de código (switching mid-sentence)</h3>
  <p><i>"Fuimos al mall y then we got lunch, ¿te acuerdas?"</i> Fully grammatical in both languages, joined at a natural break. Common triggers: a word that's easier in English (work terms, tech), a quote of something said in English, emphasis ("¡No! Absolutely not."), or addressing a younger relative who's more English-dominant.</p>
 `},
 {title:"Cuándo cambian, y qué puedes usar tú", body:`
  <table class="grammar-table">
   <tr><th>Situación</th><th>Idioma probable</th></tr>
   <tr><td>Grandparents in the room</td><td>Spanish</td></tr>
   <tr><td>Cousins under 25 among themselves</td><td>English, with Spanish reactions</td></tr>
   <tr><td>Food, family, Venezuela, feelings</td><td>Spanish</td></tr>
   <tr><td>Work, money, tech, U.S. logistics</td><td>English or Spanglish</td></tr>
   <tr><td>Jokes and teasing</td><td>Whichever lands harder</td></tr>
   <tr><td>Talking to you specifically</td><td>English by default; Spanish if you start in Spanish</td></tr>
  </table>
  <div class="callout teal"><b>Your move:</b> start in Spanish and hold it. When they answer in English, reply in Spanish anyway (unless it's getting in the way of an actual conversation). They'll follow your lead about half the time, which is half more Spanish practice than you'd get otherwise.</div>
  <div class="callout"><b>Safe to adopt:</b> the nouns (el mall, la app, el weekend) and the discourse markers everyone uses (so, like, okay, you know). <b>Careful with:</b> the anglicized verbs. "Parquear" from you sounds fine in Florida; "textear" is fine; but if you reach for standard Spanish (estacionar, escribir) you'll sound like you studied, which is also fine. Either way works. Don't invent new ones.</div>
  <h3>English words that mean something else</h3>
  <ul>
   <li><b>aplicar</b> = to apply (for a job), standard Spanish uses solicitar. Fine here.</li>
   <li><b>realizar</b> in Spanglish gets used as "realize"; standard Spanish means "to carry out". Real Spanish for realize: darse cuenta.</li>
   <li><b>carpeta</b> = folder, not carpet (alfombra). A classic.</li>
   <li><b>soportar</b> = to put up with, not to support (apoyar).</li>
   <li><b>embarazada</b> = pregnant, not embarrassed (avergonzado). Please remember this one.</li>
  </ul>
 `},

{
 id:"textear", n:20, unitName:U4,
 title:"Textear en español",
 sub:"Abbreviations, tone, jajaja, and what to actually send",
 intro:"Texting your girlfriend is your second-highest priority and it's the one skill you can practice fifty times a day. Spanish texting has its own spelling (q, xq, tmb, ntp), its own laugh (jajaja, never haha), and a register that's more affectionate than English by default. This lesson is a field guide: the abbreviations, the openers and closers, the affection words, and a set of template messages you can send today.",
 outro:"Unit 4 done. You can hear, speak, and text like someone who belongs. Unit 5 is the wedding.",
 homework:"Send five texts today in Spanish. Use at least two abbreviations and one jajaja.",
 steps:[
 {title:"Abreviaturas y ortografía de chat", body:`
  <table class="grammar-table">
   <tr><th>Chat</th><th>Completo</th></tr>
   <tr><td>q / k</td><td>que / qué</td></tr>
   <tr><td>xq / pq / porq</td><td>porque / por qué</td></tr>
   <tr><td>tmb / tb</td><td>también</td></tr>
   <tr><td>ntp</td><td>no te preocupes</td></tr>
   <tr><td>tqm / tkm</td><td>te quiero mucho</td></tr>
   <tr><td>x</td><td>por (x favor, x eso)</td></tr>
   <tr><td>toy / tas / ta</td><td>estoy / estás / está</td></tr>
   <tr><td>pa / pal</td><td>para / para el</td></tr>
   <tr><td>bn</td><td>bien</td></tr>
   <tr><td>bno</td><td>bueno</td></tr>
   <tr><td>dnd</td><td>dónde</td></tr>
   <tr><td>cmo</td><td>cómo</td></tr>
   <tr><td>xfa / porfa</td><td>por favor</td></tr>
   <tr><td>mñn</td><td>mañana</td></tr>
   <tr><td>fin de</td><td>fin de semana</td></tr>
   <tr><td>d</td><td>de</td></tr>
   <tr><td>+ / -</td><td>más / menos</td></tr>
   <tr><td>salu2</td><td>saludos (dated but you'll see it)</td></tr>
  </table>
  <div class="callout"><b>Laughing:</b> <i>jajaja</i> (normal), <i>jajajaja</i> (funnier), <i>jeje</i> (sly), <i>jiji</i> (cute/sneaky), <i>JAJAJA</i> (dying). Never "haha": in Spanish, h is silent, so "haha" reads as "aa". Also common: <i>😂</i>, <i>💀</i>, <i>🤣</i>.</div>
  <div class="callout teal"><b>Accents and ¿¡ in texts:</b> most people drop them. "Q haces?" is normal. You can drop them too; it actually reads more natural. Use them when you want to be clear or affectionate.</div>
 `},
 {title:"Tono, cariño y plantillas", body:`
  <h3>Aperturas</h3>
  <p><i>Hola bb · Buenos días mi amor · Hey · Épale · Q más · Q haces · Cmo amaneciste (how'd you wake up / good morning) · Ya despertaste?</i></p>
  <h3>Cariño (affection, used constantly)</h3>
  <p><i>mi amor, amor, bb, bebé, mi vida, mi cielo, corazón, mi reina, mami</i> (yes, mami; it's affectionate, not weird), <i>linda / lindo, hermosa, preciosa, guapo.</i> Venezuelans use these in almost every message. "Ok mi amor" is a normal reply to "I'll be there at 8".</p>
  <h3>Cierres</h3>
  <p><i>tqm · te amo · besos · un beso · chao · chao bb · nos vemos · hablamos · descansa (sleep well) · sueña conmigo (dream of me) · cuídate.</i></p>
  <h3>Plantillas que puedes mandar hoy</h3>
  <table class="grammar-table">
   <tr><th>Situación</th><th>Mensaje</th></tr>
   <tr><td>Morning</td><td>Buenos días mi amor, cmo amaneciste? 🌞</td></tr>
   <tr><td>Checking in</td><td>Q haces bb? Toy en el trabajo, full.</td></tr>
   <tr><td>Plans</td><td>Nos vemos a las 8? Va?</td></tr>
   <tr><td>On the way</td><td>Ya voy en camino, 15 min. Ntp.</td></tr>
   <tr><td>After a good night</td><td>La pasé burda de bien anoche. Tqm.</td></tr>
   <tr><td>Running late</td><td>Amor, voy tarde, xfa espérame 10 min.</td></tr>
   <tr><td>Goodnight</td><td>Descansa mi vida, mñn hablamos. Te amo.</td></tr>
   <tr><td>Reacting to news</td><td>No me digas!! Jajaja q molleja</td></tr>
  </table>
  <div class="callout"><b>Voice notes (notas de voz):</b> the family sends them constantly. Listen at 1x first, then 0.75x if needed. Reply with a voice note back when you can; even a clumsy 10-second one lands better than a perfect text.</div>
 `},
 {title:"En contexto", body:`
  <div class="example-row"><div class="example-es"><span class="verb">Q haces</span> bb? <span class="verb">Toy</span> aburrido</div><div class="example-en">What are you doing babe? I'm bored</div><div class="example-note">q = qué; toy = estoy; no accents.</div></div>
  <div class="example-row"><div class="example-es"><span class="verb">Ntp</span>, ya voy <span class="verb">pa</span> allá</div><div class="example-en">Don't worry, I'm heading over there</div><div class="example-note">ntp; pa = para.</div></div>
  <div class="example-row"><div class="example-es">Jajaja <span class="verb">xq</span> no me dijiste?</div><div class="example-en">Hahaha why didn't you tell me?</div><div class="example-note">xq = por qué.</div></div>
  <div class="example-row"><div class="example-es">Yo <span class="verb">tmb</span> te extraño, <span class="verb">tqm</span> ❤️</div><div class="example-en">I miss you too, love you lots</div><div class="example-note">tmb; tqm.</div></div>
  <div class="example-row"><div class="example-es">Descansa <span class="verb">mi vida</span>, <span class="verb">mñn</span> hablamos</div><div class="example-en">Sleep well my love, we'll talk tomorrow</div><div class="example-note">Goodnight formula.</div></div>
  <div class="example-row"><div class="example-es">Llego <span class="verb">+ o -</span> a las 9, <span class="verb">va</span>?</div><div class="example-en">I'll get there around 9, okay?</div><div class="example-note">+ o - = más o menos.</div></div>
 `},
